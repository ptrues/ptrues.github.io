 {"path": "src/breda_pilot/adopted/network.py", "code": "\"\"\"The bike network: the OpenStreetMap ways bikes may legally use (DEC-028, DEC-033), with bikes allowed both ways on most one-way streets (DEC-044, DEC-055).\"\"\"\n\n# ==============================================================================\n# Inputs and dependencies\n# ==============================================================================\n\n# Let type hints name classes defined later in the file.\nfrom __future__ import annotations\n\n# atan2 and degrees turn a short stretch of line into a compass bearing.\nfrom math import atan2, degrees\n\n# GeoPandas holds the network's lines and their tags as a table.\nimport geopandas as gpd\n# NetworkX holds the network as a graph to route on.\nimport networkx as nx\n# Pandas holds the yes/no flags, one per edge.\nimport pandas as pd\n# pyproj moves longitude and latitude into meters.\nfrom pyproj import Transformer\n# Shapely draws each edge as a straight line.\nfrom shapely.geometry import LineString, Point\n# A spatial index finds the lines near a point quickly.\nfrom shapely.strtree import STRtree\n\n# The OpenStreetMap tags that can record a painted lane or a cycle track.\nLANE_KEYS = [\"cycleway\", \"cycleway:left\", \"cycleway:right\", \"cycleway:both\"]\n# The values of those tags that mean a lane or a track.\nLANE_VALUES = [\"lane\", \"opposite_lane\", \"track\", \"opposite_track\"]\n# The tags the rules below read; every other tag is dropped.\nWAY_TAGS = [\"highway\", \"area\", \"access\", \"vehicle\", \"bicycle\", \"oneway\", \"oneway:bicycle\", \"junction\", \"name\", *LANE_KEYS]\n# A reverse edge's key is its original's plus this, so the two never share a name.\nKEY_OFFSET = 10\n\n\n# ==============================================================================\n# Section 1: who may ride where, by OpenStreetMap's tags\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# tag — one tag's value, without stray spaces, or None when the tag is absent.\n# ------------------------------------------------------------------------------\ndef tag(tags: dict, key: str):\n    # The value as written.\n    value = tags.get(key)\n    # Trimmed, if it is text at all.\n    return value.strip() if isinstance(value, str) else None\n\n\n# ------------------------------------------------------------------------------\n# may_ride — whether bikes may legally ride a way (DEC-033: OpenStreetMap's own\n# access tags decide). Roads and cycleways are open unless a tag closes them;\n# paths and footways are open only when a tag explicitly allows bikes.\n# ------------------------------------------------------------------------------\ndef may_ride(tags: dict, rules: dict) -> bool:\n    # The way's road type.\n    highway = tag(tags, \"highway\")\n    # Cycleways and public roads start open.\n    if highway in rules[\"highway\"][\"cycleway\"] or highway in rules[\"highway\"][\"public_road\"]:\n        # They need no permission.\n        needs_permission = False\n    # Paths, footways and the like start closed.\n    elif highway in rules[\"highway\"][\"needs_bicycle_permission\"]:\n        # They need a tag allowing bikes.\n        needs_permission = True\n    # Every other road type (motorways, steps, ...) is closed.\n    else:\n        return False\n    # A square drawn as an area is not a route.\n    if rules[\"exclude_area_yes\"] and tag(tags, \"area\") == \"yes\":\n        return False\n    # The bicycle tag.\n    bicycle = tag(tags, \"bicycle\")\n    # It can close the way to bikes...\n    if bicycle in rules[\"bicycle_forbidden\"]:\n        return False\n    # ...or open it, whatever else is tagged.\n    if bicycle in rules[\"bicycle_permitted\"]:\n        return True\n    # A vehicle or access tag can close it too.\n    for key in (\"vehicle\", \"access\"):\n        # Closed by this tag.\n        if tag(tags, key) in rules[\"access_forbidden\"]:\n            return False\n    # Open, unless it is a path still waiting for a permission it does not have.\n    return not needs_permission\n\n\n# ------------------------------------------------------------------------------\n# bike_direction — which way bikes may ride along a way, by its tags: forward\n# (the way's drawing order), backward, or both.\n# ------------------------------------------------------------------------------\ndef bike_direction(tags: dict, rules: dict) -> str:\n    # The one-way rules.\n    ow = rules[\"oneway\"]\n    # A one-way tag just for bikes wins.\n    override = tag(tags, ow[\"bicycle_override_key\"])\n    # One-way forward for bikes.\n    if override in ow[\"forward\"]:\n        return \"forward\"\n    # One-way backward for bikes.\n    if override in ow[\"backward\"]:\n        return \"backward\"\n    # Two-way for bikes.\n    if override in ow[\"bicycle_two_way\"]:\n        return \"both\"\n    # A cycleway tag starting \"opposite\" means bikes may ride against the flow.\n    for key in ow[\"opposite_keys\"]:\n        # Its value.\n        value = tag(tags, key)\n        # Two-way for bikes.\n        if value and value.startswith(ow[\"opposite_prefix\"]):\n            return \"both\"\n    # Otherwise the general one-way tag.\n    oneway = tag(tags, \"oneway\")\n    # One-way forward.\n    if oneway in ow[\"forward\"]:\n        return \"forward\"\n    # One-way backward.\n    if oneway in ow[\"backward\"]:\n        return \"backward\"\n    # Explicitly two-way.\n    if oneway in ow[\"two_way\"]:\n        return \"both\"\n    # A roundabout is one-way forward unless tagged otherwise.\n    if ow[\"roundabout_implies_oneway\"] and tag(tags, \"junction\") == \"roundabout\":\n        return \"forward\"\n    # Untagged: two-way.\n    return \"both\"\n\n\n# ==============================================================================\n# Section 2: the legal network, built from the ways\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# legal_network — the junctions and edges bikes may use.\n# Takes the extract's nodes and ways and the access rules. Splits each way at\n# its nodes, one edge per direction, keeps the edges bikes may ride in that\n# direction, and returns the junctions (id, location) and edges (ends, key,\n# way, tags, length, line) in meters.\n# ------------------------------------------------------------------------------\ndef legal_network(nodes: dict, ways: list, rules: dict):\n    # From longitude and latitude to meters (RD New).\n    to_rd = Transformer.from_crs(\"EPSG:4326\", \"EPSG:28992\", always_xy=True)\n    # A directed graph that allows several edges between two junctions.\n    whole = nx.MultiDiGraph()\n    # Every way, in the file's order.\n    for way_id, refs, tags in ways:\n        # Its nodes that the extract holds.\n        present = [r for r in refs if r in nodes]\n        # Only the tags the rules read.\n        kept = {k: v for k, v in tags.items() if k in WAY_TAGS}\n        # Each consecutive pair of nodes is a piece of the way.\n        for u, v in zip(present, present[1:]):\n            # One edge in the way's drawing order, one against it.\n            for a, b, rev in ((u, v, False), (v, u, True)):\n                # Add it, with its way, its direction and its tags.\n                whole.add_edge(a, b, osmid=way_id, reversed=rev, **kept)\n    # Every junction's location in meters.\n    for n in whole.nodes:\n        # Moved from longitude and latitude.\n        x, y = to_rd.transform(nodes[n][0], nodes[n][1])\n        # Stored on the junction.\n        whole.nodes[n].update(x=x, y=y)\n    # The kept network: the same junctions, in the same order, for now.\n    legal = nx.MultiDiGraph()\n    # Copy the junctions.\n    legal.add_nodes_from(whole.nodes(data=True))\n    # Every edge, in order.\n    for u, v, k, d in whole.edges(keys=True, data=True):\n        # Skip it unless bikes may ride the way.\n        if not may_ride(d, rules):\n            continue\n        # Which way bikes may ride it.\n        direction = bike_direction(d, rules)\n        # Skip it when it runs against a one-way direction.\n        if direction != \"both\" and (direction == \"forward\") == bool(d[\"reversed\"]):\n            continue\n        # Its length: the straight line between its two junctions.\n        dx, dy = whole.nodes[u][\"x\"] - whole.nodes[v][\"x\"], whole.nodes[u][\"y\"] - whole.nodes[v][\"y\"]\n        # Keep it, with its length and bike direction.\n        legal.add_edge(u, v, key=k, **d, length_m=(dx * dx + dy * dy) ** 0.5, bike_direction=direction)\n    # Drop junctions no kept edge touches.\n    legal.remove_nodes_from([n for n in list(legal.nodes) if legal.degree(n) == 0])\n    # The junctions as a table: id as text, location as a point.\n    junctions = gpd.GeoDataFrame([{\"node\": str(n), \"geometry\": Point(d[\"x\"], d[\"y\"])} for n, d in legal.nodes(data=True)], crs=\"EPSG:28992\")\n    # The edges as a table, ids and keys as text, each drawn as a straight line.\n    edges = gpd.GeoDataFrame(\n        [{\"u\": str(u), \"v\": str(v), \"key\": str(k), \"osmid\": d[\"osmid\"], **{t: d.get(t) for t in WAY_TAGS}, \"length_m\": d[\"length_m\"],\n          \"bike_direction\": d[\"bike_direction\"], \"geometry\": LineString([(legal.nodes[u][\"x\"], legal.nodes[u][\"y\"]), (legal.nodes[v][\"x\"], legal.nodes[v][\"y\"])])}\n         for u, v, k, d in legal.edges(keys=True, data=True)], crs=\"EPSG:28992\")\n    # Both, for the rest of the run.\n    return junctions, edges\n\n\n# ==============================================================================\n# Section 3: bikes both ways on one-way streets (DEC-044, read from OSM alone)\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# bearing_at — the compass bearing of a line at a distance along it, measured\n# over 2 m either side, in degrees clockwise from north.\n# ------------------------------------------------------------------------------\ndef bearing_at(line, distance: float) -> float:\n    # A point 2 m before (or the line's start).\n    a = line.interpolate(max(0.0, distance - 2.0))\n    # A point 2 m after (or the line's end).\n    b = line.interpolate(min(line.length, distance + 2.0))\n    # The direction from the first point to the second.\n    return degrees(atan2(b.x - a.x, b.y - a.y)) % 360.0\n\n\n# ------------------------------------------------------------------------------\n# turn — how far apart two bearings are, from 0 (same way) to 180 (opposite).\n# ------------------------------------------------------------------------------\ndef turn(a: float, b: float) -> float:\n    # The raw difference, wrapped into one circle.\n    d = abs(a - b) % 360.0\n    # The shorter way round.\n    return min(d, 360.0 - d)\n\n\n# ------------------------------------------------------------------------------\n# text — a tag's value as text, with a missing tag read as empty.\n# ------------------------------------------------------------------------------\ndef text(value) -> str:\n    # Missing tags arrive as None or as a float NaN; both mean \"no tag\".\n    return \"\" if value is None or (isinstance(value, float) and value != value) else str(value)\n\n\n# ------------------------------------------------------------------------------\n# two_way_for_bikes — which one-way pieces bikes may also ride against the flow.\n# A one-way road that cars use opens both ways for bikes, unless OSM tags a\n# lane or track on it, it is a roundabout, it is tagged one-way for bikes, or\n# it is half of a divided road. Returns a yes/no flag per edge.\n# ------------------------------------------------------------------------------\ndef two_way_for_bikes(edges: gpd.GeoDataFrame, mixed: list[str], dual_m: float, opposite_deg: float, dual_way_share: float) -> pd.Series:\n    # A piece is one-way for bikes when its bike direction is forward or backward.\n    one_way = edges[\"bike_direction\"].isin([\"forward\", \"backward\"])\n    # Only one-way roads that cars use too (the mixed highway types) are considered.\n    motor = one_way & edges[\"highway\"].isin(mixed)\n    # A piece has a lane or track when any lane tag says so.\n    lane = edges[LANE_KEYS].isin(LANE_VALUES).any(axis=1)\n    # A roundabout stays one-way.\n    roundabout = edges[\"junction\"].isin([\"roundabout\", \"circular\"])\n    # A road the map explicitly marks one-way for bikes stays one-way.\n    explicit = edges[\"oneway:bicycle\"].astype(str).eq(\"yes\")\n    # The candidates: one-way mixed roads with none of those three exceptions.\n    candidate = motor & ~lane & ~roundabout & ~explicit\n    # Next, find the candidates that are one half of a divided road.\n    pool = edges[motor]\n    # The lines of every one-way mixed road, which the other half of a divided road must be among.\n    lines = list(pool.geometry)\n    # Index them so the ones near a point are found quickly.\n    tree = STRtree(lines)\n    # Each pooled line's street name.\n    names = [text(x) for x in pool[\"name\"]]\n    # Each pooled line's road type.\n    highways = [text(x) for x in pool[\"highway\"]]\n    # Each pooled line's OpenStreetMap way number.\n    ways = [text(x) for x in pool[\"osmid\"]]\n    # Start with no piece marked as a divided half.\n    half = pd.Series(False, index=edges.index)\n    # Look at each candidate piece in turn.\n    for i, row in edges[candidate].iterrows():\n        # The piece's midpoint.\n        mid = row.geometry.interpolate(0.5, normalized=True)\n        # The direction the piece runs at its midpoint.\n        own = bearing_at(row.geometry, row.geometry.length / 2)\n        # Its name, road type and way number.\n        name, highway, way = text(row[\"name\"]), text(row[\"highway\"]), text(row[\"osmid\"])\n        # Every one-way mixed road whose box comes within dual_m of the midpoint.\n        for j in tree.query(mid.buffer(dual_m)):\n            # A piece of the same way is not its other half.\n            if ways[j] == way:\n                continue\n            # The line itself must come within dual_m, not just its box.\n            if lines[j].distance(mid) > dual_m:\n                continue\n            # When either has a name, the names must match.\n            if name or names[j]:\n                # Different streets: try the next.\n                if name != names[j]:\n                    continue\n            # When neither has a name, the road types must match instead.\n            elif highway != highways[j]:\n                continue\n            # The other line must run (nearly) the opposite way where it passes the midpoint.\n            if turn(own, bearing_at(lines[j], lines[j].project(mid))) >= opposite_deg:\n                # So this piece is half of a divided road.\n                half[i] = True\n                # One match is enough.\n                break\n    # The candidate pieces only, to judge whole ways.\n    c = edges[candidate]\n    # Each candidate piece's length.\n    length = c[\"length_m\"].astype(float)\n    # For each way, the share of its candidate length that is a divided half.\n    share = (length * half[candidate]).groupby(c[\"osmid\"]).sum() / length.groupby(c[\"osmid\"]).sum()\n    # A way is a divided half when at least dual_way_share of it is; all its candidate pieces stay one-way.\n    divided = edges[\"osmid\"].isin(set(share[share >= dual_way_share].index)) & candidate\n    # Every other candidate opens both ways for bikes.\n    return candidate & ~divided\n\n\n# ------------------------------------------------------------------------------\n# add_reverse_edges — the edges, plus a reverse edge for every piece that opens\n# both ways, drawn the other way so distances along it start at its new start.\n# ------------------------------------------------------------------------------\ndef add_reverse_edges(edges: gpd.GeoDataFrame, opened: pd.Series) -> gpd.GeoDataFrame:\n    # Copy the opened pieces.\n    rev = edges[opened.to_numpy()].copy()\n    # The reverse runs from the original's end...\n    rev[\"u\"] = edges.loc[opened.to_numpy(), \"v\"].to_numpy()\n    # ...to its start.\n    rev[\"v\"] = edges.loc[opened.to_numpy(), \"u\"].to_numpy()\n    # It gets its own key.\n    rev[\"key\"] = [str(int(k) + KEY_OFFSET) for k in rev[\"key\"]]\n    # Its line is drawn the other way.\n    rev[\"geometry\"] = rev.geometry.reverse()\n    # The originals followed by the reverses.\n    return gpd.GeoDataFrame(pd.concat([edges, rev], ignore_index=True), geometry=\"geometry\", crs=edges.crs)\n\n\n# ==============================================================================\n# Section 4: the graph to ride on\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# bike_graph — the network as a directed graph: one node per junction, one edge\n# per direction of travel, each with its length.\n# ------------------------------------------------------------------------------\ndef bike_graph(nodes: gpd.GeoDataFrame, edges: gpd.GeoDataFrame) -> nx.MultiDiGraph:\n    # A directed graph that allows more than one edge between two nodes.\n    graph = nx.MultiDiGraph()\n    # Add every junction, in order.\n    graph.add_nodes_from(nodes[\"node\"])\n    # Add every edge from its start to its end, with its length, in order.\n    for u, v, key, length in zip(edges[\"u\"], edges[\"v\"], edges[\"key\"], edges[\"length_m\"]):\n        # The length is what the ride is timed on.\n        graph.add_edge(u, v, key=key, length_m=float(length))\n    # The network to ride on.\n    return graph\n", "lang": "python", "defs": [{"name": "tag", "line": 43}, {"name": "may_ride", "line": 55}, {"name": "bike_direction", "line": 93}, {"name": "legal_network", "line": 143}, {"name": "bearing_at", "line": 205}, {"name": "turn", "line": 217}, {"name": "text", "line": 227}, {"name": "two_way_for_bikes", "line": 238}, {"name": "add_reverse_edges", "line": 311}, {"name": "bike_graph", "line": 334}]}}}, {"id": "walking.py", "kind": "module", "label": "walking.py", "cite": "", "x": 1000, "y": -259.0, "w": 190, "h": 62, "info": {"code": {"path": "src/breda_pilot/adopted/walking.py", "code": "\"\"\"The walking network: the OpenStreetMap ways a person may walk with a bike in hand (INV-002, DEC-026).\"\"\"\n\n# ==============================================================================\n# Inputs and dependencies\n# ==============================================================================\n\n# Let type hints name classes defined later in the file.\nfrom __future__ import annotations\n\n# GeoPandas holds the ways and junctions as map layers.\nimport geopandas as gpd\n# NetworkX holds the walking network as a graph.\nimport networkx as nx\n# Pandas holds tables of rows.\nimport pandas as pd\n# pyproj moves longitude and latitude into meters.\nfrom pyproj import Transformer\n# Shapely draws the ways and junctions.\nfrom shapely.geometry import LineString, Point\n\n\n# ==============================================================================\n# Section 1: what blocks a pushed bike\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# tag — one tag's value, without stray spaces, or None when the tag is absent.\n# ------------------------------------------------------------------------------\ndef tag(tags: dict, key: str):\n    # The value as written.\n    value = tags.get(key)\n    # Trimmed, if it is text at all.\n    return value.strip() if isinstance(value, str) else None\n\n\n# ------------------------------------------------------------------------------\n# pushable — whether a bike can be pushed along a way: not indoors, not on a\n# moving walkway or escalator, and not up steps unless they have a bike ramp.\n# ------------------------------------------------------------------------------\ndef pushable(tags: dict, rules: dict) -> bool:\n    # Indoor ways and moving walkways are out.\n    for key, values in rules[\"exclude_when\"].items():\n        # This way carries one of those tags.\n        if tag(tags, key) in values:\n            return False\n    # Steps are out unless a ramp tag says a bike can go up them.\n    if tag(tags, \"highway\") == rules[\"steps\"][\"highway_value\"]:\n        # A bike ramp, by either tag.\n        return any(tag(tags, key) in values for key, values in rules[\"steps\"][\"passable_when_any\"].items())\n    # Anything else can be pushed along.\n    return True\n\n\n# ------------------------------------------------------------------------------\n# passable — whether a pushed bike can get past a junction's barrier tag.\n# Bollards and the like pass; turnstiles and stiles do not; gates pass unless\n# locked or closed; a cycle barrier passes when bikes are allowed or it is at\n# least the minimum width; an unknown barrier blocks.\n# ------------------------------------------------------------------------------\ndef passable(tags: dict, rules: dict) -> bool:\n    # The barrier tag.\n    barrier = tag(tags, \"barrier\")\n    # No barrier: it passes.\n    if barrier is None:\n        return True\n    # Whether a tag closes the barrier (locked, or closed to people on foot).\n    closed = any(tag(tags, key) in values for key, values in rules[\"closed_when\"].items())\n    # Always blocked.\n    if barrier in rules[\"blocked\"]:\n        return False\n    # Passable, or passable unless closed.\n    if barrier in rules[\"passable\"] or barrier in rules[\"passable_unless_closed\"]:\n        return not closed\n    # A barrier with conditions (a cycle barrier).\n    conditional = rules[\"conditional\"].get(barrier)\n    # Its conditions.\n    if conditional is not None:\n        # Closed: blocked.\n        if closed:\n            return False\n        # A tag allowing bikes through.\n        if any(tag(tags, key) in values for key, values in conditional[\"passable_when_any\"].items()):\n            return True\n        # Its width, from either width tag.\n        for key in (\"maxwidth:physical\", \"maxwidth\"):\n            # The tag's value.\n            raw = tag(tags, key)\n            # Absent: try the next.\n            if raw is None:\n                continue\n            # The number at its start.\n            try:\n                width = float(raw.split()[0])\n            # Not a number: try the next.\n            except (ValueError, IndexError):\n                continue\n            # Wide enough: it passes; otherwise it is blocked.\n            return width >= float(conditional[\"min_physical_width_m\"])\n        # No width given: blocked.\n        return False\n    # A barrier type with no rule: blocked.\n    return False\n\n\n# ==============================================================================\n# Section 2: the walking network, built from the ways\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# walking_network — the walking graph and what the walks need from it.\n# Takes the extract's nodes and ways, the study area and the walking rules.\n# Keeps the ways of the walkable road types that touch the area and that no tag\n# closes to people on foot (INV-002's selected network), splits them at their\n# nodes, and keeps the pieces a bike can be pushed along. Returns the graph, the\n# barrier junctions a pushed bike cannot pass, and the junctions the kept\n# pieces touch, with their locations, and those pieces as lines.\n# ------------------------------------------------------------------------------\ndef walking_network(nodes: dict, ways: list, area, rules: dict):\n    # From longitude and latitude to meters (RD New).\n    to_rd = Transformer.from_crs(\"EPSG:4326\", \"EPSG:28992\", always_xy=True)\n    # The selected network's definition.\n    chosen = rules[\"network\"]\n    # The ways of the network, in the file's order.\n    kept = []\n    # Every highway way.\n    for way_id, refs, tags in ways:\n        # Its nodes that the extract holds.\n        present = [r for r in refs if r in nodes]\n        # A walkable road type, not drawn as an area, not closed to walking by a foot or access tag.\n        if (tags.get(\"highway\") not in chosen[\"highway\"] or tags.get(\"area\") == \"yes\"\n                or any(tags.get(key) in values for key, values in chosen[\"exclude_when\"].items())):\n            continue\n        # The way's line, in meters.\n        line = LineString([to_rd.transform(nodes[r][0], nodes[r][1]) for r in present])\n        # Only ways that touch the study area.\n        if line.intersects(area):\n            # Keep it.\n            kept.append((way_id, present, tags))\n    # Every node the kept ways use, in meters.\n    xy = {r: to_rd.transform(nodes[r][0], nodes[r][1]) for _, present, _ in kept for r in present}\n    # The pieces between consecutive nodes, and whether each can be pushed along.\n    pieces = []\n    # Each kept way...\n    for way_id, present, tags in kept:\n        # ...can be pushed along, or not.\n        ok = pushable(tags, rules[\"pushability\"])\n        # Each consecutive pair of its nodes.\n        for start, end in zip(present, present[1:]):\n            # The two ends' locations.\n            (x1, y1), (x2, y2) = xy[start], xy[end]\n            # The straight length between them.\n            length = ((x1 - x2) ** 2 + (y1 - y2) ** 2) ** 0.5\n            # The piece.\n            pieces.append({\"u\": str(start), \"v\": str(end), \"key\": \"0\", \"length_m\": float(length), \"pushable\": ok,\n                           \"geometry\": LineString([(x1, y1), (x2, y2)])})\n    # As a map layer.\n    pieces = gpd.GeoDataFrame(pieces, crs=\"EPSG:28992\")\n    # Every junction the pieces use, in order of first use.\n    used = pd.unique(pd.concat([pieces[\"u\"], pieces[\"v\"]], ignore_index=True))\n    # The junctions a pushed bike cannot get past.\n    blocked = {n for n in used if not passable(nodes[int(n)][2], rules[\"pushability\"][\"barrier_nodes\"])}\n    # The pieces a bike can be pushed along.\n    walkable = pieces[pieces[\"pushable\"]].reset_index(drop=True)\n    # An undirected graph: walking goes both ways, and two pieces can join the same two junctions.\n    graph = nx.MultiGraph()\n    # Add each piece, in order, with its length.\n    for u, v, length in zip(walkable[\"u\"], walkable[\"v\"], walkable[\"length_m\"]):\n        # The walk is measured on the length.\n        graph.add_edge(u, v, length_m=length)\n    # The junctions those pieces touch, in order of first use, with their locations.\n    touching = set(walkable[\"u\"]) | set(walkable[\"v\"])\n    # As a map layer.\n    touched = gpd.GeoDataFrame([{\"node\": n, \"geometry\": Point(*xy[int(n)])} for n in used if n in touching], crs=\"EPSG:28992\")\n    # All four, for the walks and the homes.\n    return graph, blocked, touched, walkable\n", "lang": "python", "defs": [{"name": "tag", "line": 29}, {"name": "pushable", "line": 40}, {"name": "passable", "line": 60}, {"name": "walking_network", "line": 118}]}}}, {"id": "homes.py", "kind": "module", "label": "homes.py", "cite": "", "x": 1000, "y": 185.0, "w": 190, "h": 62, "info": {"code": {"path": "src/breda_pilot/adopted/homes.py", "code": "\"\"\"The homes: every residential address in the study area (BAG), and where each joins the walking network.\"\"\"\n\n# ==============================================================================\n# Inputs and dependencies\n# ==============================================================================\n\n# Let type hints name classes defined later in the file.\nfrom __future__ import annotations\n\n# GeoPandas reads the address register and finds nearest lines and points.\nimport geopandas as gpd\n# Pandas holds tables of rows.\nimport pandas as pd\n# Shapely measures straight-line distances.\nimport shapely\n\n\n# ------------------------------------------------------------------------------\n# homes — the in-use residential units inside the study area.\n# Takes the address register (BAG GeoPackage), its layer, the study area, and\n# which statuses count as in use and which use counts as residential. Returns\n# one point per home, with its BAG identifier, in the register's order.\n# ------------------------------------------------------------------------------\ndef homes(path, layer: str, area, statuses: list[str], use: str) -> gpd.GeoDataFrame:\n    # The register's units inside the area's bounding box, with the three columns needed.\n    units = gpd.read_file(path, layer=layer, bbox=tuple(area.bounds), columns=[\"identificatie\", \"status\", \"gebruiksdoel\"]).to_crs(\"EPSG:28992\")\n    # Only those inside the area itself.\n    units = units[units.geometry.within(area)]\n    # In use: one of the statuses that counts.\n    in_use = units[\"status\"].isin(statuses)\n    # Residential: the use list includes the residential use.\n    residential = units[\"gebruiksdoel\"].fillna(\"\").str.split(\",\").apply(lambda values: use in {v.strip() for v in values})\n    # The homes.\n    return units[in_use & residential][[\"identificatie\", \"geometry\"]]\n\n\n# ------------------------------------------------------------------------------\n# links — where each home joins the walking network, and how far it is.\n# A home may start its walk at either end of the nearest walkable piece, or at\n# the nearest walking junction; each start is measured as a straight line from\n# the home, and only starts within the connector limit count. Returns rows of\n# (home, junction, meters), ordered by home and then by distance.\n# ------------------------------------------------------------------------------\ndef links(units: gpd.GeoDataFrame, walkable: gpd.GeoDataFrame, touched: gpd.GeoDataFrame, connector_max_m: float) -> list:\n    # Number the homes.\n    points = units.reset_index(drop=True).reset_index(names=\"point_ix\")\n    # Number the walkable pieces.\n    lines = walkable.reset_index(drop=True).reset_index(names=\"edge_ix\")\n    # Each home's nearest walkable pieces within the limit; equally near pieces are all kept.\n    near = gpd.sjoin_nearest(points[[\"point_ix\", \"geometry\"]], lines[[\"edge_ix\", \"u\", \"v\", \"geometry\"]],\n                             how=\"left\", max_distance=connector_max_m, distance_col=\"projection_m\")\n    # Drop homes with no piece within the limit.\n    near = near[near[\"edge_ix\"].notna()].copy()\n    # Each row's home identifier.\n    near[\"identificatie\"] = near[\"point_ix\"].map(points[\"identificatie\"])\n    # One nearest piece per home: the first of any tie.\n    near = near.sort_values([\"identificatie\", \"projection_m\"]).drop_duplicates(\"identificatie\")\n    # Its two ends are starts.\n    ends = pd.concat([near[[\"identificatie\", \"u\"]].rename(columns={\"u\": \"node\"}), near[[\"identificatie\", \"v\"]].rename(columns={\"v\": \"node\"})], ignore_index=True)\n    # Each home's nearest walking junction within the limit is a start too.\n    nearest = gpd.sjoin_nearest(units[[\"identificatie\", \"geometry\"]], touched[[\"node\", \"geometry\"]], how=\"left\", distance_col=\"node_m\", max_distance=connector_max_m)\n    # One per home: the first of any tie; homes with none drop out.\n    nearest = nearest.sort_values(\"node_m\").drop_duplicates(\"identificatie\")[[\"identificatie\", \"node\"]].dropna(subset=[\"node\"])\n    # All starts, each home-junction pair once.\n    rows = pd.concat([ends, nearest], ignore_index=True).drop_duplicates([\"identificatie\", \"node\"])\n    # Each start's straight-line distance from its home.\n    rows[\"connector_m\"] = shapely.distance(units.set_index(\"identificatie\").geometry.reindex(rows[\"identificatie\"]).to_numpy(),\n                                           touched.set_index(\"node\").geometry.reindex(rows[\"node\"]).to_numpy()).astype(float)\n    # Only starts within the limit, by home and then nearest first.\n    rows = rows[rows[\"connector_m\"] <= connector_max_m].sort_values([\"identificatie\", \"connector_m\"])\n    # As a list of (home, junction, meters).\n    return list(zip(rows[\"identificatie\"], rows[\"node\"], rows[\"connector_m\"]))\n", "lang": "python", "defs": [{"name": "homes", "line": 24}, {"name": "links", "line": 44}]}}}, {"id": "walk.py", "kind": "module", "label": "walk.py", "cite": "", "x": 1000, "y": 259.0, "w": 190, "h": 62, "info": {"code": {"path": "src/breda_pilot/adopted/walk.py", "code": "\"\"\"The walks: from each home to the bike network, and from the bike network to each entrance (DEC-026, DEC-048's nearest start).\"\"\"\n\n# ==============================================================================\n# Inputs and dependencies\n# ==============================================================================\n\n# Let type hints name classes defined later in the file.\nfrom __future__ import annotations\n\n# A heap gives the search its next-nearest junction quickly.\nfrom heapq import heappop, heappush\n# A counter breaks ties between equally near junctions in the heap.\nfrom itertools import count\n\n# GeoPandas finds each walking junction's nearest bike edges.\nimport geopandas as gpd\n# NetworkX walks outward from each entrance.\nimport networkx as nx\n# NumPy compares walk lengths to within a nanometer.\nimport numpy as np\n# Pandas holds tables of rows.\nimport pandas as pd\n# Shapely measures how far along a line a point falls.\nimport shapely\n\n# The ride's timing.\nfrom breda_pilot.adopted.ride import seconds_from_mount\n\n\n# ==============================================================================\n# Section 1: where a walk meets the bike network\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# meeting_points — each walking junction's nearest bike edges, within the\n# offset limit, and how far along each edge the junction falls straight\n# across. A two-way street is two edges on one line, so each match also brings\n# its twin running the other way (RUN-040's fix). Positions past an edge's end\n# by a rounding hair are put back on the edge.\n# ------------------------------------------------------------------------------\ndef meeting_points(touched: gpd.GeoDataFrame, edges: gpd.GeoDataFrame, offset_max_m: float) -> pd.DataFrame:\n    # Number the junctions.\n    points = touched.reset_index(drop=True).reset_index(names=\"point_ix\")\n    # Number the bike edges.\n    lines = edges.reset_index(drop=True).reset_index(names=\"edge_ix\")\n    # For each junction, its nearest bike edges within the limit; equally near edges are all kept.\n    near = gpd.sjoin_nearest(points[[\"point_ix\", \"geometry\"]], lines[[\"edge_ix\", \"u\", \"v\", \"key\", \"length_m\", \"geometry\"]],\n                             how=\"left\", max_distance=float(offset_max_m), distance_col=\"offset_m\")\n    # Drop the junctions with no bike edge within the limit.\n    near = near[near[\"edge_ix\"].notna()].copy()\n    # Edge numbers back to whole numbers.\n    near[\"edge_ix\"] = near[\"edge_ix\"].astype(int)\n    # Each match's bike line.\n    geoms = lines.geometry.to_numpy()\n    # How far along that line, from its start, the junction falls straight across.\n    near[\"position_m\"] = shapely.line_locate_point(geoms[near[\"edge_ix\"].to_numpy()], points.geometry.to_numpy()[near[\"point_ix\"].to_numpy()])\n    # The edges, indexed by (start, end), to find twins.\n    twins = {}\n    # Each edge.\n    for i, (u, v) in enumerate(zip(lines[\"u\"], lines[\"v\"])):\n        # Several edges can share two ends.\n        twins.setdefault((u, v), []).append(i)\n    # The (junction, edge) pairs already found.\n    have = set(zip(near[\"point_ix\"], near[\"edge_ix\"]))\n    # The twins to add.\n    extra = []\n    # For each match...\n    for row in near.itertuples(index=False):\n        # ...look at each edge running the other way between the same two ends.\n        for j in twins.get((row.v, row.u), []):\n            # Skip one already found, or one drawn on a different line.\n            if (row.point_ix, j) in have or not geoms[j].equals(geoms[row.edge_ix]):\n                continue\n            # Remember it.\n            have.add((row.point_ix, j))\n            # The twin: same junction and distance, the position measured from its own start.\n            extra.append({\"point_ix\": row.point_ix, \"edge_ix\": j, \"u\": lines.loc[j, \"u\"], \"v\": lines.loc[j, \"v\"], \"key\": lines.loc[j, \"key\"],\n                          \"length_m\": lines.loc[j, \"length_m\"], \"position_m\": float(geoms[j].length) - float(row.position_m), \"offset_m\": row.offset_m})\n    # The matches and their twins together.\n    near = pd.concat([near, pd.DataFrame(extra)], ignore_index=True) if extra else near\n    # Each row's walking junction id.\n    near[\"node\"] = near[\"point_ix\"].map(points[\"node\"])\n    # Measured on the line, a point can fall a hair past the edge's stored length: put it back on the edge.\n    near[\"position_m\"] = near[\"position_m\"].clip(lower=0.0, upper=near[\"length_m\"].astype(float))\n    # The table: junction, bike edge, where along it, and how far across.\n    return near[[\"node\", \"u\", \"v\", \"key\", \"length_m\", \"position_m\", \"offset_m\"]].reset_index(drop=True)\n\n\n# ==============================================================================\n# Section 2: the walk at the entrances\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# entrance_starts — where the ride begins at each entrance.\n# From each entrance's own walking junction, walk outward (never into a\n# barrier) to the nearest points on the bike network within the walk limit;\n# exact ties all count. Returns, for each bike node a ride can start from, the\n# meters of edge between it and the nearest walk's meeting point.\n# ------------------------------------------------------------------------------\ndef entrance_starts(graph, blocked, meets: pd.DataFrame, entrances: gpd.GeoDataFrame, direction: str, walk_max_m: float) -> dict:\n\n    # The length of a step between two junctions, or no step at all into a barrier.\n    def step(u, v, ways):\n        # A barrier cannot be entered.\n        if v in blocked:\n            return None\n        # Otherwise the shortest of the ways between them.\n        return min(w[\"length_m\"] for w in ways.values())\n\n    # The ride's starting meters at each bike node.\n    rows = []\n    # For each entrance...\n    for entrance in entrances.itertuples(index=False):\n        # ...its OpenStreetMap node, read from its source reference: every entrance is a walking junction.\n        start = str(entrance.source).split(\"node/\")[1]\n        # Walk outward from there, up to the walk limit.\n        walked = nx.single_source_dijkstra_path_length(graph, start, cutoff=walk_max_m, weight=step)\n        # The meeting points at walked junctions (all within the offset limit already).\n        here = meets[meets[\"node\"].isin(list(walked))].copy()\n        # The whole walk to each: the network walk, then the straight step onto the bike edge.\n        here[\"walk_m\"] = here[\"node\"].map(walked) + here[\"offset_m\"]\n        # Keep those within the walk limit.\n        here = here[here[\"walk_m\"] <= walk_max_m + 1e-9]\n        # Keep only the nearest on foot; exact ties all stay.\n        here = here[np.isclose(here[\"walk_m\"], here[\"walk_m\"].min(), rtol=0.0, atol=1e-9)]\n        # To the station, the ride goes from the edge's start up to the meeting point...\n        if direction == \"to_station\":\n            # ...so it begins at the start node, that far along.\n            here[\"node_from\"], here[\"meters\"] = here[\"u\"], here[\"position_m\"]\n        # From the station, the ride leaves the meeting point toward the edge's end...\n        else:\n            # ...so it begins at the end node, the rest of the edge away.\n            here[\"node_from\"], here[\"meters\"] = here[\"v\"], here[\"length_m\"].astype(float) - here[\"position_m\"]\n        # Collect them.\n        rows.append(here[[\"node_from\", \"meters\"]])\n    # Each bike node's least meters to an entrance's walk.\n    return pd.concat(rows, ignore_index=True).groupby(\"node_from\")[\"meters\"].min().to_dict()\n\n\n# ==============================================================================\n# Section 3: the walk at the homes\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# nearest_meeting — from every walking junction, the meeting points nearest on\n# foot that have a ride to the entrances (DEC-048: a point with no ride is\n# walked past). Spreads outward from all meeting points at once, nearest first,\n# never into a barrier and never past the walk limit; ties at the same walk\n# are all kept. Returns {junction: [(walk meters, ride seconds, point), ...]}.\n# ------------------------------------------------------------------------------\ndef nearest_meeting(graph, blocked, meets: pd.DataFrame, seconds: dict, speed_kmh: float, direction: str, walk_max_m: float) -> dict:\n    # The settled meeting points at each junction.\n    fronts = {}\n    # The walks waiting to be settled, shortest first.\n    queue = []\n    # The tie-breaking counter.\n    order = count()\n    # Every meeting point is a place a walk can end.\n    for m in meets.itertuples(index=False):\n        # Not from a barrier.\n        if m.node in blocked:\n            continue\n        # The ride from this point to the entrances.\n        ride = seconds_from_mount(float(m.length_m), float(m.position_m), seconds.get(m.u), seconds.get(m.v), speed_kmh, direction)\n        # No ride means the walk goes on past it.\n        if ride is None:\n            continue\n        # Queue it at its junction: the straight step onto the bike edge is already walking.\n        heappush(queue, (float(m.offset_m), next(order), ride, m, m.node))\n    # Spread outward from the meeting points, nearest first.\n    while queue:\n        # The shortest walk not yet settled.\n        walk_m, _, ride, m, node = heappop(queue)\n        # This junction is already settled at a shorter walk: drop this one.\n        if node in fronts and walk_m != fronts[node][0][0]:\n            continue\n        # Settle this point here: ties at the same walk are all kept.\n        fronts.setdefault(node, []).append((walk_m, ride, m))\n        # Walk on to each neighboring junction.\n        for neighbor, ways in graph[node].items():\n            # Not into a barrier.\n            if neighbor in blocked:\n                continue\n            # Along the shortest way to it.\n            longer = walk_m + min(w[\"length_m\"] for w in ways.values())\n            # Not if that junction is already settled at a different walk.\n            if neighbor in fronts and longer != fronts[neighbor][0][0]:\n                continue\n            # Not past the walk limit.\n            if longer > walk_max_m:\n                continue\n            # Queue it.\n            heappush(queue, (longer, next(order), ride, m, neighbor))\n    # The nearest meeting points from every junction a walk reaches.\n    return fronts\n\n\n# ------------------------------------------------------------------------------\n# home_trips — each home's trip: its nearest network point on foot, then the\n# ride. The least walk wins, ties to the shorter ride; the home counts when\n# that walk is within the walk limit and that ride within the time budget. A\n# home whose nearest point fails is not re-routed (DEC-026).\n# ------------------------------------------------------------------------------\ndef home_trips(links: list, fronts: dict, walk_max_m: float, budget_s: float, walk_mps: float) -> dict:\n    # Each home's nearest trip so far: its (walk, ride), and the trip.\n    nearest = {}\n    # Each home can join the walking network in more than one place.\n    for home, node, connector_m in links:\n        # Each nearest meeting point from where it joins.\n        for walk_m, ride, m in fronts.get(node, ()):\n            # The whole walk, door to bike.\n            total = walk_m + connector_m\n            # The least walk wins; between equal walks, the shorter ride.\n            if home in nearest and nearest[home][0] <= (total, ride):\n                continue\n            # Keep this one.\n            nearest[home] = ((total, ride), {\"point\": home, \"connector_m\": connector_m, \"walk_m\": total, \"walk_s\": total / walk_mps,\n                                             \"cycle_s\": ride, \"total_s\": total / walk_mps + ride, \"transition_u\": m.u, \"transition_v\": m.v,\n                                             \"transition_key\": m.key, \"transition_position_m\": m.position_m, \"transition_offset_m\": m.offset_m})\n    # The homes reached: nearest walk within the limit, ride within the budget.\n    return {home: trip for home, ((total, ride), trip) in nearest.items() if total <= walk_max_m and ride <= budget_s}\n", "lang": "python", "defs": [{"name": "meeting_points", "line": 41}, {"name": "entrance_starts", "line": 100}, {"name": "nearest_meeting", "line": 151}, {"name": "home_trips", "line": 204}]}}}, {"id": "ride.py", "kind": "module", "label": "ride.py", "cite": "", "x": 1500, "y": 74.0, "w": 190, "h": 62, "info": {"code": {"path": "src/breda_pilot/adopted/ride.py", "code": "\"\"\"The ride: how long it takes to cycle between a point on the bike network and the entrances, at 15 km/h (DEC-003).\"\"\"\n\n# ==============================================================================\n# Inputs and dependencies\n# ==============================================================================\n\n# Let type hints name classes defined later in the file.\nfrom __future__ import annotations\n\n# A heap gives the search its next-nearest node quickly.\nfrom heapq import heappop, heappush\n# A counter breaks ties between equally near nodes in the heap, so they come out in the order they went in.\nfrom itertools import count\n# Infinity stands for \"not reached\".\nfrom math import inf\n\n\n# ------------------------------------------------------------------------------\n# ride_seconds — from every node the bike can reach, the seconds it takes to\n# ride to (or from) the entrances. A shortest-path search outward from the\n# nodes where the entrances' rides begin, each starting at the seconds already\n# ridden to reach it; no time limit is applied here, so a walk can see every\n# point with a ride (DEC-048). Returns {node: seconds}.\n# ------------------------------------------------------------------------------\ndef ride_seconds(graph, start_seconds: dict, speed_kmh: float, direction: str) -> dict:\n    # Turn km/h into meters per second, the unit the edge lengths need.\n    speed_mps = speed_kmh / 3.6\n    # Riding to the station means searching backwards from the entrances, so follow every edge the other way.\n    search = graph.reverse(copy=False) if direction == \"to_station\" else graph\n    # Seconds settled for good at each node.\n    settled = {}\n    # The best seconds seen so far at each node, settled or not.\n    seen = {}\n    # The nodes waiting to be settled, nearest first.\n    queue = []\n    # The tie-breaking counter.\n    order = count()\n    # Every network point next to an entrance starts the search.\n    for node, seconds in start_seconds.items():\n        # It starts at the seconds already spent riding from the entrance's walk to that node.\n        seen[node] = seconds\n        # Put it in the queue.\n        heappush(queue, (seconds, next(order), node))\n    # Keep going until nothing is left to settle.\n    while queue:\n        # Take the nearest unsettled node.\n        seconds, _, node = heappop(queue)\n        # A node can be queued more than once; only its first, fastest, time counts.\n        if node in settled:\n            # Skip the slower copy.\n            continue\n        # Settle it.\n        settled[node] = seconds\n        # Look at every neighbor along the direction of the search.\n        for neighbor, edges in search[node].items():\n            # Ride the shortest of any parallel edges to it.\n            candidate = seconds + min(edge[\"length_m\"] for edge in edges.values()) / speed_mps\n            # Keep it only if it beats the best time seen at that neighbor.\n            if candidate < seen.get(neighbor, inf):\n                # Remember the better time.\n                seen[neighbor] = candidate\n                # Queue the neighbor.\n                heappush(queue, (candidate, next(order), neighbor))\n    # Seconds from every reached node, with no time limit: the limit is applied to each home's trip later.\n    return settled\n\n\n# ------------------------------------------------------------------------------\n# seconds_from_mount — the seconds to ride from a point part-way along a bike\n# edge to the entrances (or from them to it), through the edge's end node that\n# leads there. Returns None when that node has no ride.\n# ------------------------------------------------------------------------------\ndef seconds_from_mount(length_m: float, position_m: float, u_seconds, v_seconds, speed_kmh: float, direction: str):\n    # Turn km/h into meters per second.\n    speed_mps = speed_kmh / 3.6\n    # To the station: ride on to the edge's end (v), then that node's seconds.\n    if direction == \"to_station\":\n        # No time at v means the station cannot be reached this way.\n        return None if v_seconds is None else (length_m - position_m) / speed_mps + v_seconds\n    # From the station: arrive at the edge's start (u), then ride back along to the mounting point.\n    return None if u_seconds is None else position_m / speed_mps + u_seconds\n", "lang": "python", "defs": [{"name": "ride_seconds", "line": 25}, {"name": "seconds_from_mount", "line": 73}]}}}], "edges": [{"from": "osm", "to": "r_access", "pts": [[345.0, -185.0], [405.0, -111.0]]}, {"from": "osm", "to": "p_walknet", "pts": [[345.0, -185.0], [405.0, -333.0], [595.0, -333.0], [655.0, -333.0], [845.0, -333.0], [905.0, -333.0], [1095.0, -333.0], [1155.0, -148.0]]}, {"from": "bag", "to": "p_attach", "pts": [[1095.0, -37.0], [1155.0, 0.0]]}, {"from": "dest", "to": "p_attach", "pts": [[1095.0, 111.0], [1155.0, 0.0]]}, {"from": "r_access", "to": "p_bike", "pts": [[595.0, -111.0], [655.0, -37.0]]}, {"from": "p_bike", "to": "r_contra", "pts": [[845.0, -37.0], [905.0, -111.0]]}, {"from": "p_walknet", "to": "r_walk", "pts": [[1345.0, -148.0], [1405.0, -74.0]]}, {"from": "r_contra", "to": "p_attach", "pts": [[1095.0, -111.0], [1155.0, 0.0]]}, {"from": "l_contra", "to": "r_contra", "pts": [[845.0, -111.0], [905.0, -111.0]]}, {"from": "p_attach", "to": "r_walk", "pts": [[1345.0, 0.0], [1405.0, -74.0]]}, {"from": "l_attach", "to": "p_attach", "pts": [[1095.0, 37.0], [1155.0, 0.0]]}, {"from": "r_walk", "to": "p_route", "pts": [[1595.0, -74.0], [1655.0, 0.0]]}, {"from": "l_walk", "to": "r_walk", "pts": [[1345.0, -74.0], [1405.0, -74.0]]}, {"from": "p_route", "to": "out_legal", "pts": [[1845.0, 0.0], [1905.0, 0.0]]}, {"from": "l_budget", "to": "p_route", "pts": [[1595.0, 0.0], [1655.0, 0.0]]}, {"from": "run.py", "to": "entrances.py", "pts": [[95.0, 0.0], [155.0, 37.0], [345.0, 37.0], [405.0, 111.0], [595.0, 111.0], [655.0, 111.0]]}, {"from": "run.py", "to": "osm.py", "pts": [[95.0, 0.0], [155.0, -111.0], [345.0, -111.0], [405.0, -185.0]]}, {"from": "run.py", "to": "network.py", "pts": [[95.0, 0.0], [155.0, -37.0]]}, {"from": "run.py", "to": "walking.py", "pts": [[95.0, 0.0], [155.0, -259.0], [345.0, -259.0], [405.0, -259.0], [595.0, -259.0], [655.0, -259.0], [845.0, -259.0], [905.0, -259.0]]}, {"from": "run.py", "to": "homes.py", "pts": [[95.0, 0.0], [155.0, 111.0], [345.0, 111.0], [405.0, 185.0], [595.0, 185.0], [655.0, 185.0], [845.0, 185.0], [905.0, 185.0]]}, {"from": "run.py", "to": "walk.py", "pts": [[95.0, 0.0], [155.0, 185.0], [345.0, 185.0], [405.0, 259.0], [595.0, 259.0], [655.0, 259.0], [845.0, 259.0], [905.0, 259.0]]}, {"from": "run.py", "to": "ride.py", "pts": [[95.0, 0.0], [155.0, 259.0], [345.0, 259.0], [405.0, 333.0], [595.0, 333.0], [655.0, 333.0], [845.0, 333.0], [905.0, 333.0], [1095.0, 333.0], [1155.0, 148.0], [1345.0, 148.0], [1405.0, 74.0]]}, {"from": "entrances.py", "to": "dest", "pts": [[845.0, 111.0], [905.0, 111.0]]}, {"from": "osm.py", "to": "p_bike", "pts": [[595.0, -185.0], [655.0, -37.0]]}, {"from": "osm.py", "to": "p_walknet", "pts": [[595.0, -185.0], [655.0, -185.0], [845.0, -185.0], [905.0, -185.0], [1095.0, -185.0], [1155.0, -148.0]]}, {"from": "network.py", "to": "r_access", "pts": [[345.0, -37.0], [405.0, -111.0]]}, {"from": "network.py", "to": "p_bike", "pts": [[345.0, -37.0], [405.0, -37.0], [595.0, -37.0], [655.0, -37.0]]}, {"from": "network.py", "to": "r_contra", "pts": [[345.0, -37.0], [405.0, 37.0], [595.0, 37.0], [655.0, 37.0], [845.0, 37.0], [905.0, -111.0]]}, {"from": "walking.py", "to": "p_walknet", "pts": [[1095.0, -259.0], [1155.0, -148.0]]}, {"from": "homes.py", "to": "p_attach", "pts": [[1095.0, 185.0], [1155.0, 0.0]]}, {"from": "walk.py", "to": "p_attach", "pts": [[1095.0, 259.0], [1155.0, 0.0]]}, {"from": "walk.py", "to": "r_walk", "pts": [[1095.0, 259.0], [1155.0, 74.0], [1345.0, 74.0], [1405.0, -74.0]]}, {"from": "ride.py", "to": "p_route", "pts": [[1595.0, 74.0], [1655.0, 0.0]]}], "groups": {"input": {"name": "Dataset", "colour": "#3B82F6"}, "script": {"name": "Script", "colour": "#F59E0B"}, "module": {"name": "Module", "colour": "#EAB308"}, "process": {"name": "Build step", "colour": "#94A3B8"}, "rule": {"name": "Rule", "colour": "#EF4444"}, "limit": {"name": "Chosen threshold", "colour": "#EC4899"}, "output": {"name": "Result", "colour": "#22C55E"}}, "crossings": 0};
const G = DATA.groups, byId = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const into = {}, out = {};
DATA.edges.forEach(e => { (into[e.to] ||= []).push(e.from); (out[e.from] ||= []).push(e.to); });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const chip = (kind, text, attrs = "") => `<span class="chip" style="--c:${G[kind].colour}" ${attrs}>${esc(text)}</span>`;

document.getElementById("legend").innerHTML = Object.keys(G)
  .filter(k => DATA.nodes.some(n => n.kind === k)).map(k => chip(k, G[k].name)).join("");

// ---- diagram
const NS = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(NS, "svg");
const vp = document.createElementNS(NS, "g");
vp.setAttribute("class", "svg-pan-zoom_viewport");
svg.appendChild(vp);
document.getElementById("canvas").prepend(svg);
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

function d(pts) {   // straight across a column's slot, a curve in the gap between columns
  let s = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    if (i % 2) { const m = (x0 + x1) / 2; s += ` C${m},${y0} ${m},${y1} ${x1},${y1}`; }
    else s += ` L${x1},${y1}`;
  }
  return s;
}
const edgeEls = DATA.edges.map(e => {
  const p = el("path", { class: "edge", d: d(e.pts) }, vp);
  p.dataset.from = e.from; p.dataset.to = e.to; return p;
});
function wrap(text, n) {
  const words = text.split(" "), lines = [];
  let cur = "";
  for (const w of words) { if ((cur + " " + w).trim().length > n && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) lines.push(cur);
  return lines.slice(0, 4);
}
const nodeEls = {};
DATA.nodes.forEach(n => {
  const code = n.kind === "script" || n.kind === "module";
  const g = el("g", { class: "node" + (code ? " code" : ""), transform: `translate(${n.x - n.w / 2},${n.y - n.h / 2})`, style: `--c:${G[n.kind].colour}` }, vp);
  el("rect", { class: "body", width: n.w, height: n.h, rx: 9 }, g);
  el("rect", { class: "stripe", width: 5, height: n.h - 16, x: 0, y: 8, rx: 2.5 }, g);
  const lines = wrap(n.label, code ? 26 : 30), lh = 13.5;
  lines.forEach((t, i) => { const tx = el("text", { x: 14, y: n.h / 2 + (i - (lines.length - 1) / 2) * lh + 4 }, g); tx.textContent = t; });
  g.addEventListener("click", ev => { ev.stopPropagation(); select(n.id); });
  nodeEls[n.id] = g;
});
const xs = DATA.nodes.flatMap(n => [n.x - n.w / 2, n.x + n.w / 2]), ys = DATA.edges.flatMap(e => e.pts.map(p => p[1])).concat(DATA.nodes.flatMap(n => [n.y - n.h / 2, n.y + n.h / 2]));
const pad = 30, [x0, x1, y0, y1] = [Math.min(...xs) - pad, Math.max(...xs) + pad, Math.min(...ys) - pad, Math.max(...ys) + pad];
svg.setAttribute("viewBox", `${x0} ${y0} ${x1 - x0} ${y1 - y0}`);
const pz = svgPanZoom(svg, { zoomScaleSensitivity: .25, minZoom: .4, maxZoom: 6, fit: true, center: true, dblClickZoomEnabled: false });
const main = document.querySelector("main");
document.getElementById("reset").onclick = () => { pz.resize(); pz.resetZoom(); pz.fit(); pz.center(); };
function frame(ids) {   // zoom and pan so these parts fill the canvas
  pz.resize();
  const ns = [...ids].map(k => byId[k]);
  const bx0 = Math.min(...ns.map(n => n.x - n.w / 2)) - 30, bx1 = Math.max(...ns.map(n => n.x + n.w / 2)) + 30;
  const by0 = Math.min(...ns.map(n => n.y - n.h / 2)) - 30, by1 = Math.max(...ns.map(n => n.y + n.h / 2)) + 30;
  const { width, height } = pz.getSizes();
  const want = Math.min(width / (bx1 - bx0), height / (by1 - by0), 1.3);
  pz.zoom(pz.getZoom() * want / pz.getSizes().realZoom);
  pz.pan({ x: width / 2 - (bx0 + bx1) / 2 * want, y: height / 2 - (by0 + by1) / 2 * want });
}
window.addEventListener("resize", () => { pz.resize(); pz.fit(); pz.center(); });
svg.addEventListener("click", () => select(null));

function upstream(id) {
  const seen = new Set([id]), stack = [id];
  while (stack.length) for (const p of into[stack.pop()] || []) if (!seen.has(p)) { seen.add(p); stack.push(p); }
  return seen;
}
function select(id) {
  svg.classList.toggle("focus", !!id);
  main.classList.toggle("open", !!id);
  Object.values(nodeEls).forEach(g => g.classList.remove("up", "sel"));
  edgeEls.forEach(p => p.classList.remove("up", "direct"));
  if (!id) { pz.resize(); pz.resetZoom(); pz.fit(); pz.center(); return; }
  const up = upstream(id), c = G[byId[id].kind].colour;
  svg.style.setProperty("--c", c);
  up.forEach(k => nodeEls[k].classList.add("up"));
  nodeEls[id].classList.add("sel");
  edgeEls.forEach(p => {
    if (up.has(p.dataset.to) && up.has(p.dataset.from)) p.classList.add("up");
    if (p.dataset.to === id) p.classList.add("direct");
    p.style.setProperty("--c", c);
  });
  edgeEls.filter(p => p.classList.contains("up")).forEach(p => vp.insertBefore(p, vp.querySelector(".node")));
  show(byId[id]);
  frame(new Set([...up, ...(out[id] || [])]));   // its inputs, and what it feeds for context
}

// ---- panel
const panel = document.getElementById("panel");
function links(n) {
  const list = ids => (ids || []).map(k => chip(byId[k].kind, byId[k].label.length > 34 ? byId[k].label.slice(0, 32) + "…" : byId[k].label, `data-go="${esc(k)}"`)).join("") || `<span>none</span>`;
  return `<div class="links"><span>Fed by</span><div>${list(into[n.id])}</div><span>Feeds</span><div>${list(out[n.id])}</div></div>`;
}
function source(code, lang, path, defs) {
  const n = code.split("\n").length;
  const hl = hljs.highlight(code, { language: lang, ignoreIllegals: true }).value;
  const idx = defs && defs.length ? `<div class="defs">${defs.map(d => `<button data-line="${d.line}">${esc(d.name)}</button>`).join("")}</div>` : "";
  return `<p class="meta">${esc(path)} · ${n.toLocaleString()} lines</p>${idx}
    <div class="src"><pre class="ln">${Array.from({ length: n }, (_, i) => i + 1).join("\n")}</pre><pre><code class="hljs">${hl}</code></pre></div>`;
}
function citedBlock(c) {
  if (!c) return "";
  const sec = (title, items) => items.length ? `<h4>${title}</h4><ul>${items.join("")}</ul>` : "";
  const body = sec("Literature", c.literature.map(r => `<li>${esc(r.ref)}${r.url && !r.ref.includes(r.url) ? ` <a href="${esc(r.url)}" target="_blank">${esc(r.url)}</a>` : ""}</li>`))
    + sec("Data sources", c.sources.map(s => `<li>${esc(s.title)}</li>`));
  return body ? `<div class="cited"><h3>Sources cited</h3>${body}</div>` : "";
}
function docView(dc) {
  if (dc.code !== undefined) return source(dc.code, dc.lang, dc.path);
  return `${dc.tab ? `<h3 class="title">${esc(dc.title)}</h3>` : `<p class="meta">${esc(dc.path)}</p>`}${dc.status ? `<p class="meta">${esc(dc.status)}</p>` : ""}
    <div class="md">${marked.parse(dc.md)}</div>${citedBlock(dc.cited)}`;
}
function show(n) {
  const g = G[n.kind], info = n.info || {};
  let tabs = [], note = "";
  if (info.code) tabs = [{ name: info.code.path, html: () => source(info.code.code, info.code.lang, info.code.path, info.code.defs) }];
  else {
    (info.docs || []).forEach(dc => tabs.push({ name: dc.tab || dc.title, title: dc.title, html: () => docView(dc) }));
    (info.files || []).forEach(dc => tabs.push({ name: dc.path.split("/").pop(), title: dc.path, html: () => docView(dc) }));
  }
  if (info.image) note = `<img class="map" src="${esc(info.image)}" alt="${esc(n.label)}">`;
  else if (info.note) note = `<div class="empty">${esc(info.note)}</div>`;
  else if (n.kind === "process") note = `<div class="empty">What a build step shows is not decided yet.</div>`;
  else if (!tabs.length) note = `<div class="empty">Nothing is recorded for this part yet.</div>`;
  panel.innerHTML = `<div class="head">${chip(n.kind, g.name)}<h2>${esc(n.label)}</h2>
      ${links(n)}</div>
    ${tabs.length > 1 ? `<div class="tabs">${tabs.map((t, i) => `<button data-tab="${i}" title="${esc(t.title || t.name)}">${esc(t.name)}</button>`).join("")}</div>` : ""}
    <div class="body" id="pbody">${note}</div>`;
  const open = i => {
    panel.querySelectorAll(".tabs button").forEach((b, j) => b.classList.toggle("on", i === j));
    document.getElementById("pbody").innerHTML = tabs[i].html();
    panel.querySelectorAll(".md a").forEach(a => a.target = "_blank");
  };
  if (tabs.length) open(0);
  panel.scrollTop = 0;
  panel.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => open(+b.dataset.tab));
}
panel.addEventListener("click", ev => {
  const go = ev.target.closest("[data-go]");
  if (go) return select(go.dataset.go);
  const ln = ev.target.closest("[data-line]");
  if (ln) {
    const src = panel.querySelector(".src"), lh = parseFloat(getComputedStyle(src).lineHeight);
    src.scrollTop = (ln.dataset.line - 1) * lh;
    src.scrollIntoView({ block: "nearest" });
  }
});
</script>
