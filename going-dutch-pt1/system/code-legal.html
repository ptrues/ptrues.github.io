* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; }

/* diagram */

  stroke-width: 1.2; transition: opacity .15s; }
.node rect.stripe { fill: var(--c); }
.node text { fill: var(--text); font: 500 11.5px var(--sans); pointer-events: none; }

svg.focus .edge.direct { opacity: 1; stroke: var(--c); stroke-width: 3; stroke-dasharray: 7 5; animation: flow .7s linear infinite; }

<script>
const DATA = {"nodes": [{"id": "osm", "kind": "input", "label": "OpenStreetMap", "cite": "data/raw/geofabrik-osm-noord-brabant-2026", "x": 250, "y": -185.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/sources/geofabrik-osm-noord-brabant-2026.md", "title": "OpenStreetMap for Noord-Brabant, 8 September 2026", "tab": "OpenStreetMap", "status": "Downloaded 2026-09-11. In use.", "md": "## What it is\n\nOpenStreetMap is a free map of the world, drawn and kept up by volunteers. This is a copy of it for the province of Noord-Brabant, frozen as it stood on 8 September 2026. Geofabrik, a German company, publishes such regional copies.\n\nThe method builds both its bike network and its walking network from this one file. Using a frozen copy means the result can be rebuilt exactly, however the live map changes.\n\n## Where it comes from\n\n- **Made by:** OpenStreetMap's contributors. The regional copy is made by Geofabrik.\n- **Version:** the copy dated 8 September 2026, with changes up to 20:21 UTC that day.\n- **Download:** https://download.geofabrik.de/europe/netherlands/noord-brabant-260908.osm.pbf\n- **License:** the Open Database License. Any use must credit \"OpenStreetMap contributors\" and say the data are under that license.\n\nThe file is 207 MB. Its checksum matched the one Geofabrik publishes, so the copy is complete.\n\n## What it holds around Breda\n\n- **Footpaths and paths:** 440 km. Cycle paths add another 228 km.\n- **Sidewalks:** only 14 km are drawn as their own lines. On almost every street, the map does not say whether there is a sidewalk.\n- **Steps:** 154 flights, 1.3 km in all. 18 are marked as having a ramp for bikes.\n- **Barriers:** 1,289, such as gates, bollards and cycle barriers. Most do not say who may pass.\n- **Crossings:** 1,050.\n- **Addresses:** about 103,000 buildings, copied into the map from the national address register. Only 114 front doors are marked.\n\n## What it can and cannot do\n\n- **It can** give a bike network and a walking network that can be routed on, with steps, barriers and crossings where they are mapped.\n- **It cannot** say what changed after 8 September 2026.\n- **It is not** a legal record. What it says about who may ride where depends on what volunteers have mapped.\n- **It does not** mark every sidewalk, every barrier's width or locks, or most front doors.\n- Its streets do not line up one-to-one with the Dutch national road register. Comparing the two takes matching by location.\n", "cited": {"literature": [], "sources": [{"slug": "geofabrik-osm-noord-brabant-2026", "title": "OpenStreetMap Noord-Brabant extract, 8 September 2026"}], "records": [], "files": []}}]}}, {"id": "bag", "kind": "input", "label": "Address register (BAG): homes", "cite": "data/raw/kadaster-bag-breda-2026", "x": 1000, "y": -37.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/sources/kadaster-bag-breda-2026.md", "title": "The national address register, September 2026", "tab": "Address register", "status": "Downloaded 2026-09-11. In use.", "md": "## What it is\n\nThe BAG (Basisregistratie Adressen en Gebouwen) is the Dutch national register of addresses and buildings. Each town keeps its own part, and Kadaster, the national land registry, publishes the whole. This is Kadaster's simplified monthly copy for the whole country.\n\nThe method counts homes from it. A home is one registered dwelling with an address.\n\n## Where it comes from\n\n- **Made by:** Kadaster, from every town's records.\n- **Version:** the monthly copy dated 1 September 2026.\n- **Download:** https://service.pdok.nl/kadaster/bag/atom/downloads/bag-light.gpkg\n- **License:** public domain (CC0 1.0). Anyone may use it for anything.\n\nThe download address does not change, but the file behind it is replaced every month. A later download will be a different file. The project keeps a checksum that identifies the copy it used.\n\n## What counts as a home\n\nThe register lists every space with an address: homes, shops, offices and more. A space counts as a home when two things are true:\n\n- **Its uses include housing.** A space can list several uses, such as a shop with a flat, so the test looks for housing anywhere in the list.\n- **It is in use.** Spaces registered but not yet built, under renovation, or out of use are left out.\n\nOn this test, 106,051 homes lie in the 12 km square around the station that the project reads. Counting the 696 under renovation would add 0.7%. Which spaces count as \"in use\" is a reading of the register's terms made for this project.\n\nHouseboat moorings and caravan pitches are listed separately in the register, and are not counted as homes.\n\n## Where a home is\n\nEach home is a point inside its building, not a front door. The register records no doors.\n\nNearly every point lies inside its own building. Half lie within 2.8 m of the building's outline, and 99% within 10 m. In a block of flats, each flat has its own point.\n\nSo the method links each home to the walking network with a short straight connector from the point.\n\n## What it can and cannot do\n\n- **It can** give every home's position, status and uses, from one dated national copy.\n- **It cannot** say how many people live in a home.\n- **It cannot** say where a building's door is, or which side faces the street.\n- A home that also holds a shop counts once, as a home.\n", "cited": {"literature": [], "sources": [{"slug": "kadaster-bag-breda-2026", "title": "BAG GeoPackage, Netherlands, September 2026"}, {"slug": "kadaster-bgt-breda-2026", "title": "BGT road, bridge, tunnel, and water parts, Breda box, September 2026"}], "records": [], "files": []}}]}}, {"id": "dest", "kind": "input", "label": "Station and bike-parking entrances", "cite": "data/processed/destinations.gpkg", "x": 1000, "y": 111.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/decisions/DEC-004-destinations-and-direction.md", "title": "The ride ends at the bike-parking entrances", "tab": "Where the ride ends", "status": "Decided 2026-09-13. In force.", "md": "## My answers\n\nFrom my review of the first set of decisions, 2026-09-13:\n\n- **Should the main scenario be cycling to the station's bicycle parking?** Yes, cycle to the bicycle parking.\n\n## What was decided\n\nEach ride ends at a cyclist entrance of the station's two public bike-parking garages, Station Breda Centrum and Station Breda Belcrum. Each garage has one cyclist entrance on OpenStreetMap.\n\nEvery result is also counted two other ways: to the three main doors of the station hall, and riding away from the station. A number given without saying which is the main one: toward the bike parking.\n\n## Why the bike parking\n\nA cyclist's trip ends where they park, not at the station door.\n\nDutch travelers use a bike far more to reach a station than to leave one: 38% against 10% in one Dutch travel model (Geurs and others 2016). Other studies have used station entrances as the end of the trip (Moinse and Lurkin 2026; Wu and others 2019; Wu and others 2021).\n\nNo study compared bike-parking entrances with station entrances. Choosing the parking entrances is a reasoned choice, not a published finding.\n\n## Why it matters\n\nThe choice changes the count. In an early version of the model, about 12% more homes reached the parking entrances than the station doors.\n\nDirection matters too. Some streets can be ridden only one way, so more homes can ride to the station than from it.\n\n## Other end points considered\n\n- **The station doors.** Other studies used them. But a cyclist stops at the parking, and the doors sit next to different streets.\n- **One point for the whole station.** The entrances lie 40 m and 158 m from the station's point on the map, and below street level.\n- **The open bike racks beside the station hall.** They serve passengers, but have no entrance to route to. Left as an open question.\n\n## Limits\n\n- An entrance missing from OpenStreetMap is missing from the model.\n- How many bikes each garage holds is not known.\n", "cited": {"literature": [{"key": "geurs2016", "ref": "Geurs, K. T., La Paix, L., & Van Weperen, S. (2016). A multi-modal network approach to model public transport accessibility impacts of bicycle-train integration policies. European Transport Research Review, 8(4). https://doi.org/10.1007/s12544-016-0212-x", "url": "https://doi.org/10.1007/s12544-016-0212-x"}, {"key": "ma2018", "ref": "Ma, X., Jin, Y., & He, M. (2018). Measuring Bikeshare Access/Egress Transferring Distance and Catchment Area around Metro Stations from Smartcard Data. Information, 9(11), 289. https://doi.org/10.3390/info9110289", "url": "https://doi.org/10.3390/info9110289"}, {"key": "moinse2026", "ref": "Moinse, D., & Lurkin, V. (2026). Modal synergies between dockless electric bikes and rail transit in Lausanne Switzerland. Npj Sustainable Mobility and Transport, 3(1). https://doi.org/10.1038/s44333-026-00104-5", "url": "https://doi.org/10.1038/s44333-026-00104-5"}, {"key": "wu2019", "ref": "Wu, X., Lu, Y., Lin, Y., & Yang, Y. (2019). Measuring the Destination Accessibility of Cycling Transfer Trips in Metro Station Areas: A Big Data Approach. International Journal of Environmental Research and Public Health, 16(15), 2641. https://doi.org/10.3390/ijerph16152641", "url": "https://doi.org/10.3390/ijerph16152641"}, {"key": "wu2021", "ref": "Wu, X., Lu, Y., Gong, Y., Kang, Y., Yang, L., & Gou, Z. (2021). The impacts of the built environment on bicycle-metro transfer trips: A new method to delineate metro catchment area based on people’s actual cycling space. Journal of Transport Geography, 97, 103215. https://doi.org/10.1016/j.jtrangeo.2021.103215", "url": "https://doi.org/10.1016/j.jtrangeo.2021.103215"}], "sources": [], "records": [], "files": []}}], "files": [{"path": "config/destinations.yaml", "code": "# Phase 09 destination selection (PILOT_SPEC.md §2 D3, §3, §6.0).\n# Read by scripts/analysis/build_destinations.py. The selection rationale is on INV-001.\n# Every selected point is an OSM node in the pinned extract; the script checks its tags and position.\n\ninputs:\n  osm_pbf: data/raw/geofabrik-osm-noord-brabant-2026/noord-brabant-260908.osm.pbf\n  osm_checksums: data/raw/geofabrik-osm-noord-brabant-2026/checksums.sha256\n  municipal_parking: data/raw/breda-fietsenstallingen-breda-2026/fietsenstallingen.json\n  municipal_checksums: data/raw/breda-fietsenstallingen-breda-2026/checksums.sha256\n\noutputs:\n  destinations: data/processed/destinations.gpkg\n  extraction_area: data/processed/extraction_area.gpkg\n  report: data/processed/destinations_report.json\n\ncrs: EPSG:28992\n\nstation:\n  osm_node: 43174364          # railway=station, railway:ref=Bd (Breda); the position is taken from this node\n  approx_lonlat: [4.780, 51.595]  # PILOT_SPEC.md §3; sets only the OSM read extent\n\nparking_search_radius_m: 500  # PILOT_SPEC.md §6.0 step 1\ncrossmatch_max_m: 50          # municipal point and OSM parking count as the same facility within this distance\naccess_way_endpoint_max_m: 0.5  # a stalling node counts as an entrance only if an OSM way ends at it\nentrance_report_radius_m: 300   # entrance-tagged nodes listed in the report\ntrack_side_band_m: 2          # half-width of the vertical band used to find the tracks at a point's x\nextraction_buffer_m: 5000     # PILOT_SPEC.md §3\n\n# The two NS-managed station facilities that Gemeente Breda names (Station Breda Centrum, Station Breda Belcrum).\n# Each OSM facility node is the end vertex of the way that leads cyclists into it.\nstalling_entrances:\n  - dest_id: stall_centrum\n    osm_node: 5326359923\n    name: Fietsenstalling Centrum (NS, Station Breda Centrum)\n    expect_name: Fietsenstalling Centrum\n  - dest_id: stall_belcrum\n    osm_node: 6534475679\n    name: Fietsenstalling Belcrum (NS, Station Breda Belcrum)\n    expect_name: Fietsenstalling Belcrum\n\n# OSM bicycle parking within the search radius that is not selected, with the reason.\nexcluded_parking:\n  \"way/583191500\": open wall-loop racks beside the station hall; no enclosed facility and no mapped entrance\n  \"way/539929536\": open covered stands (Noorderf); no enclosed facility and no mapped entrance\n  \"way/1092478099\": open wall-loop racks on Stationsweg; no enclosed facility and no mapped entrance\n  \"node/10253691018\": open street stands, 227 m from the station; not a station facility\n\n# D3 sensitivity: OSM entrance=main nodes on the station hall.\nstation_entrances:\n  - dest_id: stn_south\n    osm_node: 5366995527\n    name: Station Breda, south entrance (Stationsplein stair to the station hall)\n  - dest_id: stn_north_w\n    osm_node: 5366995463\n    name: Station Breda, north entrance, west door\n  - dest_id: stn_north_e\n    osm_node: 5366995464\n    name: Station Breda, north entrance, east door\n\nexcluded_entrances:\n  \"12655431227\": entrance=main of the Anna van Lotharingentoren apartment building, not the station\n", "lang": "yaml"}]}}, {"id": "r_access", "kind": "rule", "label": "OSM access tags decide where bikes may ride", "cite": "config/osm_access_rules.yaml", "x": 500, "y": -111.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/decisions/DEC-033-osm-stated-legality.md", "title": "Where OpenStreetMap says bikes are allowed, it is trusted", "tab": "Trusting OpenStreetMap's bike access", "status": "Decided 2026-09-30. Made for the combined map, which was not adopted. The method in use reads OpenStreetMap alone.", "md": "## My answers\n\n2026-09-30, on how to settle which source is right:\n\n> If Breda's published traffic orders are the strongest source and it can be determined with automated assistance, I favor that method. The random seed would then need to select the minimum number to be statistically significant enough to say \"prefer OSM\"\n\n> manual review is a fallback\n\n> sampling edges might be wrong. sampling streets would likely be more correct since that's probably how the rules reference them\n\n> or streets between junctions. streets are often identified as \"MLK between Rosemary and Umstead\"\n\n2026-09-30, on the result:\n\n> Adopt the prefer-OSM rule\n\n## The question\n\nAt the time, the project was testing a combined map. It took its streets and paths from OpenStreetMap and its rules, including who may ride where, from the Dutch national road register.\n\nThe two sources sometimes disagreed. The national register closed 20.5 km of street to bikes that OpenStreetMap marks as open.\n\n## How it was settled\n\nBreda publishes a traffic order each time it puts up or changes a street sign. Each order is a legal decision, so it is the strongest record of whether bikes may ride a street.\n\n168 street sections were drawn at random, with a fixed starting number so the draw can be repeated. Their traffic orders were read in turn.\n\nOf the first 32 sections, 10 had an order showing the street open to bikes. None had an order showing it closed. The other 22 had no order that settled the question.\n\nA statistical test was set to stop as soon as the evidence was strong enough, either way. Every way of counting stopped at \"trust OpenStreetMap\". The strictest count used only orders that place a sign, each counted once. It stopped after 6 of 6 agreed with OpenStreetMap.\n\n## What was decided\n\nWhere OpenStreetMap states that bikes are allowed and the national register closes the street, OpenStreetMap wins. Where OpenStreetMap states nothing, the register still governed the combined map.\n\n## Effect\n\nOn the combined map, the rule raised the homes within reach of the bike parking from 26,976 to 29,365. It reconnected all 725 homes of a cut-off pocket around Houtmarkt, against 304 before.\n\n## Where it stands\n\nThe combined map was never adopted. The method in use reads OpenStreetMap alone, so its bike access is OpenStreetMap's throughout. The traffic-order test is the evidence that OpenStreetMap's bike-access tags hold up against Breda's legal records: no section was found where an order closes what OpenStreetMap opens.\n\n## Limits\n\n- Traffic orders exist only for changes made since 2013. Most sections drawn had no order about them.\n- The test covers streets where OpenStreetMap states bike access. It says nothing about streets where it is silent.\n", "cited": {"literature": [], "sources": [{"slug": "breda-verkeersbesluiten-2026", "title": "Breda's published traffic orders, 2013 to 2026"}], "records": [], "files": []}}], "files": [{"path": "config/osm_access_rules.yaml", "code": "# Variant A: OSM bicycle access and direction rules (PILOT_SPEC.md §2 D6, §6.1).\n# Read by src/breda_pilot/osm_rules.py; tested by tests/test_osm_rules.py.\n# Entries marked \"extension\" go beyond the spec text; INV-001 records them.\n\n# Tags copied from OSM ways onto graph edges. The rules below read only these.\nway_tags:\n  - highway\n  - area\n  - access\n  - vehicle\n  - bicycle\n  - oneway\n  - oneway:bicycle\n  - junction\n  - cycleway\n  - cycleway:left\n  - cycleway:right\n  - cycleway:both\n  - name\n  - maxspeed\n  - service\n  - layer\n  - tunnel\n  - bridge\n\nhighway:\n  # Admitted unless a bicycle, vehicle, or access tag forbids it.\n  cycleway: [cycleway]\n  public_road:\n    - trunk            # admitted only without bicycle=no (spec); the bicycle rule handles that\n    - trunk_link\n    - primary\n    - primary_link\n    - secondary\n    - secondary_link\n    - tertiary\n    - tertiary_link\n    - unclassified\n    - residential\n    - living_street\n    - service\n    - road\n    - track            # extension: unpaved public roads, open to cycling unless tagged otherwise\n  # Admitted only with an explicit bicycle permission.\n  needs_bicycle_permission:\n    - path\n    - footway\n    - pedestrian       # extension: same treatment as footway\n    - bridleway        # extension: same treatment as footway\n  # Every other highway value is excluded, including motorway, motorway_link, steps,\n  # corridor, platform, busway, construction, and proposed.\n\n# OSM values are strings; quote yes/no so YAML does not read them as booleans.\nbicycle_permitted: [\"yes\", designated, permissive, destination]   # extension: permissive, destination\nbicycle_forbidden: [\"no\", use_sidepath, dismount, private]        # extension: private\naccess_forbidden: [\"no\", private]                                 # extension: private; also read from vehicle=*\nexclude_area_yes: true      # extension: area=yes highways are plazas, not linear routes (as in OSMnx's own filters)\n\noneway:\n  forward: [\"yes\", \"true\", \"1\"]\n  backward: [\"-1\", \"reverse\"]\n  two_way: [\"no\", \"false\", \"0\"]         # an explicit two-way tag overrides the roundabout implication\n  roundabout_implies_oneway: true       # extension: OSM convention; OSMnx applies it too\n  bicycle_override_key: \"oneway:bicycle\"\n  bicycle_two_way: [\"no\"]\n  opposite_prefix: opposite             # cycleway=opposite*, cycleway:*=opposite*\n  opposite_keys: [cycleway, cycleway:left, cycleway:right, cycleway:both]\n", "lang": "yaml"}]}}, {"id": "p_bike", "kind": "process", "label": "Build the bike network", "cite": "RUN-001", "x": 750, "y": -37.0, "w": 190, "h": 62, "info": {"image": "steps/p_bike.png"}}, {"id": "p_walknet", "kind": "process", "label": "Build the walking network", "cite": "RUN-002", "x": 1250, "y": -148.0, "w": 190, "h": 62, "info": {"image": "steps/p_walknet.png"}}, {"id": "r_contra", "kind": "rule", "label": "Bikes both ways on one-way streets, except divided roads and bike-lane streets", "cite": "DEC-044", "x": 1000, "y": -111.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/decisions/DEC-044-bikes-both-ways-on-one-way-roads.md", "title": "Bikes may ride both ways on one-way streets", "tab": "One-way streets", "status": "Decided 2026-10-02. In force. Since 2026-10-06 its exceptions read OpenStreetMap alone.", "md": "## My answers\n\n2026-10-01, on learning that the model kept bikes to one direction on one-way streets:\n\n> Have runs so far assumed that bikes could not travel in the opposite direction on one-way shared streets? That is almost never the case in the Netherlands. Almost all streets allow cyclists in both directions. Only bike lanes and dedicated one-lane paths ban bike traffic in the opposite direction.\n\n> I would not rely on the one-way exemptions in OSM. This is a data issue, not a question of legality. The only time a sub-30 km/h shared street would likely be exempted for bike traffic is if it's linked to an opposite-direction one-way (like a dual carriageway). Almost every one-way street has an uitgezonderd fietsers sub-sign. They're so common\n\n2026-10-02, on the evidence below:\n\n> Okay, since 92% treat public streets as open to bicycles, we will adopt an assumption that all of them do. Car-park entrances and driveways should also allow bicycles. This is definitely a data error. Divided roads will continue to exclude bicycles.\n\n> The rule (should) exclude streets with bike lanes\n\n2026-10-02, on the divided streets the rule turns on:\n\n> Okay, I suppose it isn't a painted lane, but it is a shoulder margin. Wilhelminastraat is a klinker street. Regardless, it is a divided street and bikes are correctly going one way in either direction.\n\n> Yes, it is a bike lane. With a klinker bicycle marker and klinker dividers\n\n> Mauritsstraat has the same condition. It is a klinker divided street with klinker bike lanes\n\n## The question\n\nUnder Dutch law, a one-way sign applies to cyclists too, unless a small sign below it says \"except cyclists\" (\"uitgezonderd (brom)fietsers\").\n\nOpenStreetMap often does not record that small sign. So the model was keeping bikes to one direction on many streets where they may ride both ways. The question was how often Breda adds the exemption.\n\n## The evidence\n\nBreda publishes a traffic order each time it puts up or changes a street sign. Every order since 2013 that makes a street one-way was read.\n\n- **Public streets:** 33 of 36 let bikes ride both ways, 92%.\n- **Car-park entrances and driveways:** none of 5.\n- **Divided roads:** none of 2.\n\n## What was decided\n\nBikes may ride both ways on every one-way street shared with cars, including car-park lanes and driveways. These stay one-way:\n\n1. **One half of a divided road.** The model finds a divided road as two one-way streets within 25 m of each other, running in nearly opposite directions (150° or more apart). They must share a name, or both be unnamed and the same kind of road.\n2. **One-way bike paths, and streets with a bike lane or track.**\n3. **Roundabouts.** A call made for this project, not from the orders: traffic circles a roundabout one way, and the exemption sign is for streets.\n4. **Streets OpenStreetMap marks one-way for bikes in particular.** Also a call made for this project: that is a stated rule, not a missing sign.\n\n## Effect\n\nThe rule was first measured on the low-stress model. It opened 35 km of street to riding both ways and reached 193 more homes.\n\nOpening divided roads too would have reached 124 more. Four streets decide those homes: Wilhelminastraat, Nieuwe Ginnekenstraat, Mauritsstraat and Vijverstraat. All four are divided roads. Breda's orders describe two of them that way. I confirmed the other two.\n\n## Limits\n\n- **Three streets in 36 are signed without the exemption.** Leidekkerstraat (in school hours), Minderbroederstraat at the bridge and Zandoogjes. The rule opens such streets anyway.\n- **Car-park entrances and driveways are legally one-way.** All five ordered ones are signed without the exemption. I judged OpenStreetMap's one-way marks on them a data error. They decide no home.\n- **The divided-road test was built for this project.** It was checked only on the four streets where it changes the count.\n- **The orders cover only changes since 2013.** They show Breda's practice since then, not every sign in the city.\n\n## Every one-way order, as read\n\nThe order's words are quoted in Dutch, as published.\n\n| Order | Street | What changed | Kind of street | Bikes exempt | The order's words |\n|---|---|---|---|---|---|\n| gmb-2013-4518 | Iepstraat | Sign moved, part removed | Street | Yes | Het bord C3, eenrichtingsweg, met onderbord OB54, uitgezonderd (brom)fietsers, wordt verwijderd op het kruispunt Iepstraat-Meidoornstraat en wordt geplaatst op het kruispunt Iepstraat-Wilgstraat. |\n| gmb-2014-19828 | Leidekkerstraat | Sign placed | Street, school hours | No | Bij het kruispunt Doelen-Leidekkerstraat wordt het bord C3, eenrichtingsweg, geplaatst. [...] Onder de borden C2 en C3 wordt het onderbord OB206p, ma t/m vr 8:00-16:00 aangebracht. |\n| gmb-2016-105779 | Antwerpenstraat, service street at the Moerwijk shopping center | Sign placed | Car park or driveway | No | De borden C1, eenrichtingsweg, en C2, eenrichtingsweg, in deze richting gesloten voor voertuigen, ruiters en geleiders van rij- en trekdieren of vee, worden geplaatst bij het betreffende weggedeelte. |\n| gmb-2016-129282 | Gielis Beijsstraat | Sign placed | Street | Yes | het bord C3, eenrichtingsweg, met onderbord OB54, uitgezonderd (brom)fietsers, geplaatst. |\n| gmb-2016-139226 | Doelen | Sign placed | Street, school hours | Yes | Onder de borden wordt het onderbord OB54, uitgezonderd (brom)fietsers, geplaatst. |\n| gmb-2016-52224 | Minderbroederstraat, at the bridge | Sign placed | Street | No | Bij de brug bij het Minderbroederstraat wordt het bord C2, eenrichtingsweg in deze richting gesloten, met onderbord OB065, uitgezonderd laad- en losverkeer, en onderbord OB109, uitgezonderd bewoners en hotelgasten, geplaatst. |\n| gmb-2016-52224 | Nieuwstraat | Sign placed | Street | Yes | In de Nieuwstraat wordt eenrichtingsverkeer ingesteld vanaf de Minderbroederstraat richting de Waterstraat uitgezonderd voor (brom)fietsers. |\n| gmb-2016-55471 | Heuvelplein, south roadway | Sign placed | Street | Yes | Op het Heuvelplein wordt ter hoogte van huisnummer 279 het bord C3, eenrichtingsweg, met onderbord OB54, uitgezonderd (brom)fietsers, geplaatst. |\n| gmb-2017-14993 | Nassausingel and Mauritssingel | Sign placed | Street | Yes | Onder deze borden wordt het onderbord OB54, uitgezonderd (brom) fietsers, geplaatst. |\n| gmb-2017-3403 | Car park, Bavel (Kloosterstraat to Lange Vore) | Sign placed | Car park or driveway | No | Op de Kloosterstraat bij de inrit naar het parkeerterrein wordt het bord C3, eenrichtingsweg, geplaatst. |\n| gmb-2021-241398 | Titulaerlaan | Sign placed | Street, school hours | Yes | Aan de zijde van de Akkerstraat wordt het bord C3, eenrichtingsweg, met het onderbord OB206p, ma t/m vrij 8-16h, en onderbord OB52, uitgezonderd fietsers, geplaatst. |\n| gmb-2021-251975 | Parkstraat | Sign moved | Divided road | No | Op de Parkstraat wordt, het bord C02, eenrichtingsweg, in deze richting gesloten voor voertuigen, ruiters en geleiders van rij- of trekdieren of vee, verplaatst naar het einde van de (in de nieuwe situatie verlengde) middenberm van de Parkstraat. |\n| gmb-2021-404669 | Bouvignedreef (revoked by gmb-2022-369513) | Sign placed | Street | Yes | Ter hoogte van Bouvignedreef 1 wordt het bord C3, eenrichtingsweg, met het onderbord OB524, uitgezonderd fietsers, geplaatst. |\n| gmb-2022-235682 | Kiss-and-ride strip and link road, Kapittelhof schools, Bavel | Sign placed | Car park or driveway | No | Bord C03 'eenrichtingsweg': bij de inrit aan de Pastoor Doensstraat; Bord C02 'eenrichtingsweg, in deze richting gesloten voor voertuigen, ruiters en geleiders van rij- of trekdieren of vee': bij de uitrit aan de Lange Vore. |\n| gmb-2022-332628 | Nijverheidssingel (Schorsmolenstraat to Nieuwe Haagdijk) | Sign placed | Street | Yes | Onder deze borden wordt het onderbord OB54 'uitgezonderd (brom) fietsers' geplaatst zodat (brom)fietsers in twee richtingen over de fietsstraat mogen rijden. |\n| gmb-2022-332639 | Sluissingel | Sign placed | Street | Yes | Onder deze borden wordt het onderbord OB54 'uitgezonderd (brom) fietsers' geplaatst zodat (brom)fietsers in twee richtingen over de fietsstraat mogen rijden. |\n| gmb-2022-338488 | Chassésingel | Sign placed | Street | Yes | Onder deze borden wordt het onderbord OB54 'uitgezonderd (brom) fietsers' geplaatst zodat (brom)fietsers in twee richtingen over de fietsstraat mogen rijden. |\n| gmb-2022-463901 | Marksingel | Sign placed | Street | Yes | Op de Marksingel wordt in twee delen eenrichtingsverkeer, uitgezonderd (brom)fietsers, ingesteld |\n| gmb-2023-305766 | Zandoogjes (Argusvlinder to Tuinzigtlaan) | Sign placed | Street | No | Bij de aansluiting van de Argusvlinder op de Zandoogjes wordt aan de zuidzijde het bord C3, eenrichtingsweg, geplaatst. Bij de aansluiting van de Tuinzigtlaan op Zandoogjes wordt het bord C2, [...] met onderbord OB401-40, 30 meter, geplaatst. |\n| gmb-2023-305999 | Zandbergplein | Sign placed | Street | Yes | Het bord C03, eenrichtingsweg, met onderbord OB52, uitgezonderd fietsers, wordt geplaatst op het Zandbergplein ter hoogte van het Zandbergplein 36 |\n| gmb-2023-373691 | Speelhuislaan, extension | Sign placed | Divided road | No | Op de twee rijbanen wordt eenrichtingsverkeer van toepassing. In verband hiermee wordt op de Speelhuislaan ter hoogte van de aansluiting Belcrumweg/Konijnenberg het bord C03, eenrichtingsweg, geplaatst. |\n| gmb-2023-546856 | Johan Willem Frisolaan, north side | Sign kept | Street | Yes | het bord C03, eenrichtingsweg, met onderbord OB54, uitgezonderd (brom) fietsers, op de Johan Willem Frisolaan, ter hoogte van de kruising met de Ginnekenweg, te worden verwijderd en herplaatst |\n| gmb-2023-546856 | Saksen Weimarplein | Sign removed | Street | Yes | het bord C03, eenrichtingsweg, met onderbord OB52, uitgezonderd fietsers, op het Saksen Weimarplein, ter hoogte van de kruising met de Ginnekenweg, worden verwijderd. |\n| gmb-2024-203755 | Van Duijvenvoordestraat | Sign kept | Street | Yes | boven het bestaande bord C03, eenrichtingsweg, en onderbord OB54, uitgezonderd (brom)fietsers. |\n| gmb-2024-312726 | Van Musschenbroekstraat and Stevinstraat | Sign placed | Street | Yes | Fietsers en bromfietsers mogen wel in beide richtingen rijden. |\n| gmb-2024-336493 | La Mairestraat, Hudsonstraat and neighboring streets, Heuvel | Sign placed | Street | Yes | Het bord C03, eenrichtingsweg, met onderbord OB52, uitgezonderd fietsers, wordt geplaatst op de Hudsonstraat bij de kruising met de La Mairestraat |\n| gmb-2024-61644 | Kloosterlaan, car park entrance | Sign placed | Car park or driveway | No | Hierbij wordt ter hoogte van de nieuwe ingang op de Kloosterlaan het bord C03, eenrichtingsweg, geplaatst. |\n| gmb-2025-270495 | Heerbaan, entrances and exits of Heerbaan 42-72 and 190 | Sign placed | Car park or driveway | No | wordt bij zowel de inrit als uitrit het bord C02, eenrichtingsweg, in deze richting gesloten voor voertuigen, ruiters en geleiders van rij- of trekdieren of vee, geplaatst. |\n| gmb-2025-502971 | Keizerstraat (Oude Vest to Akkerstraat) | Sign placed | Street | Yes | Op de Keizerstraat, tussen de Oude Vest en Akkerstraat, wordt eenrichtingsverkeer ingesteld voor gemotoriseerd verkeer. Fietsers, bussen en hulpdiensten mogen in beide richtingen blijven rijden. |\n| stcrt-2013-26550 | Erasmusweg 28-30 | Sign placed | Street | Yes | Onder de borden wordt het onderbord OB54, uitgezonderd (brom)fietsers, geplaatst. |\n| stcrt-2013-3398 | Demerstraat | Sign placed | Street | Yes | Onder beide borden wordt het bord OB54, uitgezonderd (brom)fietsers, geplaatst. |\n| stcrt-2017-21328 | Molenstraat service road, Prinsenbeek | Sign placed | Street | Yes | Op het kruispunt van de ventweg met de Vianendreef wordt het bord C3, eenrichtingsverkeer, met onderbord OB52, uitgezonderd fietsers, geplaatst. |\n| stcrt-2017-22432 | Vogelbos | Sign placed | Street | Yes | Aan de zijde van de Meers wordt het bord C3, eenrichtingsweg, met onderbord OB52, uitgezonderd fietsers, geplaatst. |\n| stcrt-2017-37420 | Iepstraat | Sign placed | Street | Yes | Aan de zijde van de Meidoornstraat wordt het bord C3, eenrichtingsweg, geplaatst met onderbord OB52, uitgezonderd (brom-) fietsers. |\n| stcrt-2018-35469 | Keplerstraat | Sign placed | Street | Yes | Aan de zijde van Christiaan Huygensstraat wordt het bord C3, eenrichtingsweg, met onderbord OB52, uitgezonderd fietsers, geplaatst. |\n| stcrt-2018-65000 | Menno van Coehoornstraat | Sign placed | Street | Yes | Het eenrichtingsverkeer geldt niet voor (brom)fietsers. Onder de borden wordt dan ook het onderbord OB054, uitgezonderd (brom) fietsers, geplaatst. |\n| stcrt-2018-72231 | Heksenakker 98-172 | Sign removed | Street | Yes | Het bord C3, eenrichtingsweg, en C2, eenrichtingsweg in deze richting gesloten, met onderbord OB54, uitgezonderd (brom)fietsers, worden verwijderd. |\n| stcrt-2019-28791 | Mozartlaan | Sign placed | Street | Yes | Op het kruispunt Ruitersboslaan-Mozartlaan wordt het bord C3, eenrichtingsverkeer, met onderbord OB52, uitgezonderd fietsers, geplaatst. |\n| stcrt-2019-59805 | Paantjensstraat | Sign placed | Street | Yes | Onder de borden wordt het onderbord OB54, uitgezonderd (brom)fietsers, geplaatst. |\n| stcrt-2020-25807 | Watermunt | Sign placed | Street | Yes | (Brom)fietsers mogen wel in beide richtingen blijven rijden. |\n| stcrt-2020-3200 | Nijverheidssingel (to Leuvenaarstraat) | Sign placed | Street | Yes | het bord C3, eenrichtingsweg, met onderbord OB54, uitgezonderd (brom) fietsers, geplaatst. |\n| stcrt-2021-30892 | Mechelenstraat | Sign placed | Street, school hours | Yes | Aan de zijde van het Belgiëplein wordt C3, eenrichtingsweg, geplaatst met onderbord OB52, uitgezonderd fietsers, en onderbord OB208, ma t/m vr 8-16h. |\n| stcrt-2021-30926 | Pastoor Lemmensstraat | Sign placed | Street | Yes | Aan de zijde van de Mgr. van Dijkstraat wordt het bord C3, eenrichtingsverkeer, met het onderbord OB54, uitgezonderd (brom) fietsers, geplaatst. |\n", "cited": {"literature": [], "sources": [{"slug": "breda-verkeersbesluiten-2026", "title": "Breda's published traffic orders, 2013 to 2026"}, {"slug": "ndw-wkd-fietsstroken-nl-2026", "title": "WKD Fiets(suggestie)stroken, Netherlands, January 2026"}], "records": [], "files": []}}, {"path": "wiki/decisions/DEC-055-osm-native-legal-result.md", "title": "The method uses OpenStreetMap alone", "tab": "OpenStreetMap alone", "status": "Decided 2026-10-06. In force. Later runs repeat it with the method's own code, from the raw downloads.", "md": "## My answers\n\n2026-10-06, looking at the diagram of the method:\n\n> I want to know that every system component on this page actually tangibly affects the final output.\n\n> I want to know the difference in complexity between the run with 31,389 homes reached and the run with 31,479 homes reached. These are very similar results. If one was much less complex than the other, that would affect which should be the adopted result.\n\n2026-10-06, before the new numbers were known:\n\n> Regardless of whether it adds or drops 34 homes, this run will be the adopted run. Hopefully the number doesn't change so I don't have to update too much in the explainers, but I want the adopted method to be entirely OSM-native.\n\n## The question\n\nThe result before this decision also read the Dutch national road register. It used the register's bike-lane records, and a set of repairs to them, to decide which one-way streets keep a bike lane and so stay one-way for bikes. Reading them meant matching every national road record to an OpenStreetMap street.\n\nI asked whether each of those parts changes the result.\n\n## What the test found\n\nEach part was removed in turn and the model run again. The national register, its repairs and the matching changed no home in any of the four ways the result is counted.\n\n## What was decided\n\nThe method is built from three inputs only: OpenStreetMap, the national address register and the bike-parking entrances.\n\nIt reaches **31,479 homes** toward the bike-parking entrances. Toward the station doors it reaches 31,671. Riding away from the parking and from the station doors, it reaches 30,986 and 32,457. These are the same numbers as before.\n\nA one-way street stays one-way for bikes only when OpenStreetMap shows one of these:\n\n- a bike lane or track on it;\n- a roundabout;\n- a one-way rule that names bikes;\n- one half of a divided road.\n\n## Other choices considered\n\n- **Keep the national register.** The same homes, with ten more parts and a matching step. Not chosen.\n- **Also open divided roads both ways.** Also 31,479 homes. But it would let bikes ride against traffic on 920 more stretches of divided road, which I had ruled stay one-way.\n- **Open every one-way street both ways.** 31,513 homes. It drops the exceptions I had adopted.\n\n## Limits\n\n- The low-stress comparison still routes on the earlier network, which read the national bike-lane records. Making it OpenStreetMap-only would take a new run.\n", "cited": {"literature": [], "sources": [], "records": [], "files": []}}], "files": []}}, {"id": "l_contra", "kind": "limit", "label": "Divided road: halves 25 m apart, 150° opposed", "cite": "RUN-048 contraflow", "x": 750, "y": -111.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/runs/RUN-048-volume-by-facility-network.md", "title": "The network rebuilt with bikes both ways on one-way streets", "tab": "Network with two-way bike streets", "status": "Run 2026-10-04. Replaced as the result on 2026-10-06 by the same network built from OpenStreetMap alone.", "md": "## What this run built\n\nThis run built the bike network that a later result was taken from. It lets bikes ride both ways on one-way streets, except on one half of a divided road and on streets with a bike lane.\n\nA divided road is found as two one-way streets within 25 m of each other, running in nearly opposite directions (150° or more apart). They must share a name, or both be unnamed and the same kind of road.\n\nIt also changed how traffic is counted for the low-stress comparison. On a street shared with cars, a rider meets the traffic of both directions, so both are counted. On a painted bike lane, a rider meets only the traffic beside them, so only that direction is counted.\n\n## What it found\n\n- **The legal network** reaches 31,479 homes toward the bike-parking entrances. Toward the station doors it reaches 31,671. Riding away from the parking and the doors, it reaches 30,986 and 32,457.\n- The new traffic count does not touch the legal network. It only changes which streets the low-stress comparison keeps.\n\n## Where it stands\n\nIt was the Breda result from 2026-10-05 to 2026-10-06. It was then replaced by the same network built from OpenStreetMap alone, which reaches the same homes.\n\nThe low-stress comparison still routes on this network.\n\n## Limits\n\n- The traffic volumes come from a regional traffic model. They have not been checked against counts on city streets.\n", "cited": {"literature": [], "sources": [], "records": [], "files": []}}], "files": []}}, {"id": "p_attach", "kind": "process", "label": "Attach homes and entrances to the network", "cite": "RUN-002", "x": 1250, "y": 0.0, "w": 190, "h": 62, "info": {"image": "steps/p_attach.png"}}, {"id": "l_attach", "kind": "limit", "label": "Connector up to 100 m, offset up to 50 m", "cite": "RUN-002", "x": 1000, "y": 37.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/runs/RUN-002-access-leg.md", "title": "First test of walking the bike from home to the network", "tab": "Walking the bike to the network", "status": "Run 2026-09-12. Replaced by later runs. Its limits on the walk from the front door still apply.", "md": "## My answers\n\nFrom my review of the first set of decisions, 2026-09-13, on the decision this run informed:\n\n- **Should an address count as reachable if the resident walks the bicycle to the network?** Yes, count addresses by the walk.\n- **Should a Japanese study of walking with a bicycle count as evidence?** Leave it out.\n\n2026-09-16, after reading what that study measured:\n\n> Yeah, that doesn't fit.\n\n## What this run tested\n\nThe first model joined each home to the nearest street the bike may use, if one lay within 50 m, and started the ride there. A home 51 m from the network was out, and a home 49 m away cycled the gap.\n\nThis run tested a different start. The rider walks the bike from home along footpaths to the bike network, then rides.\n\n## The walk's rules\n\n- **From the address to the footpaths:** at most 100 m in a straight line. The address register gives a point inside the building, not a front door, so this short link stands in for the way out.\n- **From the footpaths onto the bike network:** at most 50 m.\n- **The whole walk:** at most 300 m, including the link from the address.\n- **Walking speed:** 1.34 m/s (Bosina and Weidmann 2017; Montufar and others 2007).\n- **Steps** block the walk unless they have a ramp for bikes.\n\nThe run repeated every case with each rule loosened or tightened. That shows how much the result depends on it.\n\n## What it showed\n\nHow far the rider may walk matters. On the first, uncorrected network, changing the walking limit moved one low-stress count by a factor of four, from 1,858 to 8,015 homes.\n\n## Limits\n\n- 39 homes were more than 100 m from any footpath, and so could not start a walk. A 250 m limit would have connected all of them.\n- The ride was tested at 15 km/h only.\n- Waiting at junctions is not modeled.\n\n## What changed later\n\nThe walk limit is now 2 minutes at each end of the ride, outside the 10 minutes. The 100 m link from the address and the 50 m step onto the bike network still apply.\n", "cited": {"literature": [{"key": "bosina2017", "ref": "Bosina, E., & Weidmann, U. (2017). Estimating pedestrian speed using aggregated literature data. Physica A: Statistical Mechanics and Its Applications, 468, 1–29. https://doi.org/10.1016/j.physa.2016.09.044", "url": "https://doi.org/10.1016/j.physa.2016.09.044"}, {"key": "montufar2007", "ref": "Montufar, J., Arango, J., Porter, M., & Nakagawa, S. (2007). Pedestrians’ Normal Walking Speed and Speed When Crossing a Street. Transportation Research Record: Journal of the Transportation Research Board, 2002(1), 90–97. https://doi.org/10.3141/2002-12", "url": "https://doi.org/10.3141/2002-12"}], "sources": [], "records": [], "files": []}}], "files": []}}, {"id": "r_walk", "kind": "rule", "label": "Walk from home to the nearest network point", "cite": "DEC-026", "x": 1500, "y": -74.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/decisions/DEC-026-run-023-current-run.md", "title": "A two-minute walk at each end of the ride", "tab": "Two-minute walks", "status": "Decided 2026-09-16. The walk rule is in force. The result this decision named was replaced by later runs.", "md": "## My answers\n\nFrom my photo review of streets, 2026-09-16:\n\n> Staircase to underground bicycle parking facility. Explicitly built to accommodate dismounted cyclists walking their bicycles into the parking facility. Should count as a final dismounted leg just like the initial dismounted leg.\n\n> looks like a ped environment. would be included by a new rule that includes a last-leg dismount.\n\nIn conversation, 2026-09-16:\n\n> I noted some additional rules that would be worthwhile. One is a meaningful methods change to include a last-leg walking segment. This method should also make it into the thesis\n\n> Tbh, I don't think either walk segment should count within the ten minutes. I think a 10-minute bike ride with up to a five-minute walk to the station, home entrance, or cycling facility. I doubt there is a single segment with more than a five-minute walk to a cycling facility\n\n> I also don't think any of these rules require a literature search. Nothing here is empirical. It's based on how every human bicycle trip unfolds in nature, so it follows self-evidently from logic.\n\n> I think it's possible that five minutes might be too long. Is there any evidence about how far people park their bicycles from their homes? I imagine most are parked within a couple minutes from their homes. And I doubt most people walk their bicycles for a full five minutes.\n\n> Yeah, that doesn't fit. A reduction in the walking allowance makes more sense.\n\n> And I didn't say before, but I do want to adopt a 2 min rule at either end\n\n> I am incredulous that in the Netherlands, the planning paradise, engineers would design low-stress segments that contain homes but don't connect to the rest of the low-stress network. Where this appears to occur in the data I am willing to bet is a data issue when we're talking about a 40 m gap.\n\n> I think no, It doesn't make sense to exclude it if another low-stress segment that isn't the closest but is still within 2 minutes can succeed. That's just not how trips work\n\n> Yes, your assumption of \"succeed\" was my intention. For completeness, we should also do this method for OSM.\n\n## What was decided\n\nThe catchment is a 10-minute bike ride with a walk of up to 2 minutes at each end. The walks do not count against the 10 minutes.\n\nAt a walking speed of 1.34 m/s (Bosina and Weidmann 2017; Montufar and others 2007), 2 minutes is about 161 m.\n\n- **At home.** The rider walks the bike on footpaths to the nearest point of the bike network from which a ride can reach the station at all.\n- **At the station.** The rider gets off at the point of the bike network nearest each parking entrance, and walks to the entrance.\n\nThe walk limit only rules out a home with no such point within 2 minutes. A home whose ride from that point takes longer than 10 minutes is out.\n\n## Why\n\nMy photo review found a staircase built for cyclists to walk their bikes down into the underground parking. A ride that ends with a short walk is how such trips work.\n\nFive minutes seemed too long. No study measures how far people keep their bikes from their homes, so the limit is my judgment: most bikes are parked within a couple of minutes of home.\n\n## Other rules considered\n\n- **Always the very nearest point.** Rejected: a rider walks on past a point from which no ride reaches the station.\n- **The nearest point whose ride fits in 10 minutes.** A home at the edge could then walk up to 161 m toward the station to bring its ride under 10 minutes. The walk would become free travel. It reaches 15% to 20% more homes, and is reported only as a comparison.\n- **1 or 3 minutes.** On the national road network, both came within 1.3% of the 2-minute result. I chose 2.\n\n## Limits\n\n- No study supports the 2-minute limit. It is my judgment.\n- The walk follows mapped footpaths. A path missing from OpenStreetMap is missing from the walk.\n", "cited": {"literature": [{"key": "bosina2017", "ref": "Bosina, E., & Weidmann, U. (2017). Estimating pedestrian speed using aggregated literature data. Physica A: Statistical Mechanics and Its Applications, 468, 1–29. https://doi.org/10.1016/j.physa.2016.09.044", "url": "https://doi.org/10.1016/j.physa.2016.09.044"}, {"key": "montufar2007", "ref": "Montufar, J., Arango, J., Porter, M., & Nakagawa, S. (2007). Pedestrians’ Normal Walking Speed and Speed When Crossing a Street. Transportation Research Record: Journal of the Transportation Research Board, 2002(1), 90–97. https://doi.org/10.3141/2002-12", "url": "https://doi.org/10.3141/2002-12"}], "sources": [], "records": [], "files": []}}], "files": []}}, {"id": "l_walk", "kind": "limit", "label": "2 minutes at 1.34 m/s", "cite": "DEC-026", "x": 1250, "y": -74.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/decisions/DEC-026-run-023-current-run.md", "title": "A two-minute walk at each end of the ride", "tab": "Two-minute walks", "status": "Decided 2026-09-16. The walk rule is in force. The result this decision named was replaced by later runs.", "md": "## My answers\n\nFrom my photo review of streets, 2026-09-16:\n\n> Staircase to underground bicycle parking facility. Explicitly built to accommodate dismounted cyclists walking their bicycles into the parking facility. Should count as a final dismounted leg just like the initial dismounted leg.\n\n> looks like a ped environment. would be included by a new rule that includes a last-leg dismount.\n\nIn conversation, 2026-09-16:\n\n> I noted some additional rules that would be worthwhile. One is a meaningful methods change to include a last-leg walking segment. This method should also make it into the thesis\n\n> Tbh, I don't think either walk segment should count within the ten minutes. I think a 10-minute bike ride with up to a five-minute walk to the station, home entrance, or cycling facility. I doubt there is a single segment with more than a five-minute walk to a cycling facility\n\n> I also don't think any of these rules require a literature search. Nothing here is empirical. It's based on how every human bicycle trip unfolds in nature, so it follows self-evidently from logic.\n\n> I think it's possible that five minutes might be too long. Is there any evidence about how far people park their bicycles from their homes? I imagine most are parked within a couple minutes from their homes. And I doubt most people walk their bicycles for a full five minutes.\n\n> Yeah, that doesn't fit. A reduction in the walking allowance makes more sense.\n\n> And I didn't say before, but I do want to adopt a 2 min rule at either end\n\n> I am incredulous that in the Netherlands, the planning paradise, engineers would design low-stress segments that contain homes but don't connect to the rest of the low-stress network. Where this appears to occur in the data I am willing to bet is a data issue when we're talking about a 40 m gap.\n\n> I think no, It doesn't make sense to exclude it if another low-stress segment that isn't the closest but is still within 2 minutes can succeed. That's just not how trips work\n\n> Yes, your assumption of \"succeed\" was my intention. For completeness, we should also do this method for OSM.\n\n## What was decided\n\nThe catchment is a 10-minute bike ride with a walk of up to 2 minutes at each end. The walks do not count against the 10 minutes.\n\nAt a walking speed of 1.34 m/s (Bosina and Weidmann 2017; Montufar and others 2007), 2 minutes is about 161 m.\n\n- **At home.** The rider walks the bike on footpaths to the nearest point of the bike network from which a ride can reach the station at all.\n- **At the station.** The rider gets off at the point of the bike network nearest each parking entrance, and walks to the entrance.\n\nThe walk limit only rules out a home with no such point within 2 minutes. A home whose ride from that point takes longer than 10 minutes is out.\n\n## Why\n\nMy photo review found a staircase built for cyclists to walk their bikes down into the underground parking. A ride that ends with a short walk is how such trips work.\n\nFive minutes seemed too long. No study measures how far people keep their bikes from their homes, so the limit is my judgment: most bikes are parked within a couple of minutes of home.\n\n## Other rules considered\n\n- **Always the very nearest point.** Rejected: a rider walks on past a point from which no ride reaches the station.\n- **The nearest point whose ride fits in 10 minutes.** A home at the edge could then walk up to 161 m toward the station to bring its ride under 10 minutes. The walk would become free travel. It reaches 15% to 20% more homes, and is reported only as a comparison.\n- **1 or 3 minutes.** On the national road network, both came within 1.3% of the 2-minute result. I chose 2.\n\n## Limits\n\n- No study supports the 2-minute limit. It is my judgment.\n- The walk follows mapped footpaths. A path missing from OpenStreetMap is missing from the walk.\n", "cited": {"literature": [{"key": "bosina2017", "ref": "Bosina, E., & Weidmann, U. (2017). Estimating pedestrian speed using aggregated literature data. Physica A: Statistical Mechanics and Its Applications, 468, 1–29. https://doi.org/10.1016/j.physa.2016.09.044", "url": "https://doi.org/10.1016/j.physa.2016.09.044"}, {"key": "montufar2007", "ref": "Montufar, J., Arango, J., Porter, M., & Nakagawa, S. (2007). Pedestrians’ Normal Walking Speed and Speed When Crossing a Street. Transportation Research Record: Journal of the Transportation Research Board, 2002(1), 90–97. https://doi.org/10.3141/2002-12", "url": "https://doi.org/10.3141/2002-12"}], "sources": [], "records": [], "files": []}}], "files": []}}, {"id": "p_route", "kind": "process", "label": "Route each home to the station", "cite": "RUN-002", "x": 1750, "y": 0.0, "w": 190, "h": 62, "info": {"image": "steps/p_route.png"}}, {"id": "l_budget", "kind": "limit", "label": "10 minutes at 15 km/h", "cite": "RUN-002; the speed, RUN-003", "x": 1500, "y": 0.0, "w": 190, "h": 62, "info": {"docs": [{"path": "wiki/decisions/DEC-003-cycling-speed.md", "title": "Everyone cycles at 15 km/h", "tab": "Cycling speed", "status": "Decided 2026-09-13. In force.", "md": "## My answers\n\nFrom my review of the first set of decisions, 2026-09-13:\n\n- **Should the pilot assume people cycle at 15 km/h?** Yes, use 15 km/h. Note: \"15 km/h is well-justified by the literature.\"\n\n## What was decided\n\nThe model assumes every rider cycles at 15 km/h. This is a fixed assumption, not a measurement of how fast people in Breda ride.\n\n## Why 15 km/h\n\nStudies of Dutch cyclists measure riding speeds above 15 km/h. Riders in town reach about 19 km/h when nothing slows them (Kager and others 2016). Everyday riding speeds are 16 to 18 km/h, not counting stops (Schepers and others 2017). GPS trackers record 16.2 km/h on average (Yan and others 2024).\n\nThose speeds leave out time spent waiting at junctions. The model does not add waiting time on its own. So the speed is set below the riding speeds, and the lower speed stands in for the waiting.\n\nA search of the literature found no measured door-to-door speed for trips to a station.\n\n## The check against recorded trips\n\nThe assumption was checked against Fiets Telweek, a national cycling week in 2016 in which volunteers tracked their rides. 81 tracked trips ended within 300 m of a station or parking entrance and had a usable speed along their whole route.\n\nHalf of those trips rode faster than 15.08 km/h and half slower. The middle half rode between 13.8 and 17.6 km/h.\n\nThe trips carry no start or end times, so their speed is not door-to-door. Trips with a stop recorded as zero speed had to be left out, so the check may run slightly fast (Lißner and Huber 2021; Gillis and others 2020).\n\n## Other speeds considered\n\n- **15.08 km/h, the middle of the recorded trips.** It rounds to 15. Using it exactly would rest the method on one small volunteer sample from 2016.\n- **16.2 or 17 km/h, the measured averages.** They leave out stops. With no waiting time in the model, they would overstate how far a rider gets.\n- **14 km/h.** An estimate from a subgroup of five riders, not a finding of any study.\n\n## Limits\n\n- Every count in the result is at 15 km/h. The current result is not repeated at other speeds.\n- Waiting at junctions is not modeled. The lower speed carries it.\n", "cited": {"literature": [{"key": "gillis2020", "ref": "Gillis, D., Gautama, S., Van Gheluwe, C., Semanjski, I., Lopez, A. J., & Lauwers, D. (2020). Measuring Delays for Bicycles at Signalized Intersections Using Smartphone GPS Tracking Data. ISPRS International Journal of Geo-Information, 9(3), 174. https://doi.org/10.3390/ijgi9030174", "url": "https://doi.org/10.3390/ijgi9030174"}, {"key": "kager2016", "ref": "Kager, R., Bertolini, L., & Te Brömmelstroet, M. (2016). Characterisation of and reflections on the synergy of bicycles and public transport. Transportation Research Part A: Policy and Practice, 85, 208–219. https://doi.org/10.1016/j.tra.2016.01.015", "url": "https://doi.org/10.1016/j.tra.2016.01.015"}, {"key": "lissner2021", "ref": "Lißner, S., & Huber, S. (2021). Facing the needs for clean bicycle data – a bicycle-specific approach of GPS data processing. European Transport Research Review, 13(1). https://doi.org/10.1186/s12544-020-00462-2", "url": "https://doi.org/10.1186/s12544-020-00462-2"}, {"key": "schepers2017", "ref": "Schepers, P., Twisk, D., Fishman, E., Fyhri, A., & Jensen, A. (2017). The Dutch road to a high level of cycling safety. Safety Science, 92, 264–273. https://doi.org/10.1016/j.ssci.2015.06.005", "url": "https://doi.org/10.1016/j.ssci.2015.06.005"}, {"key": "yan2024", "ref": "Yan, H., Maat, K., & van Wee, B. (2024). Cycling speed variation: A multilevel model of characteristics of cyclists, trips and route tracking points. Transportation, 52(5), 1857–1886. https://doi.org/10.1007/s11116-024-10477-6", "url": "https://doi.org/10.1007/s11116-024-10477-6"}], "sources": [], "records": [], "files": []}}, {"path": "wiki/runs/RUN-002-access-leg.md", "title": "First test of walking the bike from home to the network", "tab": "Walking the bike to the network", "status": "Run 2026-09-12. Replaced by later runs. Its limits on the walk from the front door still apply.", "md": "## My answers\n\nFrom my review of the first set of decisions, 2026-09-13, on the decision this run informed:\n\n- **Should an address count as reachable if the resident walks the bicycle to the network?** Yes, count addresses by the walk.\n- **Should a Japanese study of walking with a bicycle count as evidence?** Leave it out.\n\n2026-09-16, after reading what that study measured:\n\n> Yeah, that doesn't fit.\n\n## What this run tested\n\nThe first model joined each home to the nearest street the bike may use, if one lay within 50 m, and started the ride there. A home 51 m from the network was out, and a home 49 m away cycled the gap.\n\nThis run tested a different start. The rider walks the bike from home along footpaths to the bike network, then rides.\n\n## The walk's rules\n\n- **From the address to the footpaths:** at most 100 m in a straight line. The address register gives a point inside the building, not a front door, so this short link stands in for the way out.\n- **From the footpaths onto the bike network:** at most 50 m.\n- **The whole walk:** at most 300 m, including the link from the address.\n- **Walking speed:** 1.34 m/s (Bosina and Weidmann 2017; Montufar and others 2007).\n- **Steps** block the walk unless they have a ramp for bikes.\n\nThe run repeated every case with each rule loosened or tightened. That shows how much the result depends on it.\n\n## What it showed\n\nHow far the rider may walk matters. On the first, uncorrected network, changing the walking limit moved one low-stress count by a factor of four, from 1,858 to 8,015 homes.\n\n## Limits\n\n- 39 homes were more than 100 m from any footpath, and so could not start a walk. A 250 m limit would have connected all of them.\n- The ride was tested at 15 km/h only.\n- Waiting at junctions is not modeled.\n\n## What changed later\n\nThe walk limit is now 2 minutes at each end of the ride, outside the 10 minutes. The 100 m link from the address and the 50 m step onto the bike network still apply.\n", "cited": {"literature": [{"key": "bosina2017", "ref": "Bosina, E., & Weidmann, U. (2017). Estimating pedestrian speed using aggregated literature data. Physica A: Statistical Mechanics and Its Applications, 468, 1–29. https://doi.org/10.1016/j.physa.2016.09.044", "url": "https://doi.org/10.1016/j.physa.2016.09.044"}, {"key": "montufar2007", "ref": "Montufar, J., Arango, J., Porter, M., & Nakagawa, S. (2007). Pedestrians’ Normal Walking Speed and Speed When Crossing a Street. Transportation Research Record: Journal of the Transportation Research Board, 2002(1), 90–97. https://doi.org/10.3141/2002-12", "url": "https://doi.org/10.3141/2002-12"}], "sources": [], "records": [], "files": []}}, {"path": "wiki/runs/RUN-003-speed-check.md", "title": "Checking 15 km/h against recorded bike trips", "tab": "Speed check", "status": "Run 2026-09-12. Checked and kept as evidence.", "md": "## What this run tested\n\nIt checked the 15 km/h assumption against Fiets Telweek, a national cycling week in 2016 in which volunteers tracked their rides with a phone app.\n\nIt looked at two things. First, trips that ended within 300 m of a station or bike-parking entrance. Second, every street stretch the app recorded inside the area a rider reaches in 10 minutes.\n\nBefore using the data, I agreed to follow the dataset's own reuse terms.\n\n## What the data can and cannot show\n\nThe data hold no start or end times, so they cannot give a door-to-door speed. They give a speed over the streets each trip was matched to. That speed is usable only when every stretch of the trip has a real, positive speed.\n\n## What it found\n\n111 trips ended near an entrance. 81 had a usable speed along their whole route.\n\n- **Trips:** half rode faster than 15.08 km/h and half slower. The middle half rode between 13.8 and 17.6 km/h.\n- **Street stretches:** 2,900 stretches inside the 10-minute area had a usable speed. Half were faster than 17.4 km/h. The middle half lay between 14.5 and 20.3 km/h.\n\nThe trips' middle speed is 0.08 km/h above 15 km/h. That supports 15 km/h as a cautious assumption.\n\n## Limits\n\n- **Stops were left out.** 27 trips had a stretch with no positive speed and were dropped. A speed near zero can be a real stop at a junction (Lißner and Huber 2021; Gillis and others 2020). So the trips kept may run slightly fast.\n- **Unrealistic jumps were left out.** Four trips had a stretch above 90 km/h, a sign of a GPS jump, and were dropped. The 90 km/h cut-off comes from a study of raw GPS points, not from street stretches. No standard cut-off exists.\n- **The street speeds count every stretch equally,** whatever its length or traffic, and may mix both directions.\n- **The data are from 2016 volunteers,** checked against a 2026 street network.\n", "cited": {"literature": [{"key": "gillis2020", "ref": "Gillis, D., Gautama, S., Van Gheluwe, C., Semanjski, I., Lopez, A. J., & Lauwers, D. (2020). Measuring Delays for Bicycles at Signalized Intersections Using Smartphone GPS Tracking Data. ISPRS International Journal of Geo-Information, 9(3), 174. https://doi.org/10.3390/ijgi9030174", "url": "https://doi.org/10.3390/ijgi9030174"}, {"key": "lissner2021", "ref": "Lißner, S., & Huber, S. (2021). Facing the needs for clean bicycle data – a bicycle-specific approach of GPS data processing. European Transport Research Review, 13(1). https://doi.org/10.1186/s12544-020-00462-2", "url": "https://doi.org/10.1186/s12544-020-00462-2"}], "sources": [], "records": [], "files": []}}], "files": []}}, {"id": "out_legal", "kind": "output", "label": "31,479 homes", "cite": "", "x": 2000, "y": 0.0, "w": 190, "h": 62, "info": {"image": "steps/out_legal.png"}}, {"id": "run.py", "kind": "script", "label": "run.py", "cite": "", "x": 0, "y": 0.0, "w": 190, "h": 62, "info": {"code": {"path": "src/breda_pilot/adopted/run.py", "code": "\"\"\"The adopted run: homes within a 2-minute walk and a 10-minute bike ride of Breda Centraal's entrances (DEC-055), built from the raw OpenStreetMap download and address register alone.\"\"\"\n\n# ==============================================================================\n# Inputs and dependencies\n# ==============================================================================\n\n# Let type hints name classes defined later in the file.\nfrom __future__ import annotations\n\n# Checksums prove the inputs and the code are the ones the config names.\nimport hashlib\n# Paths to files.\nfrom pathlib import Path\n\n# Pandas writes the result tables.\nimport pandas as pd\n# The config is YAML.\nimport yaml\n\n# The entrances and the study area around them.\nfrom breda_pilot.adopted.entrances import entrances, study_area\n# The homes and where they join the walking network.\nfrom breda_pilot.adopted.homes import homes, links\n# The bike network, its one-way rule and its graph.\nfrom breda_pilot.adopted.network import add_reverse_edges, bike_graph, legal_network, two_way_for_bikes\n# Reading OpenStreetMap.\nfrom breda_pilot.adopted.osm import extract, read\n# The ride's timing.\nfrom breda_pilot.adopted.ride import ride_seconds\n# The walks at both ends.\nfrom breda_pilot.adopted.walk import entrance_starts, home_trips, meeting_points, nearest_meeting\n# The walking network.\nfrom breda_pilot.adopted.walking import walking_network\n\n# The repository's root folder, three levels up from this file.\nROOT = Path(__file__).resolve().parents[3]\n\n\n# ==============================================================================\n# Bookkeeping functions\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# sha256 — a file's SHA-256 checksum, as text.\n# ------------------------------------------------------------------------------\ndef sha256(path: Path) -> str:\n    # The checksum, built up as the file is read.\n    digest = hashlib.sha256()\n    # Read the file as bytes.\n    with open(path, \"rb\") as handle:\n        # A megabyte at a time, until the end.\n        for block in iter(lambda: handle.read(1 << 20), b\"\"):\n            # Add it to the checksum.\n            digest.update(block)\n    # The checksum as text.\n    return digest.hexdigest()\n\n\n# ------------------------------------------------------------------------------\n# check_pins — stop unless every raw input and every file of this code matches\n# the checksum the config gives it. This is how the config turns all other\n# code off: the run executes these files and no others.\n# ------------------------------------------------------------------------------\ndef check_pins(config: dict) -> None:\n    # Each input's path and checksum, then each code file's.\n    pins = [(spec[\"path\"], spec[\"sha256\"]) for spec in config[\"inputs\"].values()] + list(config[\"code\"].items())\n    # Check each one.\n    for path, expected in pins:\n        # A mismatch means a different file than the run was frozen with.\n        if sha256(ROOT / path) != expected:\n            # Say which and stop.\n            raise ValueError(f\"{path} does not match its pinned checksum\")\n\n\n# ==============================================================================\n# Section 1: the run\n# ==============================================================================\n\n# ------------------------------------------------------------------------------\n# run — the whole method, from the raw files to the homes reached.\n# Builds the entrances and study area, the bike network, the walking network\n# and the homes' links; then, for each direction and set of entrances, walks\n# from the entrances, rides outward, walks from the homes, and counts the homes\n# whose trip fits. Writes each home's trip and the four counts.\n# ------------------------------------------------------------------------------\ndef run(config_path: str) -> None:\n    # Read the config.\n    config = yaml.safe_load((ROOT / config_path).read_text(encoding=\"utf-8\"))\n    # Stop now if any input or code file is not the pinned one.\n    check_pins(config)\n    # The raw OpenStreetMap download.\n    pbf = ROOT / config[\"inputs\"][\"osm\"][\"path\"]\n    # The settings, by name.\n    p = config[\"parameters\"]\n    # Where the outputs go.\n    out = ROOT / config[\"output_dir\"]\n    # Make the folders.\n    (out / \"paths\").mkdir(parents=True, exist_ok=True)\n    # The longest walk, in meters: the walk limit in seconds at walking pace.\n    walk_max_m = float(p[\"walk\"][\"max_s\"]) * float(p[\"walk\"][\"speed_mps\"])\n\n    # --- The entrances and the study area\n    # The five entrances, from OpenStreetMap.\n    points = entrances(pbf, p[\"entrances\"][\"search_box_lonlat\"], p[\"entrances\"][\"listed\"])\n    # Everything within 5 km of them.\n    area = study_area(points, float(p[\"entrances\"][\"study_area_buffer_m\"]))\n\n    # --- OpenStreetMap\n    # The study area's highway ways, cut from the download.\n    nodes, ways = read(extract(pbf, area, out / \"work\"))\n\n    # --- The bike network\n    # The junctions and edges bikes may legally use.\n    junctions, edges = legal_network(nodes, ways, p[\"bike_access\"])\n    # The one-way rule's settings.\n    rule = p[\"one_way\"]\n    # Which one-way pieces bikes may also ride against the flow.\n    opened = two_way_for_bikes(edges, rule[\"mixed_highways\"], rule[\"dual_m\"], rule[\"opposite_deg\"], rule[\"dual_way_share\"])\n    # Add a reverse edge for each.\n    edges = add_reverse_edges(edges, opened)\n    # The graph to ride on.\n    graph = bike_graph(junctions, edges)\n\n    # --- The walking network and the homes\n    # The walking graph, its barriers, the junctions it uses, and its pushable pieces.\n    walk_graph, blocked, touched, walkable = walking_network(nodes, ways, area, p[\"walking\"])\n    # Each walking junction's nearest bike edges within the offset limit.\n    meets = meeting_points(touched, edges, float(p[\"walk\"][\"offset_max_m\"]))\n    # The homes, from the address register.\n    units = homes(ROOT / config[\"inputs\"][\"bag\"][\"path\"], p[\"homes\"][\"layer\"], area, p[\"homes\"][\"statuses\"], p[\"homes\"][\"use\"])\n    # Where each home joins the walking network.\n    joins = links(units, walkable, touched, float(p[\"walk\"][\"connector_max_m\"]))\n\n    # --- Each direction and each set of entrances\n    # One result row per scenario.\n    rows = []\n    # Riding to the station, then from it.\n    for direction in p[\"directions\"]:\n        # The parking entrances, then the station entrances.\n        for name, kind in p[\"entrance_sets\"].items():\n            # Where the ride begins at each entrance's walk, in meters along the bike edge.\n            starts = entrance_starts(walk_graph, blocked, meets, points[points[\"kind\"] == kind], direction, walk_max_m)\n            # Those meters as riding seconds.\n            start_seconds = {n: m / (float(p[\"ride\"][\"speed_kmh\"]) / 3.6) for n, m in starts.items()}\n            # Seconds from every reachable bike node, with no time limit yet.\n            seconds = ride_seconds(graph, start_seconds, float(p[\"ride\"][\"speed_kmh\"]), direction)\n            # From each walking junction, the nearest meeting points with a ride.\n            fronts = nearest_meeting(walk_graph, blocked, meets, seconds, float(p[\"ride\"][\"speed_kmh\"]), direction, walk_max_m)\n            # Each home's trip, kept when the walk and the ride both fit.\n            trips = home_trips(joins, fronts, walk_max_m, float(p[\"ride\"][\"budget_s\"]), float(p[\"walk\"][\"speed_mps\"]))\n            # Each reached home's trip, as a table.\n            pd.DataFrame(list(trips.values())).to_csv(out / \"paths\" / f\"{direction}_{name}.csv\", index=False)\n            # The count of homes reached.\n            rows.append({\"direction\": direction, \"dest_set\": name, \"homes\": len(trips)})\n    # The result, homes reached in each scenario, saved.\n    pd.DataFrame(rows).to_csv(out / \"metrics.csv\", index=False)\n", "lang": "python", "defs": [{"name": "sha256", "line": 46}, {"name": "check_pins", "line": 64}, {"name": "run", "line": 86}]}}}, {"id": "entrances.py", "kind": "module", "label": "entrances.py", "cite": "", "x": 750, "y": 111.0, "w": 190, "h": 62, "info": {"code": {"path": "src/breda_pilot/adopted/entrances.py", "code": "\"\"\"The entrances: Breda Centraal's two bike-parking entrances and three station entrances (DEC-004), and the study area around them.\"\"\"\n\n# ==============================================================================\n# Inputs and dependencies\n# ==============================================================================\n\n# Let type hints name classes defined later in the file.\nfrom __future__ import annotations\n\n# GeoPandas holds the entrances as points on the map.\nimport geopandas as gpd\n# pyogrio reads the raw OpenStreetMap download's tagged points.\nimport pyogrio\n\n\n# ------------------------------------------------------------------------------\n# entrances — the entrance points, read from OpenStreetMap by their node ids.\n# Takes the raw download, a search box in longitude and latitude, and the list\n# of entrances (id, kind, OSM node). Returns one row per entrance, in the\n# list's order, with its kind, its node and its location in meters (RD New).\n# ------------------------------------------------------------------------------\ndef entrances(pbf, box_lonlat, listed: list[dict]) -> gpd.GeoDataFrame:\n    # The download's tagged points inside the box, moved into meters.\n    points = pyogrio.read_dataframe(pbf, layer=\"points\", bbox=tuple(box_lonlat)).to_crs(\"EPSG:28992\")\n    # Each listed entrance's point, found by its node id.\n    rows = [{\"dest_id\": e[\"dest_id\"], \"kind\": e[\"kind\"], \"source\": f\"node/{e['osm_node']}\",\n             \"geometry\": points.loc[points[\"osm_id\"] == str(e[\"osm_node\"]), \"geometry\"].iloc[0]} for e in listed]\n    # As a map layer.\n    return gpd.GeoDataFrame(rows, geometry=\"geometry\", crs=\"EPSG:28992\")\n\n\n# ------------------------------------------------------------------------------\n# study_area — everything within a set distance of any entrance.\n# Takes the entrances and the distance in meters; returns one shape. Streets,\n# paths and homes are read only inside it.\n# ------------------------------------------------------------------------------\ndef study_area(points: gpd.GeoDataFrame, buffer_m: float):\n    # The entrances as one group of points, widened by the distance.\n    return points.geometry.union_all().buffer(buffer_m)\n", "lang": "python", "defs": [{"name": "entrances", "line": 22}, {"name": "study_area", "line": 37}]}}}, {"id": "osm.py", "kind": "module", "label": "osm.py", "cite": "", "x": 500, "y": -185.0, "w": 190, "h": 62, "info": {"code": {"path": "src/breda_pilot/adopted/osm.py", "code": "\"\"\"Reading OpenStreetMap: the study area's streets and paths, from the raw Geofabrik download.\"\"\"\n\n# ==============================================================================\n# Inputs and dependencies\n# ==============================================================================\n\n# Let type hints name classes defined later in the file.\nfrom __future__ import annotations\n\n# osmium, a command-line tool, does the clipping and filtering of the raw file.\nimport subprocess\n# The extract is OpenStreetMap's XML format, read one element at a time.\nimport xml.etree.ElementTree as ET\n# Paths to files.\nfrom pathlib import Path\n\n# GeoPandas writes the study area for osmium to read.\nimport geopandas as gpd\n\n\n# ------------------------------------------------------------------------------\n# extract — the study area's highway ways, cut out of the raw download.\n# Writes the area as a GeoJSON polygon, has osmium keep every way that touches\n# it (whole, not cut at the edge) and then only the ways with a highway tag,\n# with the nodes they use. Returns the path of the resulting XML file.\n# ------------------------------------------------------------------------------\ndef extract(pbf: Path, area, work: Path) -> Path:\n    # A folder for the working files.\n    work.mkdir(parents=True, exist_ok=True)\n    # Where the area polygon goes.\n    polygon = work / \"study_area.geojson\"\n    # Write the area in longitude and latitude, as osmium needs.\n    gpd.GeoDataFrame(geometry=[area], crs=\"EPSG:28992\").to_crs(4326).to_file(polygon, driver=\"GeoJSON\")\n    # Where the clipped file goes.\n    clip = work / \"clip.osm.pbf\"\n    # Where the highway ways go.\n    highways = work / \"highways.osm\"\n    # Keep every way with any node in the area, complete.\n    subprocess.run([\"osmium\", \"extract\", \"--polygon\", str(polygon), \"--strategy\", \"complete_ways\", \"--overwrite\", \"-o\", str(clip), str(pbf)], check=True)\n    # Of those, keep the ways tagged highway, and the nodes they use.\n    subprocess.run([\"osmium\", \"tags-filter\", \"--overwrite\", \"-o\", str(highways), str(clip), \"w/highway\"], check=True)\n    # The highway ways.\n    return highways\n\n\n# ------------------------------------------------------------------------------\n# read — every node and highway way in the extract.\n# Returns nodes as {id: (longitude, latitude, tags)} and ways as a list of\n# (way id, the ids of its nodes in order, tags), in the file's order.\n# ------------------------------------------------------------------------------\ndef read(path: Path):\n    # The nodes, by id.\n    nodes = {}\n    # The ways, in order.\n    ways = []\n    # Read the file one finished element at a time, so it never sits in memory whole.\n    for _, element in ET.iterparse(str(path), events=(\"end\",)):\n        # A node: a point with a location.\n        if element.tag == \"node\":\n            # Its location and its tags.\n            nodes[int(element.get(\"id\"))] = (float(element.get(\"lon\")), float(element.get(\"lat\")), {t.get(\"k\"): t.get(\"v\") for t in element.findall(\"tag\")})\n            # Free the element.\n            element.clear()\n        # A way: a line through nodes.\n        elif element.tag == \"way\":\n            # Its tags.\n            tags = {t.get(\"k\"): t.get(\"v\") for t in element.findall(\"tag\")}\n            # Only streets and paths, which carry a highway tag.\n            if \"highway\" in tags:\n                # Its id, its nodes in order, and its tags.\n                ways.append((int(element.get(\"id\")), [int(nd.get(\"ref\")) for nd in element.findall(\"nd\")], tags))\n            # Free the element.\n            element.clear()\n    # Both, for the two networks.\n    return nodes, ways\n", "lang": "python", "defs": [{"name": "extract", "line": 27}, {"name": "read", "line": 51}]}}}, {"id": "network.py", "kind": "module", "label": "network.py", "cite": "", "x": 250, "y": -37.0, "w": 190, "h": 62, "info": {"code":
