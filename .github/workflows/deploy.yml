name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. NOT cancel-in-progress, even though a superseded
# deploy is normally waste: refresh-listings.yml shares this group and pushes
# commits, and cancel-in-progress is read from the run that *arrives*, not the
# one already going. Left true, a hand-edited push here would cancel a refresh
# mid-flight -- possibly after it had pushed its data commit and before it had
# deployed it, which is a commit on main that nothing ever publishes. Queue
# behind it instead; it takes about two minutes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # upload-pages-artifact has no exclude option and publishes `path` whole,
      # so build-time-only directories are dropped from the checkout first.
      # Nothing served links into tools/.
      - name: Prune build-time files from the artifact
        run: rm -rf tools

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
