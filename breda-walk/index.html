<style>/* required styles */

<style>
  :root { --paper: #F2EAD8; --ink: #2B2B2B; --muted: #8A8273; --line: #D9CFBA; }
  html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; background: var(--paper); }
  .leaflet-container { background: var(--paper); font: inherit; }
  .tools { position: fixed; z-index: 1000; right: calc(10px + env(safe-area-inset-right));
    top: calc(10px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; }
  .tools button { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line);
    background: #FFFDF8; color: var(--ink); font: 600 20px/1 system-ui, sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,.18); display: grid; place-items: center; padding: 0; }
  .tools button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  #status { position: fixed; z-index: 1000; left: calc(10px + env(safe-area-inset-left)); right: 66px;
    bottom: calc(10px + env(safe-area-inset-bottom)); background: #FFFDF8; border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 12px; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  #status:empty { display: none; }
  #sheet { position: fixed; z-index: 1001; left: 0; right: 0; bottom: 0; max-height: 62vh; overflow-y: auto;
    background: #FFFDF8; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    box-shadow: 0 -2px 12px rgba(0,0,0,.2); padding: 6px 0 calc(10px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .2s; }
  #sheet.open { transform: none; }
  #sheet h2 { font-size: 15px; margin: 8px 16px; }
  #sheet ol { list-style: none; margin: 0; padding: 0; }
  #sheet li button { all: unset; box-sizing: border-box; width: 100%; display: flex; gap: 10px; align-items: center;
    padding: 8px 16px; cursor: pointer; }
  #sheet li button:active { background: var(--paper); }
  .dot { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--ink);
    display: grid; place-items: center; font: 700 11px/1 system-ui, sans-serif; color: #fff; box-sizing: border-box; }
  .dot.end { border-radius: 4px; }
  .stop-icon .dot { box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 14px; }
  .leaflet-popup-content h3 { margin: 0 0 4px; font-size: 16px; }
  .leaflet-popup-content p { margin: 4px 0; }
  .leaflet-popup-content .meta { color: var(--muted); font-size: 13px; }
  .leaflet-popup-content { max-height: 55vh; overflow-y: auto; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: 0; }
</style>
</head>

</div>
<div id="status"></div>
<div id="sheet"><h2>Stops</h2><ol id="stops"></ol></div>

// Colours as on the route PNG.
const INK = "#2B2B2B", PAPER = "#F2EAD8";
const KIND = {
  start: ["start", "#9C3A28"], end: ["station", INK], scenic: ["scenic spot", "#E8C547"], street: ["street", INK],
  lattes: ["café and bookshop", "#5B3F8C"], bookshop: ["bookshop", "#5B3F8C"], plant: ["plant shop", "#4F8A3A"],
  outdoor: ["outdoor shop", "#2B6CB0"], "home/gift": ["home and gift", "#C2558A"],
  chocolate: ["chocolate shop", "#6B3E26"], bakery: ["bakery", "#D07A2E"],
};
const TIER = { 1: "#2F5F66", 2: "#C58B1B", 3: "#9C3A28" };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const map = L.map("map", { preferCanvas: true, zoomControl: false, attributionControl: true, tap: false });
L.control.zoom({ position: "bottomright" }).addTo(map);
map.attributionControl.setPrefix(false).addAttribution(
  '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>');
map.fitBounds(D.bounds, { padding: [20, 20] });

// CARTO Voyager when there is signal, over the offline street map, which
// shows through wherever a tile does not load.
L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${D.carto}`,
  { subdomains: "abcd", maxZoom: 20 }).addTo(map);
map.createPane("offline").style.zIndex = 150;
const offline = { pane: "offline", renderer: L.canvas({ pane: "offline" }), interactive: false };
L.layerGroup([
  ...D.base.green.map(p => L.polygon(p, { stroke: false, fillColor: "#D5DDB8", fillOpacity: 1, ...offline })),
  ...D.base.water.map(p => L.polygon(p, { stroke: false, fillColor: "#BFD0D4", fillOpacity: 1, ...offline })),
  ...D.base.foot.map(l => L.polyline(l, { color: "#C9C1B0", weight: 1, ...offline })),
  ...D.base.street.map(l => L.polyline(l, { color: "#B3AC9E", weight: 2, ...offline })),
  ...D.base.busy.map(l => L.polyline(l, { color: "#A39B8B", weight: 3.5, ...offline })),
]).addTo(map);

// Route: station to Foodhall dashed, then the loop coloured by kind of way.
L.polyline(D.approach, { color: INK, weight: 3, dashArray: "6 6", interactive: false }).addTo(map);
D.runs.forEach(r => L.polyline(r.pts, { color: TIER[r.t], weight: 5, opacity: .9, interactive: false }).addTo(map));

// Shops: faint when the route does not pass them; stops get their own marker.
D.shops.filter(s => !s.stop).forEach(s => {
  const [label, colour] = KIND[s.kind];
  L.circleMarker(s.at, { radius: 6, color: PAPER, weight: 1, fillColor: colour, fillOpacity: s.passed ? 1 : .35 })
    .bindPopup(`<h3>${esc(s.name)}</h3><p class="meta"><span class="key" style="background:${colour}"></span>${label}</p>`)
    .addTo(map);
});

// Numbered stops.
function dot(s) {
  const colour = KIND[s.kind][1], text = s.kind === "scenic" ? INK : "#fff";
  return `<span class="dot${s.kind === "end" ? " end" : ""}" style="background:${colour};color:${text}">${s.kind === "end" ? "C" : s.n}</span>`;
}
const markers = D.stops.map(s => {
  // Number and name, and the kind for shops, scenic spots and streets.
  const typed = !["start", "end"].includes(s.kind);
  const html = `<h3>${s.kind === "end" ? "" : s.n + " · "}${esc(s.name)}</h3>` + (typed ?
    `<p class="meta"><span class="key" style="background:${KIND[s.kind][1]}"></span>${KIND[s.kind][0]}</p>` : "");
  return L.marker(s.at, { icon: L.divIcon({ className: "stop-icon", html: dot(s), iconSize: [24, 24] }),
    zIndexOffset: 1000 }).bindPopup(html).addTo(map);
});

// Stop list.
const sheet = document.getElementById("sheet"), listBtn = document.getElementById("list");
document.getElementById("stops").innerHTML = D.stops.map((s, i) =>
  `<li><button data-i="${i}">${dot(s)}<span>${esc(s.name)}</span></button></li>`).join("");
document.getElementById("stops").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const m = markers[+b.dataset.i];
  toggleSheet(false);
  map.flyTo(m.getLatLng(), Math.max(map.getZoom(), 17), { duration: .6 });
  map.once("moveend", () => m.openPopup());
});
function toggleSheet(open) { sheet.classList.toggle("open", open); listBtn.setAttribute("aria-pressed", open); }
listBtn.onclick = () => toggleSheet(!sheet.classList.contains("open"));
map.on("click", () => toggleSheet(false));

// Where a position falls along the loop. Near a spot the loop passes twice,
// keep to the pass closest to the last one.
const K = Math.cos(51.589 * Math.PI / 180) * 111320, M = 110540;
let lastAlong = null;
function alongRoute(lat, lon) {
  const px = lon * K, py = lat * M, hits = [];
  for (let i = 0; i < D.line.length - 1; i++) {
    const [a, b] = [D.line[i], D.line[i + 1]];
    const ax = a[1] * K, ay = a[0] * M, dx = b[1] * K - ax, dy = b[0] * M - ay;
    const len2 = dx * dx + dy * dy, t = len2 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2)) : 0;
    hits.push({ off: Math.hypot(px - ax - t * dx, py - ay - t * dy), at: D.cum[i] + t * (D.cum[i + 1] - D.cum[i]) });
  }
  const best = Math.min(...hits.map(h => h.off));
  const near = hits.filter(h => h.off <= best + 25);
  const pick = lastAlong === null ? near.find(h => h.off === best)
    : near.reduce((p, h) => Math.abs(h.at - lastAlong) < Math.abs(p.at - lastAlong) ? h : p);
  lastAlong = pick.at;
  return pick;
}

// The phone's position.
const status = document.getElementById("status"), locBtn = document.getElementById("locate");
let me = null, ring = null, watch = null, follow = false;
function show(pos) {
  const { latitude: lat, longitude: lon, accuracy } = pos.coords, ll = [lat, lon];
  if (!me) {
    ring = L.circle(ll, { radius: accuracy, color: "#2B6CB0", weight: 1, fillOpacity: .12, interactive: false }).addTo(map);
    me = L.circleMarker(ll, { radius: 8, color: "#fff", weight: 3, fillColor: "#2B6CB0", fillOpacity: 1 }).addTo(map);
    map.flyTo(ll, Math.max(map.getZoom(), 16), { duration: .6 });
  }
  me.setLatLng(ll); ring.setLatLng(ll).setRadius(accuracy);
  if (follow) map.panTo(ll);
  const h = alongRoute(lat, lon), next = D.stops.find(s => s.km * 1000 > h.at + 15);
  status.innerHTML = h.off > 300 ? `${Math.round(h.off)} m from the route · ±${Math.round(accuracy)} m`
    : `${(h.at / 1000).toFixed(1)} of ${(D.total / 1000).toFixed(1)} km` +
      (h.off > 30 ? ` · ${Math.round(h.off)} m off the route` : "") +
      (next ? ` · next: ${next.kind === "end" ? "" : next.n + " "}${esc(next.name)}, ${Math.round(next.km * 1000 - h.at)} m` : "") +
      ` · ±${Math.round(accuracy)} m`;
}
function fail(err) {
  status.textContent = err.code === 1 ? "Location is blocked for this page. Allow it in the browser's site settings."
    : `No position yet (${err.message || "unavailable"}).`;
}
locBtn.onclick = () => {
  if (!("geolocation" in navigator)) { status.textContent = "This browser gives no location to this page."; return; }
  if (watch === null) {
    status.textContent = "Finding you…";
    watch = navigator.geolocation.watchPosition(show, fail, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
  } else if (me) map.flyTo(me.getLatLng(), Math.max(map.getZoom(), 17), { duration: .5 });
  follow = true; locBtn.setAttribute("aria-pressed", "true");
};
map.on("dragstart", () => { follow = false; locBtn.setAttribute("aria-pressed", "false"); });
</script>
