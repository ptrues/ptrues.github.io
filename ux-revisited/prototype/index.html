<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Safety Plan prototype</title>
<!--
  Clickable prototype of the proposed Lab Safety Plan application, restyled in 2026.
  Screens, content and navigation follow the Figma export (data/raw/figma-ehs-lsp-web-app-2026/:
  the screen images and flows.md). Colors are sampled from those screens: navy #13294b
  (top bar), EHS blue #2071a1 (logo, active menu item), link blue #0645ad.
  Type follows UNC's brand fonts (references/docs/unc-visual-identity-2026/): Open Sans, with Arial as UNC's fallback.
  Nothing is saved; reloading starts over.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #13294b;
    --blue: #2071a1;
    /* Text colors pass WCAG AAA (7:1) over the darkest backdrop the glass can show;
       scripts/analysis/check_prototype_contrast.mjs measures every text run. */
    --blue-ink: #154b6a; /* the EHS blue, deepened for text and for buttons with white text */
    --link: #0640a1;
    --ink: #13294b;
    --soft: #3b4859;
    --line: rgb(19 41 75 / 0.14);
    --field: rgb(255 255 255 / 0.86);
    --glass: rgb(255 255 255 / 0.8);
    --glass-strong: rgb(255 255 255 / 0.88);
    --glass-edge: rgb(255 255 255 / 0.75);
    --red: #8a1d17;
    --amber: #634000;
    --green: #1e4f31;
    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 8px;
    --blur: blur(18px) saturate(150%);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Open Sans", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    background: #e6eef4;
  }
  /* The field behind the glass: soft washes of the two brand blues */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(40rem 32rem at 8% 12%, rgb(32 113 161 / 0.38), transparent 70%),
      radial-gradient(36rem 30rem at 92% 30%, rgb(19 41 75 / 0.28), transparent 70%),
      radial-gradient(44rem 34rem at 60% 105%, rgb(120 180 215 / 0.50), transparent 70%),
      #e6eef4;
  }

  .glass {
    background: var(--glass);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border: 1px solid var(--glass-edge);
    box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.8), 0 18px 40px -22px rgb(19 41 75 / 0.45);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgb(255 255 255 / 0.92); }
  }

  a { color: var(--link); text-underline-offset: 3px; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
  #sheet:focus { outline: none; }

  /* Top bar */
  .top {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 0.7rem 1.5rem;
    color: #fff;
    background: rgb(19 41 75 / 0.92);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    border-bottom: 1px solid rgb(255 255 255 / 0.14);
  }
  .brand { display: flex; flex-direction: column; line-height: 1.2; }
  .brand b { font-size: 1.05rem; font-weight: 600; letter-spacing: 0.01em; }
  .brand span { font-size: 0.78rem; color: rgb(255 255 255 / 0.85); }
  .top .note {
    margin-left: auto;
    margin-right: 0.5rem;
    font-size: 0.78rem;
    color: rgb(255 255 255 / 0.85);
  }
  .top .user { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgb(255 255 255 / 0.12);
    font-size: 0.75rem; font-weight: 600;
  }

  /* Shell */
  .shell {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr);
    gap: 1.25rem;
    max-width: 1240px;
    margin: 0 auto;
    padding: 1.25rem;
    align-items: start;
  }
  .rail {
    position: sticky;
    top: 4.6rem;
    border-radius: var(--r-lg);
    padding: 0.75rem;
    max-height: calc(100vh - 5.8rem);
    overflow: auto;
  }
  .rail h2 {
    margin: 0.4rem 0.6rem 0.5rem;
    font-size: 1.05rem;
    font-weight: 600;
  }
  .rail ul { list-style: none; margin: 0; padding: 0; }
  .rail button.item {
    display: flex; align-items: center; gap: 0.6rem;
    width: 100%;
    padding: 0.5rem 0.6rem;
    border: 0; border-radius: var(--r-sm);
    background: none;
    font: inherit; font-size: 0.9rem; color: var(--ink); text-align: left;
    cursor: pointer;
  }
  .rail button.item:hover { background: rgb(255 255 255 / 0.55); }
  .rail button.item[aria-current="page"] {
    background: var(--glass-strong);
    font-weight: 600;
    color: var(--blue-ink);
    box-shadow: inset 3px 0 0 var(--blue);
  }
  .rail .group > button.item { font-weight: 500; }
  .rail .group ul { margin: 0.1rem 0 0.4rem 0.9rem; border-left: 1px solid var(--line); padding-left: 0.35rem; }
  .rail .group ul button.item { font-size: 0.86rem; padding: 0.38rem 0.6rem; }
  .rail .chev { margin-left: auto; transition: transform 0.2s; }
  .rail .group.open .chev { transform: rotate(90deg); }
  .rail .divider { height: 1px; background: var(--line); margin: 0.6rem 0.4rem; }
  .mark {
    flex: none;
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid rgb(19 41 75 / 0.35);
    display: grid; place-items: center;
  }
  .mark.done { background: var(--blue); border-color: var(--blue); }
  .mark.done::after {
    content: ""; width: 7px; height: 4px;
    border: 2px solid #fff; border-top: 0; border-right: 0;
    transform: translateY(-1px) rotate(-45deg);
  }
  .ico { width: 18px; height: 18px; flex: none; }

  /* Main sheet */
  .sheet {
    border-radius: var(--r-lg);
    padding: 1.75rem 2.25rem 1.5rem;
    min-height: 70vh;
    display: flex;
    flex-direction: column;
  }
  .context {
    display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem;
    font-size: 0.82rem; color: var(--soft);
    margin-bottom: 1.1rem;
  }
  .context b { color: var(--ink); font-weight: 600; }
  .sheet h1 {
    margin: 0 0 0.35rem;
    font-size: 1.75rem;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .lede { margin: 0 0 1.5rem; max-width: 62ch; color: var(--soft); }
  .sheet h2 { font-size: 1.1rem; font-weight: 600; margin: 1.6rem 0 0.6rem; }
  .sheet h3 { font-size: 0.95rem; font-weight: 600; margin: 1.2rem 0 0.4rem; }
  .sheet p, .sheet li { max-width: 70ch; }
  .sheet ul.plain { padding-left: 1.2rem; margin: 0.3rem 0 1rem; }
  .sheet ul.plain li { margin: 0.2rem 0; }
  .small { font-size: 0.85rem; color: var(--soft); }
  .body { flex: 1; }

  /* Wizard footer */
  .steps {
    display: flex; justify-content: space-between; align-items: center; gap: 1rem;
    margin-top: 2rem; padding-top: 1.1rem;
    border-top: 1px solid var(--line);
  }
  .steps .where { font-size: 0.82rem; color: var(--soft); }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem;
    min-height: 42px;
    padding: 0.55rem 1.1rem;
    border-radius: 999px;
    border: 1px solid rgb(19 41 75 / 0.22);
    background: var(--glass-strong);
    font: inherit; font-weight: 500; color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: #fff; }
  .btn.primary { background: var(--blue-ink); border-color: var(--blue-ink); color: #fff; }
  .btn.primary:hover { background: #0f3a54; }
  .btn.small-btn { min-height: 34px; padding: 0.35rem 0.85rem; font-size: 0.88rem; }
  /* Disabled: solid grey, not faded, so the label still reads at 7:1 */
  .btn:disabled, .btn.primary:disabled { background: #e4e8ed; border-color: #e4e8ed; color: var(--soft); cursor: not-allowed; }
  .btn.quiet { border-color: transparent; background: none; color: var(--link); padding-inline: 0.4rem; }
  .btn.danger { color: var(--red); }
  .btn svg { width: 18px; height: 18px; }

  /* Fields */
  label { font-size: 0.88rem; }
  .field { display: grid; gap: 0.3rem; margin: 0 0 0.9rem; max-width: 34rem; }
  .field > span { font-size: 0.86rem; font-weight: 500; }
  .req { color: var(--soft); font-weight: 400; }
  input[type=text], input[type=email], input[type=tel], select, textarea, .input {
    font: inherit; font-size: 0.92rem; color: var(--ink);
    min-height: 40px;
    padding: 0.45rem 0.7rem;
    border: 1px solid rgb(19 41 75 / 0.2);
    border-radius: var(--r-sm);
    background: var(--field);
    width: 100%;
  }
  textarea { min-height: 96px; resize: vertical; }
  ::placeholder { color: var(--soft); opacity: 1; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 1.25rem; max-width: 46rem; }
  .check { display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer; }
  input[type=checkbox], input[type=radio] { width: 18px; height: 18px; accent-color: var(--blue); margin: 0; flex: none; }
  .yesno { display: inline-flex; gap: 0.25rem; padding: 3px; border-radius: 999px; background: rgb(19 41 75 / 0.07); }
  .yesno label { position: relative; }
  .yesno input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; cursor: pointer; margin: 0; }
  .yesno span { display: block; padding: 0.3rem 0.95rem; border-radius: 999px; font-size: 0.86rem; font-weight: 500; }
  .yesno input:checked + span { background: #fff; color: var(--blue-ink); box-shadow: 0 1px 3px rgb(19 41 75 / 0.18); }
  .yesno input:focus-visible + span { outline: 3px solid var(--blue); outline-offset: 1px; }
  /* Answers fixed in the demo: selection stays readable, the control doesn't respond */
  .yesno.locked { cursor: not-allowed; }
  .yesno.locked input { pointer-events: none; }
  .yesno.locked input:not(:checked) + span { color: var(--soft); }

  /* Panels inside the sheet: one step more solid than the sheet */
  .panel {
    border-radius: var(--r-md);
    background: rgb(255 255 255 / 0.55);
    border: 1px solid rgb(255 255 255 / 0.8);
    padding: 1rem 1.2rem;
    margin: 0 0 1rem;
  }

  /* Info tips */
  .tip { position: relative; display: inline-flex; vertical-align: middle; }
  .tip > button {
    width: 18px; height: 18px; padding: 0; border: 0; border-radius: 50%;
    background: var(--navy); color: #fff;
    font: 600 11px/18px "Open Sans", Arial, sans-serif; cursor: help;
  }
  /* Tip text stays in the markup for screen readers; #tipbox shows it on screen.
     #tipbox sits outside the glass panels so no table or panel can clip it. */
  .tip > span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #tipbox {
    position: fixed; z-index: 50; top: 0; left: 0;
    width: max-content; max-width: 16rem;
    padding: 0.5rem 0.7rem; border-radius: var(--r-sm);
    background: var(--navy); color: #fff;
    font-size: 0.8rem; font-weight: 400; line-height: 1.4; text-align: left;
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  #tipbox.on { opacity: 1; }

  /* Main menu plans */
  .plans h2 { font-size: 0.95rem; font-weight: 600; color: var(--soft); margin: 1.4rem 0 0.6rem; }
  .plan {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 0.75rem 1.5rem;
    align-items: center;
    padding: 1.1rem 1.3rem;
    border-radius: var(--r-md);
    background: rgb(255 255 255 / 0.62);
    border: 1px solid rgb(255 255 255 / 0.85);
    margin-bottom: 0.8rem;
  }
  .plan h3 { margin: 0; font-size: 1.25rem; font-weight: 600; }
  .plan h3 a { color: var(--ink); text-decoration: none; }
  .plan h3 a:hover { color: var(--blue-ink); text-decoration: underline; }
  .plan .meta { font-size: 0.84rem; color: var(--soft); display: flex; flex-wrap: wrap; gap: 0.2rem 1.1rem; margin-top: 0.25rem; }
  .plan .actions { display: flex; align-items: center; gap: 0.5rem; }
  .plan .actions select { width: auto; min-width: 11rem; }
  .status { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.84rem; font-weight: 600; }
  .status i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .status.red { color: var(--red); } .status.red i { background: var(--red); }
  .status.amber { color: var(--amber); } .status.amber i { background: #e0a100; }
  .status.none { color: var(--soft); } .status.none i { border: 1.5px solid var(--soft); }
  .late { color: var(--red); font-weight: 600; }

  /* Schedule selection */
  .sched { display: grid; gap: 0.8rem; max-width: 40rem; }
  .sched button {
    display: flex; align-items: center; gap: 1.1rem;
    padding: 0.9rem 1.1rem;
    border-radius: var(--r-md);
    border: 1px solid rgb(255 255 255 / 0.85);
    background: rgb(255 255 255 / 0.6);
    font: inherit; color: var(--ink); text-align: left; cursor: pointer;
  }
  .sched button:hover { background: rgb(255 255 255 / 0.85); }
  .sched b { display: block; font-size: 1.02rem; font-weight: 600; }
  .sched small { color: var(--soft); font-size: 0.84rem; }
  .ring { width: 56px; height: 56px; flex: none; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: rgb(19 41 75 / 0.12); }
  .ring .fill { stroke: var(--blue); stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 0.78rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .submit-wrap { margin-top: 1.6rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }

  /* Tables */
  .table-wrap { overflow-x: auto; border-radius: var(--r-md); border: 1px solid rgb(255 255 255 / 0.85); background: rgb(255 255 255 / 0.55); }
  table { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
  th, td { padding: 0.6rem 0.7rem; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; font-size: 0.8rem; color: var(--soft); vertical-align: bottom; }
  tr:last-child td { border-bottom: 0; }
  td.c, th.c { text-align: center; }
  .rooms th, .rooms td { padding: 0.55rem 0.35rem; }
  .rooms th { font-size: 0.74rem; line-height: 1.3; }
  .rooms th:first-child, .rooms td:first-child { padding-left: 0.8rem; }
  .rooms th div { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; text-align: center; }
  /* Room uses switched off in the demo: greyed, with a note on hover or focus */
  .demo-off { position: relative; display: inline-flex; align-items: center; gap: .35rem; cursor: not-allowed; }
  .demo-off > * { pointer-events: none; }
  .demo-off > input { opacity: .35; }
  .demo-off > select { color: var(--soft); opacity: 1; border-style: dashed; }
  .room-err { color: var(--red); font-size: .85rem; margin: -.4rem 0 .9rem; }
  .combo li.hint { padding: .45rem .6rem; font-size: .85rem; color: var(--soft); }
  .empty { padding: 1.4rem; text-align: center; color: var(--soft); }
  .icon-btn { border: 0; background: none; padding: 4px; border-radius: 6px; cursor: pointer; color: var(--soft); display: inline-grid; }
  .icon-btn:hover { color: var(--red); background: rgb(179 38 30 / 0.08); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Upload */
  .drop {
    display: grid; place-items: center; gap: 0.6rem;
    padding: 1.6rem;
    border: 1.5px dashed rgb(19 41 75 / 0.28);
    border-radius: var(--r-md);
    background: rgb(255 255 255 / 0.45);
    text-align: center; color: var(--soft);
  }
  .files { list-style: none; padding: 0; margin: 0.6rem 0 0; }
  .files li { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0; border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  .needs { display: flex; gap: 0.6rem; align-items: baseline; padding: 0.7rem 0.9rem; border-radius: var(--r-sm); background: rgb(179 38 30 / 0.07); color: var(--red); font-size: 0.88rem; margin-top: 0.8rem; }
  .ok { background: rgb(46 122 75 / 0.09); color: var(--green); }

  /* Notices */
  .alert { padding: 0.9rem 1.1rem; border-radius: var(--r-md); background: rgb(179 38 30 / 0.07); border: 1px solid rgb(179 38 30 / 0.18); margin: 0 0 1rem; max-width: 46rem; }
  .alert b { color: var(--red); }
  .aside { font-size: 0.85rem; color: var(--soft); border-top: 1px solid var(--line); padding-top: 0.9rem; margin-top: 1.4rem; max-width: 62ch; }
  .aside h3 { margin-top: 0; font-size: 0.85rem; color: var(--ink); }

  /* Questions */
  .q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: center; padding: 0.9rem 0; border-bottom: 1px solid var(--line); max-width: 52rem; }
  .q:last-child { border-bottom: 0; }
  .q p { margin: 0; }
  .q .small { margin-top: 0.2rem; display: block; }
  .reveal { animation: reveal 0.25s ease; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-4px); } }

  /* Disclosure */
  details.panel summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 0.5rem; }
  details.panel summary::-webkit-details-marker { display: none; }
  details.panel[open] { padding-bottom: 1.3rem; }
  details.panel summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); transition: transform 0.2s; }
  details.panel[open] summary::after { transform: rotate(-135deg); }
  /* General procedures: one topic per column, never split across columns */
  .gp { display: grid; grid-template-columns: repeat(auto-fit, minmax(18rem, 1fr)); gap: 1rem 2.25rem; font-size: 0.86rem; margin-top: 0.9rem; }
  .gp h3 { margin: 0 0 0.4rem; font-size: 0.95rem; }
  .gp ul, .gp ol { margin: 0; padding-left: 1.1rem; }
  .gp li { margin: 0.3rem 0; }
  .gp li > ul, .gp li > ol { margin: 0.2rem 0 0.5rem; color: var(--soft); }
  .gp li > ul li, .gp li > ol li { margin: 0.12rem 0; }
  .gp li > ul { list-style: circle; }
  .gp ul.race { list-style: none; padding-left: 0.4rem; }
  .gp ul.race b { color: var(--blue-ink); }

  /* Search suggestions */
  .combo { position: relative; flex: 1; min-width: 14rem; max-width: 26rem; }
  .combo ul { position: absolute; z-index: 10; top: calc(100% + 4px); left: 0; right: 0; list-style: none; margin: 0; padding: 0.3rem; border-radius: var(--r-sm); background: #fff; box-shadow: 0 10px 30px -10px rgb(19 41 75 / 0.4); }
  .combo li button { width: 100%; text-align: left; border: 0; background: none; padding: 0.45rem 0.6rem; border-radius: 6px; font: inherit; font-size: 0.9rem; cursor: pointer; }
  .combo li button:hover, .combo li button:focus { background: rgb(32 113 161 / 0.1); }

  /* Dialog */
  dialog {
    border: 1px solid var(--glass-edge);
    border-radius: var(--r-lg);
    padding: 1.6rem 1.8rem;
    max-width: 26rem;
    color: var(--ink);
    background: rgb(255 255 255 / 0.92);
    -webkit-backdrop-filter: var(--blur);
    backdrop-filter: var(--blur);
    box-shadow: 0 30px 60px -20px rgb(19 41 75 / 0.5);
  }
  dialog::backdrop { background: rgb(19 41 75 / 0.25); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  dialog h2 { margin: 0 0 0.4rem; font-size: 1.2rem; font-weight: 600; }
  dialog p { margin: 0 0 1.2rem; color: var(--soft); }
  dialog .row { justify-content: flex-end; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; padding: 0.75rem; }
    .rail { position: static; max-height: none; }
    .sheet { padding: 1.25rem 1rem; }
    .plan { grid-template-columns: 1fr; }
    .grid2 { grid-template-columns: 1fr; }
    .top .note { display: none; }
    .q { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media print {
    body::before, .top, .rail, .steps { display: none; }
    .shell { display: block; }
    .glass { background: #fff; box-shadow: none; border: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Lab Safety Plan</b><span>Environment, Health and Safety</span></div>
  <div class="user"><span class="avatar" aria-hidden="true">AM</span><span>Dr. Alex Martinez</span></div>
</header>

<div class="shell">
  <nav class="rail glass" id="rail" aria-label="Plan navigation"></nav>
  <main class="sheet glass" id="sheet" tabindex="-1"></main>
</div>

<dialog id="dlg"></dialog>
<div id="tipbox" aria-hidden="true"></div>

<script src="rooms.js"></script>
<script>
const $ =(s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];

const pct = k => Math.round(100 * SECTION[k].pages.filter(p => S.done.has(p[0])).length / SECTION[k].pages.length);

/* ---------- Rail ---------- */
function renderRail() {
  const inPlan = !["menu", "pi", "help", "logout", "building"].includes(S.route);
  const item = (id, label, icon = "") =>
    `<li><button class="item" data-go="${id}" ${S.route === id ? 'aria-current="page"' : ""}>${icon}${label}</button></li>`;
  let html = `<ul>${item("menu", "Main menu", ICON.home)}${item("pi", "Select PI", ICON.user)}${item("help", "Help", ICON.help)}${item("logout", "Log out", ICON.out)}</ul>`;
  if (inPlan) {
    const sec = k => {
      const open = S.openSection === k;
      const pages = SECTION[k].pages.map(([id, label]) =>
        `<li><button class="item" data-go="${id}" ${S.route === id ? 'aria-current="page"' : ""}><span class="mark ${S.done.has(id) ? "done" : ""}" aria-hidden="true"></span>${label}<span class="sr">${S.done.has(id) ? ", complete" : ""}</span></button></li>`).join("");
      return `<li class="group ${open ? "open" : ""}"><button class="item" data-toggle="${k}" aria-expanded="${open}"><span>${SECTION[k].sched}<br><span class="small">${SECTION[k].name}</span></span>${ICON.chev}</button>${open ? `<ul>${pages}</ul>` : ""}</li>`;
    };
    html += `<div class="divider"></div><h2>${esc(S.building)}</h2><ul>${item("rooms", "Room use")}${item("schedule", "Schedule selection")}${sec("A")}${sec("B")}</ul>`;
  }
  $("#rail").innerHTML = html;
}

const context = () => `<div class="context"><span>PI: <b>Dr. Alex Martinez</b></span>${["menu", "pi", "help", "building"].includes(S.route) ? "" : `<span>Building: <b>${esc(S.building)}</b></span>`}<span>Company: <b>UNC-Chapel Hill</b></span></div>`;
function steps(back, next, opts = {}) {
  const k = sectionOf(S.route);
  let where = "";
  if (k) {
    const i = SECTION[k].pages.findIndex(p => p[0] === S.route);
    where = `${SECTION[k].sched}, page ${i + 1} of ${SECTION[k].pages.length}`;
  }
  return `<div class="steps">
    ${back ? `<button class="btn" data-back="${back}">${ICON.back}Back</button>` : "<span></span>"}
    <span class="where">${where}</span>
    ${next ? `<button class="btn primary" data-next="${next}" ${opts.disabled ? "disabled" : ""}>${opts.label || "Continue"}${ICON.next}</button>` : "<span></span>"}
  </div>`;
}
const nextIn = id => {
  const k = sectionOf(id), pages = SECTION[k].pages, i = pages.findIndex(p => p[0] === id);
  return i < pages.length - 1 ? pages[i + 1][0] : "schedule";
};
const prevIn = id => {
  const k = sectionOf(id), pages = SECTION[k].pages, i = pages.findIndex(p => p[0] === id);
  return i > 0 ? pages[i - 1][0] : "schedule";
};

};

/* ---------- Tooltips: place above the icon, or below if there's no room ---------- */
function showTip(e) {
  const box = $("#tipbox");
  const t = e.target.closest?.(".tip, [data-tip]");
  if (!t) { box.classList.remove("on"); return; }
  box.textContent = t.dataset.tip || t.querySelector("span").textContent;
  const b = (t.querySelector("button") || t).getBoundingClientRect();
  const w = box.offsetWidth, h = box.offsetHeight;
  box.style.left = Math.min(Math.max(8, b.left + b.width / 2 - w / 2), window.innerWidth - w - 8) + "px";
  box.style.top = (b.top - h - 8 >= 8 ? b.top - h - 8 : b.bottom + 8) + "px";
  box.classList.add("on");
}
document.addEventListener("mouseover", showTip);
document.addEventListener("focusin", showTip);
document.addEventListener("focusout", () => $("#tipbox").classList.remove("on"));
window.addEventListener("scroll", () => $("#tipbox").classList.remove("on"), { passive: true });

/* ---------- Render and events ---------- */
function go(route) {
  S.route = route;
  S.roomErr = "";
  const k = sectionOf(route);
  if (k) S.openSection = k;
  renderRail();
  $("#sheet").innerHTML = P[route]();
  bind();
  window.scrollTo({ top: 0 });
  $("#sheet").focus({ preventScroll: true });
}
const rerender = () => { const y = window.scrollY; renderRail(); $("#sheet").innerHTML = P[S.route](); bind(); window.scrollTo({ top: y }); };

// A link in the text (data-go) closes the dialog and opens that screen; onLink runs first.
function dialog(title, text, buttons, onLink) {
  const d = $("#dlg");
  d.innerHTML = `<h2>${title}</h2><p>${text}</p><div class="row">${buttons.map((b, i) => `<button class="btn ${b.primary ? "primary" : ""} ${b.danger ? "danger" : ""}" data-i="${i}">${b.label}</button>`).join("")}</div>`;
  $$("button", d).forEach(btn => btn.onclick = () => { d.close(); buttons[btn.dataset.i].do?.(); });
  $$("a[data-go]", d).forEach(a => a.onclick = e => { e.preventDefault(); d.close(); onLink?.(); go(a.dataset.go); });
  d.showModal();
}

function bind() {
  const sheet = $("#sheet");
  $$("[data-go]").forEach(el => el.onclick = e => { e.preventDefault(); if (el.dataset.open) S.openSection = el.dataset.open; go(el.dataset.go); });
  $$("[data-toggle]").forEach(el => el.onclick = () => { S.openSection = S.openSection === el.dataset.toggle ? null : el.dataset.toggle; renderRail(); bind(); });
  $$("[data-open-plan]", sheet).forEach(el => el.onclick = e => { e.preventDefault(); go(el.dataset.openPlan === "one" && S.plan === "pending" ? "schedule" : "rooms"); });
  $$("[data-back]", sheet).forEach(el => el.onclick = () => {
    if (el.dataset.back === "menu-confirm") return dialog("Leave without starting a plan?", "You haven't started a plan for this building yet.", [{ label: "Stay" }, { label: "Leave", primary: true, do: () => go("menu") }]);
    go(el.dataset.back);
  });
  $$("[data-next]", sheet).forEach(el => el.onclick = () => {
    if (sectionOf(S.route)) S.done.add(S.route);
    if (S.route === "building") S.building = $("#bld").value;
    go(el.dataset.next);
  });

  // Main menu
  $$("[data-delete]", sheet).forEach(el => el.onclick = () => {
    const name = el.dataset.delete === "two" ? "Building Two" : "Building One";
    dialog(`Delete the plan for ${name}?`, "The plan and its attachments are removed. This can't be undone.", [{ label: "Keep plan" }, { label: "Delete plan", danger: true, do: () => { S.plans[el.dataset.delete] = false; rerender(); } }]);
  });

  // Rooms
  const add = $("#add-room"), rq = $("#room-q");
  if (rq) {
    const list = $("#room-list");
    const valid = (window.ROOMS || {})[S.building] || [];
    const addRoom = v => {
      v = v.trim().toUpperCase();
      if (!v) S.roomErr = "Type a room or lab bay number to add it.";
      else if (!valid.includes(v)) S.roomErr = `Room ${v} isn't in ${S.building}. Check the number, or pick one from the list.`;
      else if (S.rooms.some(r => r.num === v)) S.roomErr = `Room ${v} is already in this plan.`;
      else { S.roomErr = ""; S.rooms.push({ num: v, haz: {} }); }
      rerender(); $("#room-q").focus();
    };
    const show = () => {
      const t = rq.value.trim().toUpperCase();
      const hits = t ? valid.filter(r => r.startsWith(t) && !S.rooms.some(x => x.num === r)).slice(0, 8) : [];
      list.innerHTML = hits.map(r => `<li><button type="button">${r}</button></li>`).join("")
        || (t ? `<li class="hint">No room ${esc(t)} in ${esc(S.building)}.</li>` : "");
      list.hidden = !t; rq.setAttribute("aria-expanded", String(!!t));
      $$("button", list).forEach(b => {
        b.onclick = () => addRoom(b.textContent);
        b.onkeydown = e => {
          if (e.key === "ArrowDown") { e.preventDefault(); b.parentElement.nextElementSibling?.querySelector("button")?.focus(); }
          if (e.key === "ArrowUp") { e.preventDefault(); (b.parentElement.previousElementSibling?.querySelector("button") || rq).focus(); }
          if (e.key === "Escape") { list.hidden = true; rq.focus(); }
        };
      });
    };
    rq.oninput = show;
    rq.onkeydown = e => {
      if (e.key === "ArrowDown") { const b = $("button", list); if (b) { e.preventDefault(); b.focus(); } }
      if (e.key === "Enter") { e.preventDefault(); const hits = $$("button", list); addRoom(hits.length === 1 ? hits[0].textContent : rq.value); }
      if (e.key === "Escape") list.hidden = true;
    };
    add.onclick = () => addRoom(rq.value);
  }
  $$("[data-haz]", sheet).forEach(el => el.onchange = () => { const [i, k] = el.dataset.haz.split(":"); S.rooms[i].haz[k] = el.checked; if (k === "bsl") rerender(); });
  $$("[data-del-room]", sheet).forEach(el => el.onclick = () => { S.rooms.splice(+el.dataset.delRoom, 1); rerender(); });

  // Schedule
  const sub = $("#submit");
  if (sub) sub.onclick = () => dialog("Plan submitted", `EHS will review your plan for Building One and may contact you for additional details. You'll get an email when it's approved. For questions, refer to the <a href="#" data-go="help">Help page</a>.`, [{ label: "Back to main menu", primary: true, do: () => { S.plan = "pending"; go("menu"); } }], () => { S.plan = "pending"; });

  // Floor plans, SOPs
  const fp = $("#fp-add");
  if (fp) fp.onclick = () => { S.floorplans[$("#fp-room").value] = true; rerender(); };
  const sop = $("#sop-add");
  if (sop) sop.onclick = () => { S.sops.push(S.sops.length ? `Standard Operating Procedure ${S.sops.length + 1}.pdf` : "Standard Operating Procedure.pdf"); rerender(); };

  const em = $("#em-add");
  if (em) em.onclick = () => { S.emFiles.push(S.emFiles.length ? `Emergency Procedures ${S.emFiles.length + 1}.pdf` : "Emergency Procedures.pdf"); rerender(); };

  // Haz chem
  $$("input[name^=hq-]", sheet).forEach(el => el.onchange = () => { S.hazchem[el.name.slice(3)] = el.value; });

  // Rules: "doesn't apply" disables its box
  $$("[data-na]", sheet).forEach(el => el.onchange = () => { const t = $("#" + el.dataset.na); t.disabled = el.checked; if (el.checked) t.value = ""; });

  // Waste
  $$("input[name=waste]", sheet).forEach(el => el.onchange = () => { S.waste = el.value; rerender(); });
  const ap = $("#add-process");
  if (ap) ap.onclick = () => { S.processes++; rerender(); };

  // Mercury
  const hn = $("#hg-new"); if (hn) hn.onclick = () => { S.mercuryForm = true; rerender(); $("#hg-item").focus(); };
  const hc = $("#hg-cancel"); if (hc) hc.onclick = () => { S.mercuryForm = false; rerender(); };
  const hs = $("#hg-save"); if (hs) hs.onclick = () => {
    const item = $("#hg-item").value.trim();
    if (!item) { $("#hg-item").focus(); $("#hg-item").placeholder = "Name the item to register it"; return; }
    S.mercury.push({ item, room: $("#hg-room").value, loc: $("#hg-loc").value.trim() }); S.mercuryForm = false; rerender();
  };

  // DEA
  $$("[data-dea]", sheet).forEach(el => el.onchange = () => { S.dea.checked[el.dataset.dea] = el.checked; rerender(); });
  $$("[data-dea-add]", sheet).forEach(el => el.onclick = () => {
    const n = el.dataset.deaAdd, v = $("#dea-sel-" + n).value;
    if (!v) return; (S.dea.added[n] ||= []); if (!S.dea.added[n].includes(v)) S.dea.added[n].push(v); rerender();
  });
  $$("[data-del-dea]", sheet).forEach(el => el.onclick = () => {
    const [n, i] = el.dataset.delDea.split(":"); S.dea.added[n].splice(+i, 1); rerender();
  });

  // Machinery search
  const q = $("#mach-q");
  if (q) {
    const list = $("#mach-list");
    const show = () => {
      const t = q.value.trim().toLowerCase();
      const hits = t ? MACHINES.filter(m => m.toLowerCase().includes(t) && !S.machines.includes(m)) : [];
      list.innerHTML = hits.map(m => `<li><button type="button">${m}</button></li>`).join("") || (t ? `<li class="small" style="padding:.45rem .6rem">No match. Check the spelling, or ask Chemical Safety to add it.</li>` : "");
      list.hidden = !t; q.setAttribute("aria-expanded", String(!!t));
      $$("button", list).forEach(b => b.onclick = () => { S.machines.push(b.textContent); rerender(); $("#mach-q").focus(); });
    };
    q.oninput = show;
    q.onkeydown = e => { if (e.key === "ArrowDown") { const b = $("button", list); if (b) { e.preventDefault(); b.focus(); } } };
  }
  $$("[data-del-mach]", sheet).forEach(el => el.onclick = () => { S.machines.splice(+el.dataset.delMach, 1); rerender(); });
  $$("[data-mach-sop]", sheet).forEach(el => el.onclick = () => { S.machineSops ||= {}; S.machineSops[el.dataset.machSop] = `${S.machines[el.dataset.machSop]} SOP.pdf`; rerender(); });

  // PPE
  $$("[data-ppe]", sheet).forEach(el => el.onchange = () => { S.ppe[el.dataset.ppe] = el.checked; rerender(); });
  $$("[data-ppe-add]", sheet).forEach(el => el.onclick = () => {
    const i = +el.dataset.ppeAdd, inp = $("#ppe-in-" + i), what = inp.value.trim();
    if (!what) { inp.focus(); return; }
    S.ppeRows.push({ h: i, what }); rerender();
  });
  $$("[data-del-ppe]", sheet).forEach(el => el.onclick = () => { S.ppeRows.splice(+el.dataset.delPpe, 1); rerender(); });
}

// The plan in process starts where the Figma file shows it: room 123 added, the first page of Schedule B done.
S.rooms.push({ num: "123", haz: { chem: true } });
S.done.add("hazchem");
// Hazard answers are fixed in the demo: yes to everything except photo development.
S.hazchem = { hg: "y", dea: "y", mach: "y", coi: "y", dark: "n" };
// A screen named in the URL opens directly, ex: index.html#waste
const start = location.hash.slice(1);
if (start === "waste-yes") { S.waste = "y"; }
// For the case-study screenshot only: every room use enabled. The working demo (#rooms) keeps them off.
if (start === "rooms-all") { S.allUses = true; }
const screen = start.replace(/-(yes|all)$/, "");
go(P[screen] ? screen : "menu");
</script>
</body>
</html>
