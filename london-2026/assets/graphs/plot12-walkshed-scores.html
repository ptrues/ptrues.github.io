<title>Walkshed scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap">

<style>
/* FIG 12. The tokens are walkshed-shortlist's, unchanged, so the two pages
   sit in one system. Everything else here is subtraction: no title, no
   legend, no tooltip, no prose, no reset. The story page does the
   explaining; this figure only shows. */
/* AUTUMN, not the cool grey-green this started as. The plate is embedded in
   design/index.html by iframe, so its ground sits directly against the
   article's --paper; the old #FAFAF7/#181C1B system read as a cool panel
   dropped onto a warm page, and the teal --scenic had no relative anywhere in
   the style kit. Every value below is design/style-guide.html's, and the two
   move together from here.

   Two tokens are DERIVED rather than lifted, because this plate uses a step
   the guide does not have: --ink-2 and --ink-3 are two levels of secondary
   text where the guide has one (--ink-soft). --ink-3 takes --ink-soft
   unchanged and --ink-2 is one step nearer the ink; --rule-2 is likewise one
   step stronger than --line. --surface resolves to --paper, which is what the
   article's own .mapctl does: the 1px --rule-2 border is what lifts the
   control, not a brighter fill. */
:root{
  --ground:#FAF8F3; --surface:#FAF8F3; --surface-2:#F1ECE1;
  --ink:#201913; --ink-2:#544A3E; --ink-3:#6B5F52;
  --rule:#E4DCCF; --rule-2:#CFC3AF;
  --scenic:#4C6B3F; --heritage:#B5722A;
  --region:rgba(32,25,19,.055);
  --dot:#B3A695; --dot-sel:#201913;
  --focus:#B5722A;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#17120D; --surface:#201A13; --surface-2:#201A13;
    --ink:#EEE7DA; --ink-2:#C6BAA9; --ink-3:#A99B88;
    --rule:#33291E; --rule-2:#4A3D2E;
    --scenic:#8FB06A; --heritage:#E0A64A;
    --region:rgba(238,231,218,.06);
    --dot:#6B5F52; --dot-sel:#EEE7DA;
    --focus:#E0A64A;
  }
}
:root[data-theme="dark"]{
  --ground:#17120D; --surface:#201A13; --surface-2:#201A13;
  --ink:#EEE7DA; --ink-2:#C6BAA9; --ink-3:#A99B88;
  --rule:#33291E; --rule-2:#4A3D2E;
  --scenic:#8FB06A; --heritage:#E0A64A;
  --region:rgba(238,231,218,.06);
  --dot:#6B5F52; --dot-sel:#EEE7DA;
  --focus:#E0A64A;
}

*{box-sizing:border-box}
/* height + overflow:hidden, not min-height. Giving the panel min-height:100%
   made it AT LEAST the viewport, so anything that overran -- svg.scatter is
   overflow:visible, and a label near the edge paints past its box -- grew the
   document and produced a scrollbar inside the figure. A plate in an iframe
   must never scroll: the parent already sized the box, and a scrollbar there
   competes with the article's own scroll. Fixed height, clipped, and the plot
   box flexes to whatever is left. */
html,body{margin:0; height:100%; overflow:hidden;
  background:var(--ground); color:var(--ink)}
body{
  font-family:"Noto Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}

/* THE PANEL FILLS ITS VIEWPORT, which for the inline plate is the iframe box
   design/index.html sizes by aspect-ratio (5:4 on a wide page). It did not,
   and the plot carried a hard 560 px cap: at the article's 62 rem the iframe
   is about 992 x 794, the capped plot plus the slider came to roughly 614,
   and the remaining ~180 px sat empty under the slider. The cap is not the
   problem by itself -- an uncapped plot in a page-flow document would grow
   without limit -- so the fix is to give the document a height to fill and let
   the plot box take the slack, which is what .expanded and .full already did.
   measure() now reads that height instead of guessing it. */
/* TOP PADDING CLEARS THE EXPAND BUTTON. The button is absolutely positioned
   at top:6px and is 30px tall, so it occupied y 6-36 of the panel's padding
   box -- while the plot box started at 10px and drew underneath it. Any label
   the placer put in the top-right corner went behind the control; "Cutty
   Sark", one of the selected walksheds, is exactly that corner on a phone.
   36 + 6 of clearance = 42. Widening the plot's own top margin (G.MT) would
   have worked too, but this keeps the control in a band of its own rather
   than reserving figure space that the button only sometimes covers. */
.panel{position:relative; padding:42px 12px 14px;
  height:100%; display:flex; flex-direction:column}
.plotbox{position:relative; flex:1 1 auto; min-height:0}
svg.scatter{display:block; width:100%; height:100%; overflow:visible;
  touch-action:none}

/* The only chrome. No text on it -- the four-corner glyph every video player
   uses is the whole affordance, per the figure's brief. */
.btn-icon{
  position:absolute; top:6px; right:8px; z-index:3;
  width:30px; height:30px; padding:6px;
  display:flex; align-items:center; justify-content:center;
  background:var(--surface); color:var(--ink-3);
  border:1px solid var(--rule-2); border-radius:7px; cursor:pointer;
}
.btn-icon:hover{color:var(--ink); border-color:var(--ink-3)}
.btn-icon svg{width:100%; height:100%; display:block}
.btn-icon:focus-visible{outline:2px solid var(--focus); outline-offset:2px}

/* Expanded: the panel takes the viewport and the plot takes what is left. */
#scrim{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:40;
  opacity:0; pointer-events:none; transition:opacity .15s}
#scrim.on{opacity:1; pointer-events:auto}
.panel.expanded{
  position:fixed; inset:14px; z-index:50; margin:0;
  background:var(--ground); border-radius:10px;
  display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.3);
}
.panel.expanded .plotbox{flex:1 1 auto; min-height:0}
.panel.expanded svg.scatter{width:100%; height:100%}

/* The overlay copy is already full screen -- design/index.html gave it the
   viewport -- so it needs the filling behaviour of .expanded without the
   floating-card chrome. Without this the plot keeps the 560 px cap meant for
   an article column and leaves half the overlay empty. */
.panel.full{position:fixed; inset:0; display:flex; flex-direction:column;
  padding:42px 16px 16px}
.panel.full .plotbox{flex:1 1 auto; min-height:0}
.panel.full svg.scatter{width:100%; height:100%}

/* ---------- marks ---------- */
.region{fill:var(--region)}
.grid-line{stroke:var(--rule); stroke-width:1}
.axis-line{stroke:var(--rule-2); stroke-width:1}
/* TYPE SIZES. The viewBox is set to the plot's real pixel box (see measure()),
   so one user unit is one CSS pixel and these are true rendered sizes -- they
   do NOT scale up on a small screen, they just get proportionally more of it.
   The first pass set ticks and labels at 10px, which is below what is
   comfortable on a phone; the narrow-viewport block further down takes them up
   again where the figure has least room. */
.tick{font-family:"Source Code Pro",ui-monospace,monospace; font-size:12px;
  fill:var(--ink-3)}
.axis-title{font-family:"Source Code Pro",ui-monospace,monospace; font-size:13px;
  font-weight:500; letter-spacing:.12em; fill:var(--ink-3)}
/* Both axes here ARE this project's own measured scores, so both are coloured
   -- unlike FIG 10, where the x axis is Scenic-Or-Not's rating and stays
   neutral. The threshold line and its grip already carry these two colours
   (.thr-s / .thr-h below), so the axis title is naming the thing the reader
   is dragging rather than introducing a new code. */
.axis-title.s{fill:var(--scenic)}
.axis-title.h{fill:var(--heritage)}

.dot{fill:var(--dot)}
.dot.sel{fill:var(--dot-sel)}
.hit{fill:transparent; cursor:pointer}
.label{font-family:"Source Code Pro",ui-monospace,monospace; font-size:12px;
  fill:var(--ink); cursor:pointer}
.leader{stroke:var(--rule-2); stroke-width:1}
.dot.hot, .label.hot{fill:var(--scenic)}
.leader.hot{stroke:var(--scenic)}

/* The two thresholds. Each line is dragged by the handle riding it on the
   axis, and the pair sets selectivity and which score is favoured at once --
   there is no separate control for either, by design. */
.thr-s{stroke:var(--scenic); stroke-width:2; stroke-dasharray:5 4}
.thr-h{stroke:var(--heritage); stroke-width:2; stroke-dasharray:5 4}
.grip{cursor:grab}
.grip:active{cursor:grabbing}
.grip-hit{fill:transparent}
.grip-s .grip-body{fill:var(--scenic)}
.grip-h .grip-body{fill:var(--heritage)}
.grip-body{stroke:var(--ground); stroke-width:1.5}
.grip:focus-visible{outline:none}
.grip:focus-visible .grip-body{stroke:var(--focus); stroke-width:2.5}

/* ---------- the one slider ---------- */
/* Three control rows on one grid rather than three independent flex rows.
   The label column sizes itself to the longest label ("Proximity to park (m)")
   and the other two follow it, so every track starts and ends at the same x
   and the readouts form a column. Laid out as a grid of the CHILDREN --
   .park is display:contents -- so each row stays one readable unit in the
   markup while the three of them still align. */
.controls{
  display:grid; grid-template-columns:auto 1fr auto;
  align-items:center; gap:6px 12px;
  margin:2px 0 0 0; padding:0 4px;
}
.park{display:contents}
.park label{
  font-family:"Source Code Pro",ui-monospace,monospace; font-size:13px; color:var(--ink-3);
  white-space:nowrap;
}
.park output{
  font-family:"Source Code Pro",ui-monospace,monospace; font-size:13px; color:var(--ink);
  font-variant-numeric:tabular-nums; min-width:5.5ch; text-align:right;
}
input[type=range]{
  -webkit-appearance:none; appearance:none; background:transparent;
  flex:1 1 auto; min-width:0; height:22px; margin:0; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:5px; border-radius:3px; background:var(--rule-2)}
input[type=range]::-moz-range-track{
  height:5px; border-radius:3px; background:var(--rule-2)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:16px; height:16px;
  border-radius:50%; background:var(--ink); border:2px solid var(--ground);
  margin-top:-6px}
input[type=range]::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%; background:var(--ink);
  border:2px solid var(--ground)}
input:focus-visible{outline:2px solid var(--focus); outline-offset:3px;
  border-radius:4px}

/* A phone gives this figure about 340 px of width, and the plate is the whole
   screen's worth of attention rather than one item in a column. Take the type
   up again where there is least room for it -- the label placer already drops
   any name it cannot fit without collision, so fewer, legible names beat more
   unreadable ones. */
@media (max-width:480px){
  .tick{font-size:13px}
  .axis-title{font-size:14px}
  .label{font-size:13px}
  .park label, .park output{font-size:14px}
  .park{gap:9px}
}
</style>

<div id="scrim"></div>

<div class="panel">
  <button class="btn-icon" id="expand" type="button" aria-pressed="false"
          aria-label="Expand the plot to full screen"

  <div class="plotbox" id="plotbox">
    <svg class="scatter" id="plot" viewBox="0 0 640 540" role="img"

  </div>

  <div class="controls">
  <div class="park">
    <label for="parkm">Proximity to park (m)</label>
    <input type="range" id="parkm" min="0" max="3000" step="50" value="1000"
           aria-label="Proximity to park in metres">
    <output id="parkm-val" for="parkm">1000</output>
  </div>

  <!-- The two thresholds, as sliders. They are a SECOND way to reach the
       controls already on the plate, not a third control: each is bound to the
       same cutS / cutH the draggable axis grips move, and dragging a grip
       writes back here. Some readers will never discover that a mark on an
       axis can be dragged, and a labelled slider says "this is adjustable"
       without having to be found. Range is 50-100 because the collapsed plate
       starts its axes at the 50th percentile -- below that there is nothing to
       select. -->
  <div class="park">
    <label for="cut-s">Scenic</label>
    <input type="range" id="cut-s" min="50" max="100" step="1" value="75"
           aria-label="Scenic score threshold, percentile">
    <output id="cut-s-val" for="cut-s">75</output>
  </div>

  <div class="park">
    <label for="cut-h">Heritage</label>
    <input type="range" id="cut-h" min="50" max="100" step="1" value="85"
           aria-label="Heritage score threshold, percentile">
    <output id="cut-h-val" for="cut-h">85</output>
  </div>
  </div>
</div>

<script>
var DATA = JSON.parse(document.getElementById("payload").textContent);
var W = DATA.walksheds;
W.forEach(function(d, i){ d._i = i; });

var svg = document.getElementById("plot"), NS = "http://www.w3.org/2000/svg";
var plotbox = document.getElementById("plotbox");
var panel = document.querySelector(".panel");
var scrim = document.getElementById("scrim");
var expanded = false;

var elPark = document.getElementById("parkm");
var elParkVal = document.getElementById("parkm-val");
var PARK_MAX = +elPark.max;

/* Both thresholds open on the top 15%, and both are free to move
   independently from there. Favouring one score over the other is not a
   separate dial: it is what dragging one line further than the other DOES. */
var cutS = DATA.default_cut_scenic, cutH = DATA.default_cut_heritage;
elPark.value = DATA.default_park_m;

/* The same two thresholds, reachable from a slider as well as from the grip on
   the axis. Bound to cutS / cutH directly, so the two controls cannot drift
   apart: input here writes the cut and redraws, and render() writes back here
   after a grip drag. */
var elCutS = document.getElementById("cut-s");
var elCutH = document.getElementById("cut-h");
var elCutSVal = document.getElementById("cut-s-val");
var elCutHVal = document.getElementById("cut-h-val");

/* Geometry is measured, not fixed: the viewBox is the plot's real pixel box,
   so one user unit is one CSS pixel and marks keep their size at any panel
   size. Bottom margin leaves room for the axis title under the ticks. */
/* Margins are sized to the TYPE, so they moved when the type did: ticks went
   10 -> 12 px and the axis titles 11 -> 13 (and 13/14 under 480 px). The left
   gutter carries a right-aligned tick plus the rotated y title, the bottom one
   a tick row plus the x title. */
var G = {W:640, H:540, ML:62, MR:20, MT:18, MB:62};

function fillsScreen(){
  return expanded || panel.classList.contains("full");
}

function measure(){
  var w = plotbox.clientWidth;
  if (!(w > 0)) w = 640;
  /* The plot box now always has a real height -- .panel is a flex column
     filling the viewport and .plotbox takes the slack -- so measure it in both
     states rather than guessing in one of them. fillsScreen() still decides
     the DOMAIN below; it no longer decides the height, which is why the two
     used to disagree and leave a gap. The old formulae stay as the fallback
     for a first paint before layout has settled. */
  var h = plotbox.clientHeight;
  if (!(h > 0)) {
    h = fillsScreen() ? Math.round(w * 0.55)
                      : Math.round(Math.min(560, Math.max(320, w * 0.86)));
  }
  G.W = Math.round(w); G.H = Math.round(h);
  svg.setAttribute("viewBox", "0 0 " + G.W + " " + G.H);
}

/* THE DOMAIN DEPENDS ON HOW MUCH SCREEN THE FIGURE HAS.

   Collapsed, both axes start at the 50th percentile: in an article column
   nothing below it is under consideration, and plotting it only compresses
   the half that matters.

   Full screen on a wide display, the axes open out to the whole 0-100 range
   and every walkshed appears -- there is room for eleven ticks and for the
   189 of 264 that sit below the 50th percentile on one score or the other.

   Two ways the figure comes to be full screen, and it has to recognise both:
     - standalone, the reader pressed the expand button      -> `expanded`
     - embedded, design/index.html opened its overlay copy, whose src that
       page builds as `<map>?open=origin` (see open() there) -> the query

   The width guard keeps a phone at 50-100 even in the overlay, where eleven
   ticks would collide. */
var COLLAPSED_MIN = 0.5;
var FULL_MIN_W = 640;
var OVERLAY_COPY = /(^|[?&])(open=origin|full=1)/.test(location.search);
if (OVERLAY_COPY) panel.classList.add("full");

/* THEME. This document is an iframe, so it has its own documentElement and the
   story page's data-theme never reached it -- the plate followed the OS
   prefers-color-scheme alone and ignored the page's own light/dark toggle
   entirely. The tokens were always there for both; nothing was ever told to
   switch.

   Two ways in, because an iframe can be opened either way:
     ?theme=      for the overlay copy, which index.html builds fresh with a
                  query string already;
     postMessage  for the inline copy, which is never reloaded -- the parent
                  posts on every toggle and once on load.
   Cross-origin-safe by design: no parent DOM is touched from here, and file://
   pages cannot read each other's documents but can still post. */
function setTheme(t){
  if (t === "dark" || t === "light") {
    document.documentElement.setAttribute("data-theme", t);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}
var themeParam = /(^|[?&])theme=(dark|light)/.exec(location.search);
if (themeParam) setTheme(themeParam[2]);

addEventListener("message", function(e){
  var d = e.data;
  if (d && d.type === "wsk-theme") setTheme(d.theme);
});

function isFull(){ return fillsScreen() && G.W >= FULL_MIN_W; }
function domMin(){ return isFull() ? 0 : COLLAPSED_MIN; }

function PW(){ return G.W - G.ML - G.MR; }
function PH(){ return G.H - G.MT - G.MB; }
function nx(v){ var m = domMin(); return (v - m) / (1 - m); }
function sx(v){ return G.ML + nx(v) * PW(); }
function sy(v){ return G.MT + (1 - nx(v)) * PH(); }
function invx(px){ var m = domMin();
  return m + (px - G.ML) / PW() * (1 - m); }
function invy(py){ var m = domMin();
  return m + (G.MT + PH() - py) / PH() * (1 - m); }
/* Floored at the domain, so a threshold dragged low while full screen is
   lifted back onto the plate when the figure collapses to 50-100 rather than
   vanishing off its bottom-left corner. */
function clampCut(v){ return Math.min(0.98, Math.max(domMin(), v)); }

function ticks(){
  var out = [], m = domMin();
  for (var v = m; v <= 1.0001; v += 0.1) out.push(Math.round(v * 10) / 10);
  return out;
}

function el(n, a){
  var e = document.createElementNS(NS, n);
  for (var k in a) e.setAttribute(k, a[k]);
  return e;
}

/* Satellite, and nowhere on the figure does it say so. Finding it is the
   reward for poking at a dot -- the brief asks for it to be discoverable by
   exploration and by nothing else. */
function mapsUrl(d){
  return "https://www.google.com/maps/@?api=1&map_action=map&center="
    + d.lonlat[1] + "," + d.lonlat[0] + "&zoom=17&basemap=satellite";
}
function openMaps(d){ window.open(mapsUrl(d), "_blank", "noopener"); }

function state(){
  var pk = +elPark.value;
  return {cutS:cutS, cutH:cutH, parkM:pk};
}

/* A walkshed with no measured park travels as null and is treated as further
   than any limit the slider can set, so it only ever appears at the maximum,
   where the gate is off. */
function gated(d, st){
  if (st.parkM >= PARK_MAX) return true;
  return d.park_m !== null && d.park_m <= st.parkM;
}
function selected(st){
  return W.filter(function(d){
    return d.scenic >= st.cutS && d.heritage >= st.cutH && gated(d, st);
  });
}

/* ---------- labels ----------
   Same collision search the shortlist page uses: try candidate positions in
   three rings around the point, take the first that clashes with neither an
   already-placed label nor any selected point nor the plot edge. Anything
   with no free slot is left unlabelled rather than drawn over a neighbour --
   overlapping names is the one thing the brief rules out. */
var CHAR_W = 6.15, ASC = 8, DESC = 4, RING_FREE = 8;
var SLOTS = (function(){
  var out = [];
  [13, 28, 44].forEach(function(R){
    out.push([ R,  3.5, "start"]);
    out.push([-R,  3.5, "end"]);
    out.push([ 0, -R + 1, "middle"]);
    out.push([ 0,  R + 9, "middle"]);
    out.push([ R * 0.78, -R * 0.62, "start"]);
    out.push([-R * 0.78, -R * 0.62, "end"]);
    out.push([ R * 0.78,  R * 0.72, "start"]);
    out.push([-R * 0.78,  R * 0.72, "end"]);
  });
  return out;
})();

function hits(r, list){
  for (var i = 0; i < list.length; i++){
    var q = list[i];
    if (!(r.x1 < q.x0 || r.x0 > q.x1 || r.y1 < q.y0 || r.y0 > q.y1)) return true;
  }
  return false;
}

function placeLabels(sel, st){
  var blocked = sel.map(function(d){
    var x = sx(d.scenic), y = sy(d.heritage);
    return {x0:x-7, y0:y-7, x1:x+7, y1:y+7};
  });
  // The two dashed thresholds are obstacles too. A name laid across one reads
  // as a label FOR the line rather than for its walkshed, which is how
  // "Cutty Sark (for Maritime Greenwich)" ended up captioning the heritage
  // cut. A 6 px band each way is enough to push the search to another slot.
  var cx = sx(st.cutS), cy = sy(st.cutH);
  blocked.push({x0:cx - 6, y0:G.MT, x1:cx + 6, y1:G.MT + PH()});
  blocked.push({x0:G.ML, y0:cy - 6, x1:G.ML + PW(), y1:cy + 6});
  var out = [];
  sel.slice().sort(function(a, b){ return b.scenic - a.scenic; })
     .forEach(function(d){
    var px = sx(d.scenic), py = sy(d.heritage);
    var w = d.name.length * CHAR_W;
    for (var i = 0; i < SLOTS.length; i++){
      var o = SLOTS[i], tx = px + o[0], ty = py + o[1], an = o[2];
      var x0 = an === "start" ? tx : (an === "end" ? tx - w : tx - w/2);
      var r = {x0:x0, y0:ty - ASC, x1:x0 + w, y1:ty + DESC};
      if (r.x0 < G.ML - 6 || r.x1 > G.W - G.MR + 6) continue;
      if (r.y0 < G.MT - 6 || r.y1 > G.MT + PH() + 6) continue;
      if (hits(r, blocked)) continue;
      blocked.push(r);
      out.push({d:d, x:tx, y:ty, anchor:an, px:px, py:py, slot:i});
      return;
    }
  });
  return out;
}

var marks = {};
function mark(name){
  if (!marks[name]) marks[name] = {};
  return marks[name];
}
function highlight(name, on){
  var m = marks[name];
  if (!m) return;
  ["dot", "label", "leader"].forEach(function(k){
    if (m[k]) m[k].classList[on ? "add" : "remove"]("hot");
  });
}

/* ---------- draw ---------- */
function drawPlot(st){
  measure();
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  marks = {};

  var sel = selected(st);
  var selNames = {};
  sel.forEach(function(d){ selNames[d.name] = 1; });

  svg.appendChild(el("rect", {
    x:sx(st.cutS), y:sy(1),
    width:Math.max(0, sx(1) - sx(st.cutS)),
    height:Math.max(0, sy(st.cutH) - sy(1)),
    "class":"region"}));

  ticks().forEach(function(v){
    svg.appendChild(el("line", {x1:G.ML, x2:G.ML + PW(),
      y1:sy(v), y2:sy(v), "class":"grid-line"}));
    svg.appendChild(el("line", {x1:sx(v), x2:sx(v),
      y1:G.MT, y2:G.MT + PH(), "class":"grid-line"}));
    var ty = el("text", {x:G.ML - 10, y:sy(v) + 3.5,
      "text-anchor":"end", "class":"tick"});
    ty.textContent = Math.round(v * 100); svg.appendChild(ty);
    var tx = el("text", {x:sx(v), y:G.MT + PH() + 19,
      "text-anchor":"middle", "class":"tick"});
    tx.textContent = Math.round(v * 100); svg.appendChild(tx);
  });

  svg.appendChild(el("line", {x1:G.ML, x2:G.ML + PW(),
    y1:G.MT + PH(), y2:G.MT + PH(), "class":"axis-line"}));
  svg.appendChild(el("line", {x1:G.ML, x2:G.ML,
    y1:G.MT, y2:G.MT + PH(), "class":"axis-line"}));

  // The only words on the plate.
  var xt = el("text", {x:G.ML + PW() / 2, y:G.MT + PH() + 45,
    "text-anchor":"middle", "class":"axis-title s"});
  xt.textContent = "SCENIC"; svg.appendChild(xt);
  var yt = el("text", {x:0, y:0, "text-anchor":"middle", "class":"axis-title h",
    transform:"translate(" + (G.ML - 42) + "," + (G.MT + PH() / 2)
              + ") rotate(-90)"});
  yt.textContent = "HERITAGE"; svg.appendChild(yt);

  W.forEach(function(d){
    if (!gated(d, st)) return;
    // Off the bottom or the left of the domain. Both axes start at the 50th
    // percentile, so a walkshed under it has no position on this plate --
    // and the SVG is overflow:visible, so an unclipped dot would be drawn
    // outside the frame rather than disappear.
    if (d.scenic < domMin() || d.heritage < domMin()) return;
    var isSel = !!selNames[d.name];
    var c = el("circle", {cx:sx(d.scenic), cy:sy(d.heritage),
      r:isSel ? 4.2 : 3, "class":"dot" + (isSel ? " sel" : "")});
    svg.appendChild(c);
    mark(d.name).dot = c;

    // A generous invisible target over each dot: 3 px of ink is not a tap.
    var hit = el("circle", {cx:sx(d.scenic), cy:sy(d.heritage), r:13,
      "class":"hit"});
    hit.addEventListener("click", function(){ openMaps(d); });
    hit.addEventListener("pointerenter", function(){ highlight(d.name, true); });
    hit.addEventListener("pointerleave", function(){ highlight(d.name, false); });
    svg.appendChild(hit);
  });

  placeLabels(sel, st).forEach(function(p){
    if (p.slot >= RING_FREE){
      var ld = el("line", {x1:p.px, y1:p.py, x2:p.x, y2:p.y, "class":"leader"});
      svg.appendChild(ld);
      mark(p.d.name).leader = ld;
    }
    var t = el("text", {x:p.x, y:p.y, "text-anchor":p.anchor, "class":"label"});
    t.textContent = p.d.name;
    t.addEventListener("click", function(){ openMaps(p.d); });
    t.addEventListener("pointerenter", function(){ highlight(p.d.name, true); });
    t.addEventListener("pointerleave", function(){ highlight(p.d.name, false); });
    svg.appendChild(t);
    mark(p.d.name).label = t;
  });

  drawGrips(st);
}

function drawGrips(st){
  var x = sx(st.cutS), y = sy(st.cutH);
  var bottom = G.MT + PH();

  svg.appendChild(el("line", {x1:x, x2:x, y1:G.MT, y2:bottom, "class":"thr-s"}));
  svg.appendChild(el("line", {x1:G.ML, x2:G.ML + PW(), y1:y, y2:y,
    "class":"thr-h"}));

  // Scenic grip rides the x axis; heritage grip rides the y axis. Each is a
  // 44 px invisible target around a small mark, so a finger can catch it.
  var gs = el("g", {"class":"grip grip-s", tabindex:"0", role:"slider",
    "aria-label":"Scenic threshold",
    "aria-valuemin":"50", "aria-valuemax":"98",
    "aria-valuenow":Math.round(st.cutS * 100)});
  gs.appendChild(el("rect", {x:x - 22, y:bottom - 16, width:44, height:38,
    "class":"grip-hit"}));
  gs.appendChild(el("path", {"class":"grip-body",
    d:"M " + x + " " + (bottom - 7) + " l 6.5 11 l -13 0 Z"}));
  svg.appendChild(gs);

  var gh = el("g", {"class":"grip grip-h", tabindex:"0", role:"slider",
    "aria-label":"Heritage threshold",
    "aria-valuemin":"50", "aria-valuemax":"98",
    "aria-valuenow":Math.round(st.cutH * 100)});
  gh.appendChild(el("rect", {x:G.ML - 22, y:y - 22, width:38, height:44,
    "class":"grip-hit"}));
  gh.appendChild(el("path", {"class":"grip-body",
    d:"M " + (G.ML + 7) + " " + y + " l -11 6.5 l 0 -13 Z"}));
  svg.appendChild(gh);

  dragging(gs, "s");
  dragging(gh, "h");
}

/* Pointer events, not mouse events: one code path covers mouse, pen and touch.
   THE MOVE AND UP LISTENERS GO ON `window`, NOT ON THE GRIP. Dragging calls
   render(), render() empties the SVG and rebuilds every node, so the grip the
   drag started on is destroyed on the first move -- setPointerCapture on it
   was silently lost with it and the drag stopped dead after one pixel. The
   window outlives every redraw, so the drag survives the thing it redraws.
   `dragged` is module-level so the rebuilt grip does not restart it. */
var dragged = null;

function dragging(g, axis){
  g.addEventListener("pointerdown", function(ev){
    ev.preventDefault();
    dragged = axis;
    moveTo(ev);
  });

  // Keyboard, because a drag-only control is unreachable without a pointer.
  g.addEventListener("keydown", function(ev){
    var step = ev.shiftKey ? 0.05 : 0.01, d = 0;
    if (ev.key === "ArrowRight" || ev.key === "ArrowUp") d = step;
    else if (ev.key === "ArrowLeft" || ev.key === "ArrowDown") d = -step;
    else return;
    ev.preventDefault();
    if (axis === "s") cutS = clampCut(cutS + d);
    else cutH = clampCut(cutH + d);
    render();
    // The grip that had focus was just destroyed by the redraw; hand focus to
    // its replacement so a second arrow key keeps working.
    var next = svg.querySelector(".grip-" + axis);
    if (next) next.focus();
  });
}

function moveTo(ev){
  if (!dragged) return;
  var pt = svgPoint(ev);
  if (dragged === "s") cutS = clampCut(invx(pt.x));
  else cutH = clampCut(invy(pt.y));
  render();
}

window.addEventListener("pointermove", function(ev){
  if (!dragged) return;
  ev.preventDefault();
  moveTo(ev);
});
window.addEventListener("pointerup", function(){ dragged = null; });
window.addEventListener("pointercancel", function(){ dragged = null; });

/* Client pixels are not user units once the SVG is scaled to its box, and it
   always is -- width:100% with a measured viewBox. Convert through the
   element's own bounding rect rather than assuming 1:1. */
function svgPoint(ev){
  var r = svg.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left) * (G.W / r.width),
    y: (ev.clientY - r.top) * (G.H / r.height)
  };
}

function render(){
  var st = state();
  elParkVal.textContent = st.parkM >= PARK_MAX ? "off" : st.parkM;
  /* Write the cuts back to the sliders. This is what keeps a grip drag and a
     slider showing the same number; setting .value on a range the user is not
     touching is inert, so there is no feedback loop with the input handlers
     below. */
  var ps = Math.round(st.cutS * 100), ph = Math.round(st.cutH * 100);
  if (+elCutS.value !== ps) elCutS.value = ps;
  if (+elCutH.value !== ph) elCutH.value = ph;
  elCutSVal.textContent = ps;
  elCutHVal.textContent = ph;
  drawPlot(st);
}

elPark.addEventListener("input", render);
elCutS.addEventListener("input", function(){
  cutS = clampCut(+elCutS.value / 100); render();
});
elCutH.addEventListener("input", function(){
  cutH = clampCut(+elCutH.value / 100); render();
});

/* ---- expand to full screen ---- */
var ICON_EXPAND =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
  ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/>' +
  '<path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
var ICON_COLLAPSE =
  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
  ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M3 8h3a2 2 0 0 0 2-2V3"/><path d="M16 3v3a2 2 0 0 0 2 2h3"/>' +
  '<path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M8 21v-3a2 2 0 0 0-2-2H3"/></svg>';

var btnExpand = document.getElementById("expand");
function setExpanded(on){
  expanded = on;
  panel.classList.toggle("expanded", on);
  scrim.classList.toggle("on", on);
  btnExpand.setAttribute("aria-pressed", on ? "true" : "false");
  btnExpand.innerHTML = on ? ICON_COLLAPSE : ICON_EXPAND;
  var lab = on ? "Close full screen" : "Expand the plot to full screen";
  btnExpand.setAttribute("aria-label", lab);
  btnExpand.setAttribute("title", on ? "Close full screen"
                                     : "Expand to full screen");
  document.body.style.overflow = on ? "hidden" : "";
  // The domain changes with `expanded`, so cuts set in one view have to be
  // pulled back inside the other before the next draw.
  requestAnimationFrame(function(){
    cutS = clampCut(cutS); cutH = clampCut(cutH);
    render();
  });
}
/* Embedded in design/index.html, the PARENT owns expansion: its .mapctl opens
   a full-viewport overlay, exactly as it does for the live maps. A second
   button in the same corner -- one that could only ever fill the iframe, not
   the page -- would be both redundant and wrong, so it stands down whenever
   this document is not the top one. Standalone, it is the only control there
   is and it stays. */
if (window.top !== window.self) {
  btnExpand.parentNode.removeChild(btnExpand);
} else {
  btnExpand.innerHTML = ICON_EXPAND;
  btnExpand.addEventListener("click", function(){ setExpanded(!expanded); });
}
scrim.addEventListener("click", function(){ setExpanded(false); });
document.addEventListener("keydown", function(ev){
  if (ev.key === "Escape" && expanded) setExpanded(false);
});

var rt;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(render, 120);
});

render();
</script>
