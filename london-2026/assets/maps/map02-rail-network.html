     with `html { font-size: 62.5% }`, so every rem here was 10 px rather than
     16 and the whole label scale rendered at 62.5% of what the style kit means.
     !important because folium emits its CDN <link>s after this block, so an

     folium_map_kit.KIT_CSS. */

  .leaflet-container { background: #FAF8F3; font-family: "Noto Sans", system-ui, sans-serif; }

     label idiom rather than Leaflet's default white bubble.

    background: #FAF8F3; border: 1px solid #E4DCCF; border-radius: 2px;
    box-shadow: 0 1px 2px rgba(32,25,19,.10); color: #201913;
    font-family: "Source Code Pro", ui-monospace, monospace;
    font-size: .74rem; letter-spacing: .1em; text-transform: uppercase;
    padding: .3rem .5rem; white-space: nowrap;
  }
  .leaflet-tooltip.rail-tip::before { display: none; }

  /* Station name on click. */
  .leaflet-popup.rail-pop .leaflet-popup-content-wrapper {
    background: #FAF8F3; color: #201913; border: 1px solid #E4DCCF;
    border-radius: 2px; box-shadow: 0 2px 10px rgba(32,25,19,.10);

  .leaflet-popup.rail-pop .leaflet-popup-tip { background: #FAF8F3; }

  .rail-pop .st-meta {
    display: block; margin-top: .22rem; color: #6B5F52;
    font-family: "Source Code Pro", ui-monospace, monospace;
    font-size: .74rem; letter-spacing: .08em; text-transform: uppercase;
  }

  /* Controls and attribution, pulled into the warm palette. */

    background: #FAF8F3; color: #201913; border-bottom-color: #E4DCCF;
    font-family: "Noto Sans", system-ui, sans-serif;
  }
  .leaflet-bar a:hover { background: #F1ECE1; color: #201913; }
  .leaflet-control-attribution {
    background: rgba(250,248,243,.82) !important; color: #6B5F52;
    font-family: "Noto Sans", system-ui, sans-serif; font-size: .7rem;

  }

  var lastNarrow = null;

  // Tap tolerance, in CSS px, added to every layer's own hit radius.
  //
  // 36 on touch is not a guess: measured over the overlay's opening view, it
  // puts 92% of the frame within reach of a line or a station, and 99% within
  // two taps. A map that ignores a tap reads as broken; a label you did not
  // mean to open costs one more tap to replace. The asymmetry is the whole
  // argument. 5 on a mouse because a 3 px line is poor acquisition for a
  // pointer too, and it costs nothing.
  var TOUCH_TOL = 36, MOUSE_TOL = 5;

  // Stations win inside this radius, lines outside it. 22 px makes each station
  // a 44 px target -- the platform minimum -- rather than an arbitrary number.
  // Unbounded station priority would swallow the whole frame at TOUCH_TOL and
  // make line labels unreachable.

  // reader who has panned or zoomed is not yanked back by a resize or by the
  // address bar collapsing on a phone.
  // The frame this view was designed around IS the zoom floor. Two things fall
  // out of that. Cartographically, the map can never be zoomed out into grey
  // emptiness around a tiny network -- every view is one somebody chose. And
  // for the wheel: Leaflet zooms OUT on a downward wheel, which is the
  // direction people read in, so a map already at its floor cannot consume a
  // downward scroll at all. It passes to the page with nothing wasted.
  //
  // The ceiling is four levels up, capped at 16. Past that the 8 m simplified
  // geometry starts to show as geometry rather than as track.

    if (!force && narrow === lastNarrow) { return; }

  }

    if (!m) { return setTimeout(arm, 60); }

    widenTapTargets(m);
    fitForWidth(m, true);

    // Leaflet has taken its new container size, so fitBounds would size the
    // view to the OLD width and leave the map zoomed for a viewport that no
    // longer exists.

    releaseWheelAtLimits(m);
    sizeStations(m);
    m.on('zoomend', function () { sizeStations(m); });

    // discoverability strategy: SHOW the interaction's output rather than
    // describe it. The reader's first tap anywhere dismisses it, and because
    // Leaflet closes popups on 'preclick' -- before the layer's own 'click' --
    // a dismissing tap that lands on a line closes this AND opens that line's
    // label in the same gesture. The chain teaches itself on the first try.

  // page have the event either. Zoom limits alone do not release the scroll,
  // they only stop the zooming.

  // the limit in the wheel's own direction the event is stopped short of
  // Leaflet: nothing calls preventDefault, so the browser's default action

  // than merely generous. A wide tolerance then means "always find the closest
  // thing", never "find an arbitrary thing".

  // is actually hunting for on a rail map, and as point targets they are harder

  // 400 px across, and 600 fixed-radius dots turn every line into a string of
  // beads; zoomed in they are also too small to tap. Scaling solves both --
  // texture when the map is a picture, targets when it is a tool. The ratio
  // between St Pancras and the rest is preserved by scaling from each marker's
  // own starting radius rather than assigning absolute sizes.

      if (l._baseR === undefined) { l._baseR = l.getRadius(); }
      l.setRadius(l._baseR * f);
    });
  }

  arm();
